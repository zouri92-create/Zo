<style>
/* Layout: a pocket field guide. One column, a card per model, a bottom bar with four places:
   the plan (where you are on the 87-model path), this week's model, the full index, and you. */
:root {
  --bg: #eef3f2;
  --paper: #ffffff;
  --ink: #13201f;
  --muted: #586a68;
  --line: #d5dfdd;
  --teal: #0f4c4a;
  --teal-soft: #dcece9;
  --orange: #c9531d;
  --orange-soft: #fbe5d8;
  --ok: #2c7a45;
  --bad: #b23a2e;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1514; --paper: #142120; --ink: #e2ebe9; --muted: #95a8a5; --line: #263936;
  --teal: #62c2b7; --teal-soft: #17302d; --orange: #f08a54; --orange-soft: #3a2316;
  --ok: #7fd197; --bad: #f08a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1514; --paper: #142120; --ink: #e2ebe9; --muted: #95a8a5; --line: #263936;
  --teal: #62c2b7; --teal-soft: #17302d; --orange: #f08a54; --orange-soft: #3a2316;
  --ok: #7fd197; --bad: #f08a80; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-ui); margin: 0 }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 12px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.15; text-wrap: balance }
h1 { font-size: clamp(2rem, 7vw, 2.6rem); letter-spacing: -.01em }
h2 { font-size: 1.5rem }
h3 { font-size: 1.15rem }
p { margin: 0 }
a { color: var(--teal) }
.eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--orange) }
.muted { color: var(--muted) }
.small { font-size: .88rem }
.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
section.block { display: flex; flex-direction: column; gap: 12px; padding-block: 22px; border-top: 1px solid var(--line) }

button, .btn { font: 600 .95rem var(--f-ui); border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper);
  color: var(--ink); padding: .6rem 1.1rem; cursor: pointer; display: inline-flex; align-items: center; gap: .45rem; text-decoration: none }
button:hover { border-color: var(--teal) }
button:disabled { opacity: .55; cursor: default }
button.primary, .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--paper) }
.small { font-size: .88rem }
button.small, .btn.small { padding: .4rem .8rem }
button.ghost { background: transparent; border-color: transparent; padding-inline: .5rem }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, .item:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px }
input[type=text], input[type=search], textarea { width: 100%; font: 400 1rem var(--f-ui); color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--line); border-radius: 12px; padding: .7rem .85rem }
textarea { min-height: 96px; resize: vertical }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .92rem }

/* top bar */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 8px 14px }
.top .left { justify-self: start } .top .right { justify-self: end }
.logo { display: inline-flex; align-items: center; gap: 10px; font: 700 1.6rem var(--f-ui); letter-spacing: .02em; color: var(--ink); text-decoration: none }
.mark { width: 40px; height: 40px; border-radius: 10px; background: var(--teal); display: grid; place-items: center; position: relative;
  color: #fff; font: 800 1.05rem var(--f-ui); letter-spacing: -.02em }
.mark span { display: inline-block }
.mark .o { width: 17px; height: 17px; border-radius: 50%; border: 3.5px solid #f08a54; margin-left: 1px; vertical-align: -2px }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; padding: 0; justify-content: center }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr) }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 10px; color: var(--muted);
  text-decoration: none; font-size: .8rem; font-weight: 600 }
nav.tabs a svg { width: 26px; height: 26px; padding: 3px; border-radius: 999px; box-sizing: content-box; padding-inline: 14px }
nav.tabs a[aria-current="page"] { color: var(--ink) }
nav.tabs a[aria-current="page"] svg { background: var(--teal); color: var(--paper) }

/* plan */
.hero { background: var(--teal); color: #fff; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px }
.hero .eyebrow { color: #ffb48a }
.hero h1 { color: #fff }
.hero p { color: #d7ecea }
.hero button { background: #fff; color: #0f4c4a; border-color: #fff }
.hero button.alt { background: transparent; color: #fff; border-color: rgba(255,255,255,.45) }
.days { display: flex; gap: 6px }
.days i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22) }
.days i.on { background: #ffb48a }
.bar { height: 8px; background: var(--teal-soft); border-radius: 4px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 4px }
.cats { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; font-size: .9rem }
.cats .bar { grid-column: 1 / -1; height: 5px; margin-top: -4px }
.cats span:nth-child(3n+2) { font-variant-numeric: tabular-nums; color: var(--muted) }

/* list items */
.list { display: flex; flex-direction: column }
.item { display: flex; flex-direction: column; gap: 6px; padding: 18px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; cursor: pointer }
.item:hover h3 { color: var(--teal) }
.item h3 { font-size: 1.45rem }
.item p { color: var(--muted) }
.item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--ink) }
.pill { font-size: .75rem; font-weight: 700; border-radius: 999px; padding: .15rem .6rem; background: var(--teal-soft); color: var(--teal) }
.pill.orange { background: var(--orange-soft); color: var(--orange) }
.pill.ok { background: var(--teal); color: var(--paper) }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none }
.chips button { white-space: nowrap; padding: .4rem .85rem; font-size: .85rem }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* model page */
.bolts { display: inline-flex; gap: 2px; vertical-align: middle }
.bolts svg { width: 20px; height: 20px; color: var(--line) }
.bolts svg.on { color: var(--orange) }
.idea { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; font-size: 1.15rem; line-height: 1.5 }
.toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px }
.toggle button { border: 0; background: transparent; justify-content: center }
.toggle button[aria-pressed="true"] { background: var(--orange); color: #fff }
.prose { display: flex; flex-direction: column; gap: 12px; font-size: 1.05rem; max-width: 65ch }
.prose h3 { margin-top: 6px }
.prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px }
details { border-top: 1px solid var(--line) }
details:last-of-type { border-bottom: 1px solid var(--line) }
summary { list-style: none; cursor: pointer; padding: 15px 4px; font-weight: 700; display: flex; justify-content: space-between; gap: 12px }
summary::-webkit-details-marker { display: none }
summary::after { content: "+"; font-size: 1.4rem; line-height: 1; color: var(--muted) }
details[open] summary::after { content: "−" }
details > p { padding: 0 4px 16px; color: var(--muted) }
.ex { display: grid; gap: 10px }
.ex article { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px }
.challenge { background: var(--orange-soft); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px }
.challenge .eyebrow { color: var(--orange) }
.quiz { display: flex; flex-direction: column; gap: 18px }
.q { display: flex; flex-direction: column; gap: 10px }
.q .opts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start }
.q .opts button { border-radius: 12px; text-align: left; font-weight: 500 }
.q .opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--paper)) }
.q .opts button.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--paper)) }
.q .why { font-size: .95rem; color: var(--muted) }
.answer { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px }
.turn-user { align-self: flex-end; background: var(--teal-soft); border-radius: var(--r); padding: 10px 14px; max-width: 90% }
.entry { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px }
.entry .fb { border-left: 3px solid var(--teal); padding-left: 10px; color: var(--muted); font-size: .95rem }
.skel { display: flex; flex-direction: column; gap: 10px }
.skel i { display: block; height: 14px; border-radius: 7px; background: var(--line); animation: pulse 1.4s ease-in-out infinite }
.skel i:nth-child(2n) { width: 82% } .skel i:nth-child(3n) { width: 64% }
@keyframes pulse { 50% { opacity: .45 } }
@media (prefers-reduced-motion: reduce) { .skel i { animation: none } }
.note { background: var(--teal-soft); color: var(--ink); border-radius: var(--r); padding: 14px 16px; font-size: .95rem }
.links { display: flex; gap: 8px; flex-wrap: wrap }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--bg); padding: .7rem 1.1rem; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px) }
.checks { display: flex; flex-wrap: wrap; gap: 8px }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; padding: .35rem .8rem; background: var(--paper); cursor: pointer; font-size: .92rem }
.radios { display: flex; flex-direction: column; gap: 8px }
.radios label { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer }
.radios label span { display: flex; flex-direction: column }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.ex-list { display: flex; flex-direction: column; gap: 10px }
.ex-list label { display: flex; gap: 12px; align-items: flex-start; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer }
.ex-list input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--teal); flex: none }
.ex-list label.done span { color: var(--muted); text-decoration: line-through }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px }
.today { display: grid; gap: 12px }
.today article { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px }
.links-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.links-row a { justify-content: center }
</style>

<script>
const LIB = [];
LIB.push(
{t:"La mappa non è il territorio",d:1,
sp:"Ogni descrizione della realtà, che sia una mappa, un bilancio, una recensione o la tua idea su una persona, è una semplificazione. Le semplificazioni sono utili proprio perché tolgono dettagli, ma per lo stesso motivo possono ingannarti. Il modello ti ricorda di chiederti cosa la mappa lascia fuori e di andare a vedere il territorio quando la posta in gioco è alta.",
ap:["Usiamo mappe ovunque: il curriculum di un candidato, le stelle di un ristorante, il voto di uno studente, un grafico delle vendite. Ognuna comprime una realtà complessa in pochi segni. Questo ci fa risparmiare tempo, ma la mappa è stata disegnata da qualcuno, in un certo momento e con certi scopi.","Il problema nasce quando confondiamo la mappa con la cosa stessa: ci fidiamo del numero e smettiamo di osservare. Le mappe invecchiano, possono essere sbagliate o costruite per convincerti. La regola pratica è usare la mappa per orientarti e il territorio per decidere."],
ri:[["Ti fidi solo dei numeri","Decidi guardando un indicatore senza sapere come è stato calcolato."],["La realtà ti sorprende","Le cose vanno diversamente da come diceva il piano o la descrizione."],["Giudichi da un'etichetta","Ti fai un'idea di una persona da un titolo, un voto o un profilo social."]],
es:[["Lavoro","Il report dice che i clienti sono soddisfatti al 90%, ma risponde solo chi è contento. Parlare con cinque clienti che se ne sono andati mostra un'altra realtà."],["Relazioni","Ti sei fatto un'idea di un collega da quello che dicono gli altri. Dopo un caffè insieme scopri che la tua mappa era incompleta."]],
ex:["Scegli un numero che guardi spesso (stipendio, peso, voti, follower) e scrivi tre cose importanti che quel numero non misura.","Prima di una decisione questa settimana, chiediti: sto guardando la mappa o il territorio? Poi fai una verifica diretta: una telefonata, una visita, una prova.","Pensa a una persona che giudichi male. Scrivi su quali informazioni si basa il tuo giudizio e quanto sono di prima mano."],
q:["Chi ha disegnato questa mappa, quando e con quale scopo?","Cosa lascia fuori questa descrizione?","Posso verificare di persona prima di decidere?"],
er:"Buttare via tutte le mappe. Le semplificazioni servono: l'errore è dimenticare che sono semplificazioni.",
qz:[["Un'app di ristoranti dà 4,8 stelle a un locale. Cosa suggerisce il modello?",["Andarci: il voto è alto","Chiedersi quante recensioni ci sono, quanto sono recenti e chi le scrive","Ignorare ogni recensione","Fidarsi solo delle recensioni negative"],1,"Il voto è una mappa utile, ma va letto sapendo come è stato costruito."],["Quale frase esprime meglio il modello?",["I modelli sono inutili","La descrizione di una cosa non è la cosa stessa","Bisogna sempre fidarsi degli esperti","La realtà è impossibile da conoscere"],1,"Il modello invita a distinguere la rappresentazione dalla realtà, non a rifiutare le rappresentazioni."]]},

{t:"Il cerchio di competenza",d:2,
sp:"Ognuno di noi conosce davvero bene alcune aree: lì vede dettagli e rischi che altri non vedono. Fuori da quel cerchio siamo dilettanti, anche se ci sentiamo sicuri. Il modello ti chiede di sapere dove passa il confine: dentro puoi agire con fiducia, fuori conviene andare piano, chiedere a chi sa o imparare prima di rischiare.",
ap:["Il cerchio di competenza non dipende da quanto sei intelligente, ma da quanta esperienza diretta hai accumulato. Un meccanico capisce un motore in pochi secondi, un medico legge un sintomo, un genitore capisce l'umore del figlio da uno sguardo. Dentro il cerchio sai cosa non sai.","Il pericolo è la fiducia presa in prestito: chi è bravo in un campo tende a sentirsi bravo anche in altri. Fuori dal cerchio aiuta fare domande, cercare una persona competente, partire in piccolo e ampliare il cerchio con pazienza, un pezzo alla volta."],
ri:[["Non sai spiegarlo semplicemente","Se non riesci a spiegare come funziona una cosa a un bambino, forse sei fuori dal cerchio."],["Non vedi i rischi","Ti sembra tutto facile e non riesci a immaginare cosa potrebbe andare storto."],["Decidi per sentito dire","Ti basi su consigli di amici o articoli invece che su esperienza diretta."]],
es:[["Soldi","Un amico ti consiglia di investire in una criptovaluta. Se non sai spiegare come guadagna valore, sei fuori dal cerchio: meglio non investire o farlo con una cifra piccola."],["Lavoro","Un ottimo venditore viene promosso a gestire il magazzino e prende decisioni affrettate. Riconoscere il nuovo terreno lo avrebbe spinto ad ascoltare chi ci lavora da anni."]],
ex:["Disegna tre cerchi: cosa conosci davvero bene, cosa conosci un po', cosa non conosci. Metti in ciascuno almeno cinque argomenti della tua vita.","Trova una decisione in sospeso e chiediti in quale cerchio cade. Se è fuori, individua una persona competente a cui chiedere.","Scegli un'area vicina al tuo cerchio e dedica 20 minuti al giorno per una settimana a impararla."],
q:["Saprei spiegare a qualcuno come funziona davvero?","Cosa potrebbe andare storto che io non vedo?","Chi conosce questo campo meglio di me?"],
er:"Restare chiusi nel cerchio per paura. Il cerchio si allarga imparando, ma con passi piccoli e consapevoli.",
qz:[["Un medico esperto si sente sicuro di investire in borsa da solo. Cosa direbbe il modello?",["La sua intelligenza basta","Deve verificare se la finanza è dentro il suo cerchio","I medici non devono investire","Deve copiare un amico"],1,"La competenza in un campo non si trasferisce automaticamente a un altro."],["Qual è il segnale più chiaro di essere fuori dal cerchio?",["Ti piace l'argomento","Non riesci a immaginare cosa potrebbe andare storto","Ne hai sentito parlare spesso","Hai letto un articolo"],1,"Chi conosce davvero un campo ne vede i rischi."]]},

{t:"Il pensiero per principi primi",d:3,
sp:"Spesso ragioniamo per analogia: facciamo come si è sempre fatto o come fanno gli altri. Il pensiero per principi primi invece scompone un problema nei suoi elementi di base, quelli che sono sicuramente veri, e da lì ricostruisce la soluzione. È più faticoso, ma ti permette di trovare strade che nessuno aveva considerato.",
ap:["Il metodo ha tre passi: identifica le ipotesi che dai per scontate, scomponi il problema nelle verità di base (costi, bisogni, leggi fisiche, vincoli reali) e costruisci una soluzione nuova partendo da quelle. Una tecnica utile è chiedere «perché?» più volte di fila finché arrivi a qualcosa che non si può più scomporre.","Non serve usarlo sempre: per la maggior parte delle scelte quotidiane l'analogia funziona bene e costa meno. Diventa prezioso quando sei bloccato, quando tutti dicono che una cosa è impossibile o troppo cara, o quando vuoi innovare davvero."],
ri:[["«Si è sempre fatto così»","La risposta a una domanda è un'abitudine, non una ragione."],["Ti senti bloccato","Tutte le soluzioni che vedi sono variazioni della stessa idea."],["Un costo sembra fisso","Accetti un prezzo o un limite senza sapere da cosa dipende."]],
es:[["Casa","Un divano nuovo costa troppo. Invece di cercarne uno più economico, ti chiedi cosa ti serve davvero: un posto comodo per tre persone. Scopri che una struttura usata e cuscini nuovi costano un terzo."],["Salute","Pensi di non avere tempo per allenarti perché la palestra richiede due ore. Scomponendo: ti servono movimento e costanza. Venti minuti a casa ogni mattina soddisfano entrambi."]],
ex:["Scegli un problema che ti blocca. Scrivi cinque ipotesi che dai per scontate e chiediti per ciascuna: è davvero vera?","Applica la tecnica dei cinque perché a un'abitudine quotidiana: perché la faccio così? Fermati quando arrivi a un bisogno di base.","Prendi una spesa fissa (bollette, abbonamenti, trasporti) e scomponila nei suoi costi reali. Cerca un modo diverso di soddisfare lo stesso bisogno."],
q:["Cosa so con certezza, e cosa sto solo supponendo?","Qual è il bisogno di base che sto cercando di soddisfare?","Se partissi da zero, oggi, come lo farei?"],
er:"Usarlo per ogni piccola scelta. È uno strumento costoso: riservalo ai problemi importanti o bloccati.",
qz:[["Quale domanda è tipica del pensiero per principi primi?",["Come fanno i concorrenti?","Da quali elementi è composto davvero questo problema?","Qual è la soluzione più popolare?","Cosa abbiamo fatto l'anno scorso?"],1,"Il metodo scompone il problema invece di copiare soluzioni esistenti."],["Quando conviene di più usarlo?",["Per scegliere cosa mangiare a pranzo","Quando sei bloccato su un problema importante","Mai, è troppo lento","Solo in fisica"],1,"Richiede sforzo: rende di più su problemi importanti dove le soluzioni abituali non funzionano."]]},

{t:"L'esperimento mentale",d:2,
sp:"Un esperimento mentale è una prova fatta nella testa: immagini di cambiare una condizione e segui le conseguenze passo dopo passo. Costa poco, non rischia nulla e ti permette di esplorare scenari impossibili o troppo cari da provare davvero. Usalo per chiarire cosa vuoi, verificare un'idea o capire cosa conta davvero in una scelta.",
ap:["Un buon esperimento mentale ha una domanda precisa, cambia una sola cosa alla volta e segue le conseguenze con onestà, anche quando non ti piacciono. Domande come «Se avessi già i soldi, farei ancora questo lavoro?» o «Se nessuno lo sapesse, lo farei lo stesso?» tolgono il rumore e mostrano le tue vere ragioni.","Il limite è che la nostra immaginazione è influenzata da paure e desideri. Per renderlo più affidabile scrivi i passaggi, chiedi a qualcuno di trovare il punto debole e, quando possibile, conferma con una piccola prova reale."],
ri:[["Non puoi provarlo davvero","La scelta è costosa, irreversibile o rischiosa."],["Non sai cosa vuoi","Hai motivazioni mescolate e non capisci quale conta di più."],["Discussione in stallo","Due persone litigano su principi astratti senza esempi."]],
es:[["Lavoro","Ti offrono una promozione. Immagini una giornata tipo tra un anno nel nuovo ruolo, ora per ora. Ti accorgi che le riunioni che odi sarebbero il 70% del tempo."],["Te stesso","Ti chiedi: se avessi solo cinque anni da vivere, cosa smetterei di fare domani? La risposta ti dice cosa conta davvero."]],
ex:["Scegli una decisione aperta e immagina di averla già presa. Descrivi per iscritto una giornata qualsiasi fra sei mesi.","Fai la domanda «Se il denaro non fosse un problema, cosa farei di diverso?» e scrivi tre risposte. Cerca una piccola parte che puoi fare comunque.","In una discussione, proponi un caso estremo («E se tutti facessero così?») e osserva come cambia il ragionamento."],
q:["Cosa succederebbe se cambiassi solo questa condizione?","Come sarebbe una giornata normale dopo questa scelta?","Quali conseguenze sto evitando di immaginare?"],
er:"Immaginare solo lo scenario che ci piace. Un esperimento onesto segue anche le conseguenze scomode.",
qz:[["Qual è la caratteristica di un buon esperimento mentale?",["Cambia molte cose insieme","Cambia una condizione e ne segue le conseguenze","Serve solo agli scienziati","Deve avere un esito positivo"],1,"Cambiare una variabile alla volta rende chiaro il collegamento tra causa ed effetto."],["Perché è utile prima di una scelta irreversibile?",["Sostituisce ogni informazione reale","Permette di esplorare le conseguenze senza costi","Garantisce il successo","Evita di dover decidere"],1,"Si può esplorare uno scenario senza pagarne il prezzo."]]},

{t:"Il pensiero di secondo ordine",d:2,
sp:"Ogni azione ha conseguenze immediate (primo ordine) e conseguenze delle conseguenze (secondo ordine). La maggior parte delle persone si ferma alle prime. Il modello ti chiede di fare una domanda in più: «E poi cosa succede?». Spesso le soluzioni che sembrano ottime subito creano problemi più tardi, e alcune scelte faticose oggi pagano molto domani.",
ap:["Le conseguenze di secondo ordine nascono perché il mondo reagisce alle nostre azioni: le persone si adattano, i sistemi si riequilibrano, le abitudini si consolidano. Mangiare un dolce dà piacere subito, ma ripetuto ogni giorno cambia la salute. Dire sempre sì a tutti fa piacere agli altri subito, ma ti toglie tempo e insegna loro che sei sempre disponibile.","Per usarlo, prendi la decisione e chiediti cosa succede tra dieci minuti, dieci mesi e dieci anni. Chiediti anche come reagiranno le altre persone coinvolte. Non serve prevedere tutto: basta andare un passo oltre la prima conseguenza."],
ri:[["Soluzione troppo facile","Il problema sembra risolto subito, senza fatica."],["Gli altri reagiranno","La scelta riguarda persone che cambieranno comportamento."],["Effetti che si accumulano","Una piccola azione ripetuta ogni giorno."]],
es:[["Famiglia","Dare il telefono al bambino per farlo stare tranquillo funziona subito. Il secondo ordine: si abitua a non sapersi annoiare e ogni attesa diventa una lotta."],["Lavoro","Un manager premia chi chiude più pratiche. Effetto secondario: le pratiche vengono chiuse in fretta e tornano indietro con errori."]],
ex:["Per ogni decisione di oggi, anche piccola, chiediti ad alta voce: «E poi?». Fallo almeno tre volte.","Scegli un'abitudine e scrivi le sue conseguenze tra 10 minuti, 10 mesi e 10 anni.","Pensa a una regola che vuoi introdurre (in casa, al lavoro) e scrivi come le persone potrebbero adattarsi per aggirarla."],
q:["E poi cosa succede?","Come reagiranno le altre persone?","Come sarà la situazione tra 10 mesi e tra 10 anni?"],
er:"Paralizzarsi cercando di prevedere ogni conseguenza. Basta guardare uno o due passi oltre.",
qz:[["Quando prendi una decisione importante, quale domanda è più utile?",["Qual è la soluzione più rapida?","E poi cosa succede?","Cosa farebbero gli altri?","Quanto costa?"],1,"È la domanda che porta oltre le conseguenze immediate."],["Una città abbassa molto il prezzo dei parcheggi per aiutare i negozi. Qual è un effetto di secondo ordine?",["I negozi vendono subito di più","Le strade si riempiono di traffico e i posti sono sempre occupati","Il prezzo resta basso","Nessuno"],1,"La reazione delle persone al prezzo basso crea un nuovo problema."]]},

{t:"Il pensiero probabilistico",d:3,
sp:"Il futuro non è certo: è fatto di possibilità più o meno probabili. Il pensiero probabilistico sostituisce il «succederà» o «non succederà» con stime come «è probabile al 70%». Ti aiuta a prepararti a più scenari, a dare il giusto peso ai rischi e ad aggiornare le tue idee quando arrivano informazioni nuove.",
ap:["Tre idee lo rendono pratico. Primo, parti dalla frequenza di base: quante volte succede di solito una cosa simile? Secondo, aggiorna la stima con le informazioni nuove invece di difendere la tua prima opinione. Terzo, considera anche le conseguenze: un evento poco probabile ma disastroso merita attenzione.","Una buona decisione può avere un cattivo risultato per sfortuna, e una cattiva decisione può andare bene per caso. Giudica le scelte da come sono state prese, con le informazioni disponibili, non solo dall'esito."],
ri:[["Parli in certezze","Usi parole come «sicuramente» o «impossibile»."],["Giudichi dal risultato","Pensi che una scelta fosse giusta solo perché è andata bene."],["Ignori i casi tipici","Ti concentri sulla storia speciale e non su cosa succede di solito."]],
es:[["Soldi","Apri un bar perché un amico ci è riuscito. La frequenza di base dice che molti locali nuovi chiudono nei primi anni: conviene un piano B e un budget prudente."],["Salute","Hai paura di volare ma guidi ogni giorno senza pensarci. Confrontando le probabilità, il rischio maggiore è l'auto: meglio mettere la cintura e non usare il telefono."]],
ex:["Per tre previsioni di questa settimana (un ritardo, una risposta, un risultato) scrivi una percentuale. A fine settimana controlla quante erano giuste.","Prima di una decisione, chiediti: quante volte succede di solito? Cerca un dato o una stima onesta.","Scrivi tre scenari per un progetto: migliore, normale, peggiore. Prepara una mossa per ciascuno."],
q:["Quanto è probabile, in percentuale?","Cosa succede di solito in casi simili?","Quale informazione nuova cambierebbe la mia idea?"],
er:"Credere che probabile significhi certo. Anche un evento all'80% non accade una volta su cinque.",
qz:[["Un amico ha vinto investendo in un'azione rischiosa. Cosa dice il modello?",["Era sicuramente una buona scelta","Il risultato da solo non dice se la decisione era buona","Bisogna copiarlo","Ha avuto solo fortuna"],1,"Si giudica la decisione, non solo l'esito, che può dipendere dal caso."],["Cos'è la frequenza di base?",["Il numero di volte che hai pensato a qualcosa","Quanto spesso succede di solito un evento simile","La tua impressione personale","Il risultato migliore possibile"],1,"È il punto di partenza per stimare una probabilità."]]},

{t:"L'inversione",d:2,
sp:"Invece di chiederti come ottenere un risultato, chiediti cosa lo rovinerebbe sicuramente, ed evitalo. Molti problemi diventano più chiari guardati al contrario. Spesso è più facile evitare gli errori evidenti che trovare la mossa geniale, e chi evita gli errori ottiene già molto.",
ap:["L'inversione si usa in due modi. Puoi invertire l'obiettivo: invece di «come essere felice nel mio lavoro?» chiedi «cosa mi renderebbe sicuramente infelice?». Oppure puoi fare un pre-mortem: immagina che il progetto sia fallito tra un anno e chiediti perché. Le risposte ti mostrano i rischi da prevenire.","Il modello non sostituisce il pensiero in avanti, lo completa. Dopo aver elencato cosa evitare, torna all'obiettivo con una lista di trappole in meno."],
ri:[["Obiettivo vago","Non sai da dove cominciare per raggiungerlo."],["Troppa fiducia","Il piano sembra perfetto e nessuno vede rischi."],["Errori ripetuti","Ricadi sempre negli stessi problemi."]],
es:[["Relazioni","Per migliorare il rapporto col partner ti chiedi cosa lo peggiorerebbe sicuramente: non ascoltare, guardare il telefono a cena, criticare davanti agli altri. Smetti di fare quelle tre cose."],["Lavoro","Prima di lanciare un progetto il gruppo immagina che sia fallito. Emergono due rischi: scadenze irrealistiche e un fornitore inaffidabile. Li gestiscono subito."]],
ex:["Prendi un obiettivo personale e scrivi dieci modi per fallire sicuramente. Poi verifica quali stai già facendo.","Fai un pre-mortem di un progetto in corso: «È un anno da oggi ed è fallito. Perché?» Scrivi almeno cinque cause.","Ogni sera per una settimana scrivi una cosa che hai evitato di fare male, invece di una cosa fatta bene."],
q:["Cosa garantirebbe il fallimento?","Se fosse già andata male, quale sarebbe la causa più probabile?","Cosa posso smettere di fare?"],
er:"Fermarsi alla lista di cose da evitare. Serve anche una direzione positiva.",
qz:[["Vuoi risparmiare di più. Quale domanda usa l'inversione?",["Come guadagno di più?","Cosa mi fa sicuramente spendere troppo?","Quanto risparmiano gli altri?","Qual è il miglior conto?"],1,"Invertire l'obiettivo mostra gli errori da eliminare."],["Cos'è un pre-mortem?",["Un'analisi dopo il fallimento","Immaginare che il progetto sia fallito e cercarne le cause in anticipo","Un modo per evitare i rischi","Un rito per portare fortuna"],1,"Si immagina il fallimento prima che accada per prevenirlo."]]},

{t:"Il rasoio di Occam",d:1,
sp:"Quando hai più spiegazioni per lo stesso fatto, parti da quella che richiede meno ipotesi. Non perché la semplice sia sempre vera, ma perché ogni ipotesi in più è un'occasione in più di sbagliare. Il rasoio taglia le complicazioni inutili e ti fa cercare prima le cause più comuni.",
ap:["Se senti zoccoli in strada, pensa a cavalli, non a zebre. Se il computer non si accende, controlla la presa prima di pensare a un guasto della scheda madre. Le storie complicate ci affascinano, ma richiedono che molte cose siano vere insieme, e questo è raro.","Il rasoio è una regola per scegliere da dove partire, non una prova. A volte la spiegazione giusta è complessa. Se i fatti non tornano con la versione semplice, aggiungi ipotesi una alla volta e solo quando servono."],
ri:[["Teorie elaborate","Per spiegare un fatto serve una catena lunga di supposizioni."],["Ansia che cresce","Immagini la causa più grave invece della più comune."],["Piano complicato","La soluzione ha tante parti che possono rompersi."]],
es:[["Relazioni","Un amico non risponde da un giorno. Invece di pensare che sia arrabbiato con te, considera la spiegazione più semplice: è impegnato."],["Casa","La lavatrice perde acqua. Prima di chiamare il tecnico controlli la guarnizione e il tubo di scarico: è quasi sempre lì."]],
ex:["Quando ti preoccupi per qualcosa questa settimana, scrivi la spiegazione più semplice possibile accanto a quella che temi.","Prendi un tuo piano o una procedura e togli un passaggio. Funziona lo stesso?","Davanti a un problema tecnico, fai una lista delle cause dalla più comune alla più rara e controllale in quell'ordine."],
q:["Qual è la spiegazione con meno supposizioni?","Quante cose devono essere vere perché questa storia funzioni?","Cosa controllo per primo?"],
er:"Usarlo per negare una realtà davvero complessa. Semplice è il punto di partenza, non la conclusione obbligata.",
qz:[["Il telefono si spegne spesso. Quale ipotesi controlli per prima?",["Un virus sofisticato","La batteria scarica o vecchia","Un difetto di fabbrica raro","Qualcuno lo spegne di nascosto"],1,"È la causa più comune e richiede meno ipotesi."],["Il rasoio di Occam dice che...",["La spiegazione semplice è sempre vera","A parità di spiegazione, conviene partire da quella con meno ipotesi","Le cose complesse non esistono","Bisogna ignorare i dettagli"],1,"È un criterio per scegliere da dove partire."]]},

{t:"Il rasoio di Hanlon",d:1,
sp:"Non attribuire a cattiveria ciò che si spiega con distrazione, fretta o ignoranza. Quando qualcuno ti fa un torto, la spiegazione più probabile è quasi sempre che non ci ha pensato, non che voleva colpirti. Questo modello ti risparmia rabbia inutile e conflitti, e ti aiuta a cercare la soluzione vera.",
ap:["Siamo portati a vedere intenzioni ostili, soprattutto quando ci sentiamo feriti. Ma le persone sono impegnate, stanche, distratte e pensano soprattutto ai propri problemi. Una mail sgarbata spesso è scritta di fretta; un ritardo è dovuto al traffico; una dimenticanza è solo una dimenticanza.","Il modello non significa essere ingenui. Se una persona ripete lo stesso comportamento dopo che gliel'hai fatto notare, l'ipotesi della distrazione diventa meno credibile. Parti dalla spiegazione benevola, osserva i fatti e cambia idea se i fatti lo chiedono."],
ri:[["Ti senti attaccato","Leggi un messaggio e pensi «l'ha fatto apposta»."],["Rabbia improvvisa","Reagisci subito senza chiedere spiegazioni."],["Sospetti di complotti","Pensi che un gruppo abbia organizzato qualcosa contro di te."]],
es:[["Lavoro","Un collega non ti mette in copia in una mail importante. Invece di pensare che voglia escluderti, gli chiedi di aggiungerti: si era semplicemente dimenticato."],["Strada","Un'auto ti taglia la strada. Probabilmente il guidatore non ti ha visto. Lasci perdere e ti godi la giornata."]],
ex:["Ogni volta che ti senti offeso questa settimana, scrivi due spiegazioni non cattive per il comportamento dell'altro.","Prima di rispondere a un messaggio che ti irrita, aspetta dieci minuti e rileggilo immaginando che sia stato scritto di fretta.","Ricorda una volta in cui tu hai ferito qualcuno per distrazione. Come avresti voluto essere giudicato?"],
q:["Potrebbe essere stata fretta, distrazione o ignoranza?","Ho chiesto spiegazioni prima di giudicare?","È la prima volta o è un comportamento ripetuto?"],
er:"Giustificare sempre tutto. Se un comportamento dannoso si ripete, va affrontato.",
qz:[["Il tuo capo non risponde alla tua proposta da tre giorni. Cosa suggerisce il modello?",["Non gli interessa il tuo lavoro","Probabilmente è sommerso di cose: mandagli un promemoria gentile","Ti vuole licenziare","Devi lamentarti con il suo capo"],1,"La distrazione è più probabile della cattiveria."],["Quando il rasoio di Hanlon diventa meno valido?",["Quando sei arrabbiato","Quando lo stesso comportamento si ripete nonostante tu l'abbia fatto notare","Mai","Con gli sconosciuti"],1,"I fatti ripetuti cambiano la probabilità delle spiegazioni."]]},

{t:"Lo sconto iperbolico",d:3,
sp:"Diamo molto più valore a una ricompensa immediata che a una futura, anche quando quella futura è più grande. Per questo rimandiamo lo sport, spendiamo invece di risparmiare e scegliamo il telefono invece dello studio. Conoscere questa tendenza ti permette di organizzare l'ambiente in modo che la scelta giusta sia anche quella facile.",
ap:["La particolarità è che lo sconto non è costante: tra 100 euro oggi e 110 tra una settimana molti scelgono oggi, ma tra 100 euro tra un anno e 110 tra un anno e una settimana quasi tutti aspettano. Quando la ricompensa è vicina, la tentazione cresce molto.","Le strategie che funzionano agiscono prima del momento della tentazione: decidere in anticipo, rendere automatiche le scelte buone (risparmio automatico), rendere difficili quelle cattive (niente dolci in casa), avvicinare la ricompensa futura (premiarti subito dopo lo sforzo)."],
ri:[["«Comincio lunedì»","Rimandi sempre l'inizio di qualcosa di utile."],["Scelte che rimpiangi","La sera ti penti di come hai usato la giornata."],["Grandi progetti lontani","Le scadenze lontane non ti fanno muovere."]],
es:[["Soldi","Imposti un bonifico automatico verso il risparmio il giorno dello stipendio. Così non devi scegliere ogni mese tra spendere e risparmiare."],["Studio","Uno studente ha l'esame tra un mese e non studia. Divide il lavoro in obiettivi giornalieri con una piccola ricompensa ogni sera."]],
ex:["Individua una tentazione ricorrente e rendila più difficile: sposta il telefono in un'altra stanza, togli l'app, non comprare quel cibo.","Scegli un obiettivo lontano e trasformalo in un passo da fare oggi, con una ricompensa immediata subito dopo.","Imposta un'azione automatica (risparmio, promemoria, sveglia) che decide al posto tuo nel momento debole."],
q:["Cosa sceglierei se questa decisione fosse tra un mese?","Come posso rendere la scelta giusta più facile adesso?","Quale piccola ricompensa posso avvicinare?"],
er:"Contare solo sulla forza di volontà. Funziona meglio cambiare l'ambiente.",
qz:[["Quale strategia sfrutta meglio il modello per risparmiare?",["Decidere ogni mese quanto risparmiare","Impostare un risparmio automatico il giorno dello stipendio","Guardare il conto ogni giorno","Aspettare un aumento"],1,"Decidere una volta sola, in anticipo, evita la tentazione del momento."],["Perché rimandiamo lo sport?",["Perché è inutile","Perché il beneficio è lontano e la fatica è subito","Perché siamo pigri per natura","Perché costa troppo"],1,"Il costo immediato pesa più del beneficio futuro."]]},

{t:"Falsificabilità",d:3,
sp:"Un'affermazione è utile quando dice cosa la smentirebbe. «Domani pioverà a Milano» può rivelarsi falsa, quindi si può verificare. «Prima o poi succederà qualcosa» non può mai essere smentita, quindi non dice nulla. Il modello ti aiuta a riconoscere le idee vuote e a mettere alla prova le tue convinzioni.",
ap:["Il filosofo Karl Popper propose questo criterio per distinguere le teorie scientifiche da quelle che sembrano scientifiche ma non lo sono. Una buona teoria corre un rischio: fa previsioni che potrebbero rivelarsi sbagliate. Una teoria che spiega tutto, qualunque cosa succeda, in realtà non spiega niente.","Nella vita quotidiana puoi chiederti: «Cosa dovrebbe succedere per farmi cambiare idea?». Se la risposta è «niente», non stai ragionando, stai difendendo una convinzione. Formulare le idee in modo verificabile ti permette di imparare dagli errori."],
ri:[["Spiega tutto","Ogni risultato viene letto come conferma della stessa idea."],["Promesse vaghe","Previsioni senza data, numeri o condizioni chiare."],["Non cambi mai idea","Non sai dire cosa ti farebbe ricredere."]],
es:[["Salute","Un integratore promette di «migliorare il benessere». Non si può smentire. Uno che dice «riduce il colesterolo del 10% in 3 mesi» si può verificare con un esame."],["Lavoro","Invece di dire «il nuovo metodo migliorerà le cose», il gruppo scrive «ridurrà i reclami del 20% entro giugno». A giugno sa se ha funzionato."]],
ex:["Scrivi una tua convinzione forte e completa la frase: «Cambierei idea se vedessi…».","Trasforma un obiettivo vago in uno verificabile, con numero e data.","Trova una pubblicità o un titolo che fa una promessa impossibile da smentire. Riscrivila in forma verificabile."],
q:["Cosa mi farebbe cambiare idea?","Questa affermazione può rivelarsi falsa?","Come e quando potrò verificarla?"],
er:"Pensare che un'idea non falsificabile sia per forza falsa. Semplicemente non si può mettere alla prova.",
qz:[["Quale affermazione è falsificabile?",["Le cose succedono per un motivo","Questo corso aumenterà le tue vendite del 15% in tre mesi","Il destino ha un piano","Prima o poi andrà meglio"],1,"Ha un numero e una scadenza: si può verificare."],["Se un'idea spiega qualunque risultato, cosa significa?",["È molto forte","Non si può mettere alla prova","È sicuramente vera","È scientifica"],1,"Un'idea che non rischia di essere smentita non dice nulla di preciso."]]},

{t:"Necessità e sufficienza",d:2,
sp:"Una condizione necessaria deve esserci perché un risultato accada, ma da sola non basta. Una condizione sufficiente basta da sola a produrlo. Confondere le due cose porta a errori comuni: pensare che, avendo fatto il necessario, il successo sia garantito, oppure copiare una sola caratteristica di chi ce l'ha fatta.",
ap:["Per guidare serve la patente: è necessaria. Ma avere la patente non ti fa arrivare a destinazione: ti servono anche un'auto, benzina e strade aperte. Molti risultati nella vita hanno molte condizioni necessarie e nessuna sufficiente: talento, lavoro, tempismo e fortuna insieme.","Il modello aiuta in due direzioni: quando pianifichi, elenca tutte le condizioni necessarie e verifica che ci siano; quando analizzi un successo, non concludere che una sola caratteristica l'abbia causato. Chiediti anche cosa basterebbe davvero."],
ri:[["«Ho fatto tutto giusto»","Hai rispettato i requisiti ma il risultato non arriva."],["Copiare il vincitore","Pensi che basti imitare un'abitudine di una persona di successo."],["Lista incompleta","Ti concentri su una condizione e trascuri le altre."]],
es:[["Lavoro","Hai una laurea, necessaria per il posto, ma non sufficiente: servono anche esperienza, un buon colloquio e contatti. Lavori sugli elementi mancanti."],["Salute","Fare sport è necessario per stare in forma, ma senza sonno e alimentazione adeguati non basta."]],
ex:["Scegli un obiettivo e scrivi tutte le condizioni necessarie. Segna quelle che hai già e quelle che mancano.","Leggi una storia di successo e individua almeno tre condizioni diverse che l'hanno resa possibile.","Quando dici «basta che…», fermati e chiediti se quella cosa è davvero sufficiente."],
q:["Questa condizione è necessaria, sufficiente o nessuna delle due?","Cos'altro deve essere vero perché funzioni?","Cosa basterebbe davvero da solo?"],
er:"Credere che fare il necessario garantisca il risultato.",
qz:[["Studiare è per superare un esame difficile...",["Sufficiente","Necessario ma probabilmente non sufficiente","Inutile","Né necessario né utile"],1,"Serve, ma contano anche altro: metodo, sonno, gestione dell'ansia."],["Un imprenditore famoso si sveglia alle 5. Cosa dice il modello?",["Svegliarsi alle 5 porta al successo","Svegliarsi presto non è sufficiente e forse nemmeno necessario","Bisogna svegliarsi alle 4","Il sonno non conta"],1,"Una singola abitudine raramente basta a spiegare un risultato."]]},

{t:"Correlazione e causalità",d:2,
sp:"Due cose che cambiano insieme non sono per forza l'una la causa dell'altra. Possono avere una causa comune, la relazione può andare al contrario, o può trattarsi di una coincidenza. Prima di concludere che A causa B, chiediti quali altre spiegazioni ci sono.",
ap:["D'estate aumentano sia i gelati venduti sia gli annegamenti, ma i gelati non fanno annegare nessuno: la causa comune è il caldo, che porta più gente al mare. Questo errore è frequente nei titoli di giornale e nelle nostre conclusioni quotidiane.","Per sospettare una causa davvero servono più indizi: la causa viene prima dell'effetto, il legame si ripete in contesti diversi, c'è un meccanismo plausibile, e se togli la causa l'effetto diminuisce. Il modo più affidabile è fare una prova controllata: cambia una sola cosa e osserva."],
ri:[["Titoli sensazionali","«Chi beve caffè vive di più» e simili."],["Conclusioni da poche osservazioni","Hai notato due cose insieme un paio di volte."],["Spieghi un successo con un dettaglio","«Ho vinto perché indossavo quella maglia»."]],
es:[["Salute","Le persone che vanno in palestra sono più sane. Ma forse chi è già sano va più volentieri in palestra. La relazione può andare in entrambe le direzioni."],["Lavoro","Le vendite sono salite dopo il nuovo logo. Ma nello stesso mese è iniziata la stagione forte. Serve confrontare con l'anno precedente."]],
ex:["Trova un titolo di giornale che suggerisce una causa e scrivi tre spiegazioni alternative.","Pensa a una tua abitudine che credi ti faccia bene. Come potresti verificare che è davvero la causa?","Fai un piccolo esperimento: cambia una sola cosa per una settimana (orario del sonno, caffè) e annota l'effetto."],
q:["C'è una terza causa che spiega entrambe le cose?","La relazione potrebbe andare al contrario?","Come potrei verificarlo cambiando una sola cosa?"],
er:"Pensare che la correlazione non conti nulla. È un indizio prezioso, non una prova.",
qz:[["Le città con più pompieri hanno più incendi. Cosa concludi?",["I pompieri causano incendi","Le città più grandi hanno sia più pompieri sia più incendi","Bisogna ridurre i pompieri","Non c'è alcun legame"],1,"La dimensione della città è la causa comune."],["Qual è il modo più affidabile per verificare una causa?",["Leggere un articolo","Cambiare una cosa sola e osservare l'effetto confrontandolo con chi non l'ha cambiata","Chiedere a un amico","Osservare una sola volta"],1,"La prova controllata isola l'effetto di una variabile."]]}
);

LIB.push(
{t:"Relatività",d:2,
sp:"In fisica il movimento e il tempo dipendono dal punto da cui li osservi. Nella vita succede lo stesso: ciò che vedi dipende dalla tua posizione, dalla tua storia e dai tuoi interessi. Il modello ti invita a ricordare che anche gli altri hanno un punto di osservazione, e che il tuo non è l'unico possibile.",
ap:["Su un treno in corsa una tazza sul tavolo sembra ferma a te, ma per chi guarda dalla banchina si muove velocissima. Entrambi avete ragione rispetto al vostro punto di vista. Allo stesso modo, un ritardo di dieci minuti è nulla per chi aspetta tranquillo e un'eternità per chi ha un treno da prendere.","Applicarlo significa chiedersi da dove sto guardando e come appare la stessa situazione da un'altra posizione. Non vuol dire che tutto sia opinione: i fatti restano fatti, ma la loro importanza e il loro significato cambiano con l'osservatore."],
ri:[["Litigi sul «chi ha ragione»","Due persone descrivono lo stesso fatto in modo opposto."],["Sorpresa per le reazioni altrui","Non capisci perché qualcuno se la prenda tanto."],["Tutto ti sembra ovvio","Non riesci a immaginare un altro modo di vedere."]],
es:[["Famiglia","Per te pulire casa il sabato è normale, per il partner è l'unico giorno di riposo. Capire il suo punto di osservazione apre a un compromesso."],["Lavoro","Il cliente dice che il progetto è in ritardo, tu pensi di essere in anticipo. Scoprite che misuravate da date di partenza diverse."]],
ex:["Ripensa a un conflitto recente e riscrivilo in prima persona dal punto di vista dell'altro.","In una riunione o discussione, prima di rispondere chiedi: «Come lo vedi dalla tua posizione?»","Scegli una tua convinzione e immagina come la vedrebbe una persona di un'altra età, Paese o professione."],
q:["Da dove sto guardando questa situazione?","Come appare dalla posizione dell'altro?","Cosa resta vero da ogni punto di vista?"],
er:"Concludere che allora nulla è vero. I punti di vista cambiano il significato, non i fatti.",
qz:[["Due colleghi descrivono in modo opposto la stessa riunione. Cosa suggerisce il modello?",["Uno dei due mente","Ciascuno la vede dalla propria posizione: confrontate i punti di vista","Bisogna dare ragione al più anziano","I fatti non esistono"],1,"La posizione dell'osservatore cambia la percezione."],["Cosa NON significa il modello?",["Che i punti di vista contano","Che non esistono fatti","Che è utile cambiare prospettiva","Che il contesto influenza la percezione"],1,"I fatti restano, cambia come li vediamo."]]},

{t:"Reciprocità",d:1,
sp:"In fisica a ogni azione corrisponde una reazione uguale e contraria. Tra le persone succede qualcosa di simile: la gentilezza tende a generare gentilezza, l'aggressività aggressività. Il modello ti ricorda che il modo in cui tratti gli altri torna indietro, e che spesso conviene fare il primo passo.",
ap:["Siamo fatti per ricambiare: se qualcuno ci fa un favore, sentiamo il bisogno di restituirlo. Questo meccanismo costruisce fiducia e collaborazione. Funziona anche al contrario: se rispondi male, l'altro probabilmente risponderà peggio, e la spirale cresce.","Puoi usarlo in modo consapevole: offri per primo fiducia, aiuto o ascolto, e osserva come cambia l'altro. Fai attenzione però a chi lo sfrutta, ad esempio con regali o favori fatti apposta per ottenere qualcosa da te."],
ri:[["Spirali di tensione","Ogni risposta è un po' più dura della precedente."],["Ti senti in debito","Qualcuno ti ha fatto un favore e ti senti obbligato."],["Rapporti freddi","Aspetti che sia l'altro a fare il primo passo."]],
es:[["Lavoro","Aiuti un collega di un altro reparto senza chiedere niente. Qualche settimana dopo è il primo a rispondere quando ti serve."],["Acquisti","Un venditore ti offre un caffè e un campione gratuito. Senti di dover comprare: riconosci il meccanismo e decidi con calma."]],
ex:["Questa settimana fai tre piccoli gesti gentili senza aspettarti nulla e osserva le reazioni.","In una discussione tesa, abbassa tu per primo il tono e nota cosa succede.","Ripensa a un acquisto o a un sì detto solo perché ti sentivi in debito. Cosa faresti oggi?"],
q:["Che reazione sto provocando con questa azione?","Posso fare io il primo passo?","Mi sento obbligato solo perché ho ricevuto qualcosa?"],
er:"Dare solo per ottenere. Le persone percepiscono il calcolo e la reciprocità si spegne.",
qz:[["Un collega è sempre scortese con te. Cosa suggerisce il modello?",["Rispondere allo stesso modo","Provare a offrire per primo un comportamento diverso e osservare","Ignorarlo per sempre","Lamentarsi con tutti"],1,"La reciprocità può essere avviata nella direzione che vuoi."],["Perché i campioni gratuiti fanno vendere?",["Perché sono di qualità","Perché fanno sentire in debito chi li riceve","Perché costano poco","Per caso"],1,"Sfruttano il bisogno di ricambiare."]]},

{t:"Termodinamica",d:2,
sp:"La seconda legge della termodinamica dice che, senza energia dall'esterno, ogni sistema tende al disordine. La casa si sporca, il giardino si riempie di erbacce, le relazioni si raffreddano, le competenze si arrugginiscono. Il modello ti ricorda che il disordine è lo stato naturale e che l'ordine richiede manutenzione continua.",
ap:["Il disordine è più probabile dell'ordine: ci sono infiniti modi per avere una scrivania disordinata e pochissimi per averla in ordine. Per questo le cose peggiorano da sole e migliorano solo con un intervento. Non è colpa tua se le cose si disordinano: è la normalità.","La lezione pratica è prevedere la manutenzione invece di sorprendersi del degrado. Piccoli interventi regolari costano molto meno di grandi riparazioni: dieci minuti di riordino al giorno, una telefonata agli amici ogni settimana, un controllo periodico dell'auto."],
ri:[["«Si è rotto da solo»","Qualcosa peggiora senza una causa evidente."],["Grandi pulizie periodiche","Lasci accumulare finché diventa un lavoro enorme."],["Relazioni che si spengono","Non senti più qualcuno senza che sia successo nulla."]],
es:[["Casa","Invece di una pulizia enorme ogni mese, dedichi 15 minuti ogni sera. La casa resta ordinata con meno fatica."],["Relazioni","Un'amicizia si sta perdendo. Fissi una chiamata al mese: piccola energia costante che mantiene il legame."]],
ex:["Elenca tre cose nella tua vita che si stanno deteriorando lentamente e assegna a ciascuna un piccolo gesto di manutenzione settimanale.","Prova la regola dei 10 minuti: ogni sera riordina uno spazio per 10 minuti, per sette giorni.","Scegli una competenza che stai perdendo e programma una pratica breve e regolare."],
q:["Cosa si sta deteriorando senza che me ne accorga?","Quale piccola manutenzione regolare evita un grosso problema dopo?","Quanta energia serve per mantenere questo ordine?"],
er:"Pretendere di fare ordine una volta per tutte. L'ordine si mantiene, non si conquista.",
qz:[["Perché la scrivania si disordina da sola?",["Perché sei disordinato","Perché il disordine è lo stato più probabile senza intervento","Per sfortuna","Perché è troppo piccola"],1,"Ci sono molti più modi per essere in disordine che in ordine."],["Quale strategia segue il modello?",["Grandi interventi rari","Piccola manutenzione regolare","Aspettare che si rompa","Ignorare il problema"],1,"La manutenzione costante costa meno della riparazione."]]},

{t:"Inerzia",d:1,
sp:"Un corpo fermo tende a restare fermo e uno in movimento tende a continuare a muoversi. Anche le abitudini, le organizzazioni e le persone funzionano così: è difficile iniziare, ma una volta partiti è più facile continuare. Il modello ti aiuta a sfruttare l'inerzia a tuo favore e a riconoscere quando ti tiene bloccato.",
ap:["La parte più difficile di qualsiasi attività è spesso l'inizio: mettersi le scarpe per correre, aprire il documento, fare la prima telefonata. Una volta avviati, continuare richiede meno sforzo. Allo stesso modo le cattive abitudini continuano perché sono già in movimento.","Per vincere l'inerzia iniziale rendi il primo passo piccolissimo: due minuti, una riga, un esercizio. Per cambiare una direzione sbagliata serve una forza decisa e mirata, non una spinta debole e occasionale. E quando sei in movimento nella direzione giusta, proteggi lo slancio."],
ri:[["Rimandi l'inizio","Il compito non è difficile, ma non riesci a partire."],["«Abbiamo sempre fatto così»","Un'organizzazione continua per abitudine."],["Ti fermi e non riparti","Dopo una pausa riprendere sembra faticosissimo."]],
es:[["Salute","Ti impegni solo a indossare le scarpe da corsa. Una volta fuori, quasi sempre corri almeno venti minuti."],["Studio","Dopo le vacanze non riesci a riprendere. Ti dai solo 10 minuti di ripasso al giorno e dopo tre giorni sei di nuovo in movimento."]],
ex:["Scegli un compito che rimandi e definisci un primo passo di due minuti. Fallo oggi.","Individua un'abitudine buona già in movimento e decidi come proteggerla nei giorni difficili (anche una versione minima).","Trova un'abitudine che continui solo per inerzia e chiediti se la sceglieresti di nuovo oggi."],
q:["Qual è il primo passo più piccolo possibile?","Sto continuando questa cosa solo perché è già in movimento?","Come mantengo lo slancio quando c'è?"],
er:"Aspettare la motivazione per partire. Di solito la motivazione arriva dopo aver iniziato.",
qz:[["Qual è il modo migliore per vincere l'inerzia iniziale?",["Aspettare di avere voglia","Rendere il primo passo piccolissimo","Pianificare tutto nei dettagli","Fare tutto in una volta"],1,"Un inizio minimo riduce la resistenza iniziale."],["Un'azienda usa un vecchio software solo perché è sempre stato usato. Cosa mostra?",["Efficienza","Inerzia organizzativa","Innovazione","Risparmio sicuro"],1,"Continua per abitudine, non per scelta."]]},

{t:"Attrito e viscosità",d:2,
sp:"L'attrito è la resistenza che rallenta un movimento. Nella vita è fatto di piccoli ostacoli: un passaggio in più, un modulo complicato, un oggetto lontano. Ogni attrito sembra insignificante, ma sommati decidono cosa facciamo e cosa no. Puoi ridurre l'attrito per le cose buone e aumentarlo per quelle che vuoi evitare.",
ap:["Spesso non facciamo una cosa non perché è difficile, ma perché ha troppi piccoli ostacoli. Se la palestra è a 30 minuti, ci vai meno; se gli snack sono sul tavolo, ne mangi di più. Le aziende lo sanno: per comprare basta un clic, per disdire servono cinque passaggi.","Per usare il modello osserva dove si inceppano le tue intenzioni. Togli i passaggi inutili alle abitudini che vuoi: prepara la borsa la sera prima, tieni il libro sul cuscino. Aggiungi attrito alle abitudini che vuoi ridurre: disconnettiti dai social, metti i dolci in alto in un armadio."],
ri:[["Buone intenzioni che non partono","Vuoi fare una cosa ma ogni volta c'è un piccolo intoppo."],["Processi lenti","Molti piccoli passaggi rallentano tutto."],["Abitudini facili da sbagliare","La scelta sbagliata è sempre a portata di mano."]],
es:[["Salute","Metti la frutta lavata in vista sul tavolo e i biscotti in un armadio alto. Senza sforzo mangi più frutta."],["Lavoro","Il gruppo impiega ore a compilare un modulo di sei pagine. Riducendolo a una pagina le richieste arrivano prima e complete."]],
ex:["Scegli un'abitudine che vuoi iniziare e togli tre ostacoli per renderla più facile.","Scegli un'abitudine che vuoi ridurre e aggiungi due passaggi in più (logout, spostare oggetti, password).","Osserva un processo al lavoro o a casa e conta i passaggi. Quale puoi eliminare?"],
q:["Quali piccoli ostacoli mi impediscono di farlo?","Come posso rendere la scelta giusta più facile?","Dove posso aggiungere attrito alle cattive abitudini?"],
er:"Sottovalutare i piccoli ostacoli perché sembrano banali.",
qz:[["Vuoi leggere di più la sera. Quale azione riduce l'attrito?",["Comprare dieci libri","Tenere il libro sul cuscino e il telefono in un'altra stanza","Decidere di leggere un'ora","Iscriversi a un corso"],1,"Rende la lettura la scelta più facile."],["Perché disdire un abbonamento è spesso complicato?",["Per errore","Perché l'attrito scoraggia la disdetta","Per sicurezza","Perché è obbligatorio"],1,"Più attrito significa meno disdette."]]},

{t:"Velocità e direzione",d:2,
sp:"In fisica la velocità ha una direzione: non basta muoversi in fretta, conta verso dove. Si può essere molto impegnati senza avvicinarsi all'obiettivo. Il modello ti chiede di distinguere tra essere occupati e fare progressi, e di controllare spesso la direzione prima di accelerare.",
ap:["Puoi correre in cerchio per ore e trovarti al punto di partenza. Molte giornate sono così: email, riunioni, commissioni, ma l'obiettivo importante non si muove. La sensazione di essere attivi inganna, perché lo sforzo non è lo stesso del progresso.","Prima di accelerare, verifica la direzione: dove voglio arrivare e questa attività mi avvicina? A volte andare più lenti ma nella direzione giusta porta molto più lontano. Fai controlli regolari, ad esempio ogni venerdì, per correggere la rotta."],
ri:[["Giornate piene ma vuote","A fine giornata non sai cosa hai fatto di importante."],["Obiettivo che non si muove","Lavori tanto ma i risultati non arrivano."],["Fretta costante","Corri senza fermarti a controllare dove vai."]],
es:[["Lavoro","Rispondi a 80 email al giorno ma il progetto principale è fermo. Blocchi due ore al mattino solo per quello."],["Soldi","Fai molti piccoli risparmi su caffè e spesa, ma non hai un obiettivo. Decidi la meta (un fondo emergenze) e tutto acquista senso."]],
ex:["Alla fine di ogni giornata per una settimana scrivi: cosa ho fatto che mi ha avvicinato al mio obiettivo principale?","Fai una lista delle tue attività settimanali e segna con una freccia quelle che ti portano nella direzione giusta.","Fissa un controllo di direzione settimanale di 15 minuti."],
q:["Questa attività mi avvicina a dove voglio arrivare?","Sono occupato o sto facendo progressi?","Ha senso andare più veloce prima di aver controllato la direzione?"],
er:"Cambiare direzione troppo spesso: senza costanza non si arriva da nessuna parte.",
qz:[["Cosa distingue progresso e attività?",["Il numero di ore lavorate","Se l'attività ti avvicina all'obiettivo","Quanto sei stanco","La velocità"],1,"Conta la direzione, non solo la quantità di movimento."],["Quando conviene accelerare?",["Sempre","Dopo aver verificato di andare nella direzione giusta","Mai","Quando gli altri accelerano"],1,"Accelerare nella direzione sbagliata allontana dall'obiettivo."]]},

{t:"Leva",d:2,
sp:"Con una leva una persona può sollevare un peso enorme, se trova il punto d'appoggio giusto. Nella vita la leva è ciò che moltiplica il tuo sforzo: strumenti, competenze, relazioni, sistemi, denaro. Il modello ti chiede di cercare le azioni in cui un piccolo sforzo produce un grande risultato.",
ap:["Non tutte le ore valgono uguale. Un'ora per imparare a usare bene un programma può farti risparmiare cento ore. Scrivere una guida una volta evita di spiegare la stessa cosa venti volte. Una buona abitudine ha effetti su tutto il resto della giornata.","Le leve più comuni sono il lavoro degli altri (delegare, collaborare), la tecnologia (automatizzare), la conoscenza (imparare la cosa giusta) e le relazioni. Attenzione però: la leva amplifica anche gli errori. Un prestito moltiplica guadagni e perdite."],
ri:[["Ripeti sempre la stessa cosa","Fai a mano un compito che si potrebbe automatizzare o insegnare."],["Lavori tanto con poco effetto","Lo sforzo non si moltiplica."],["Tutto dipende da te","Non usi strumenti, aiuti o sistemi."]],
es:[["Lavoro","Spieghi la stessa procedura a ogni nuovo collega. Registri un video di dieci minuti: ora si formano da soli."],["Casa","Prepari i pasti della settimana la domenica in due ore invece di cucinare un'ora ogni sera."]],
ex:["Elenca le tre attività che ripeti più spesso e trova per ciascuna una leva: automatizzare, delegare, standardizzare.","Scegli una competenza che renderebbe più facile tutto il tuo lavoro e dedicale un'ora questa settimana.","Pensa a una leva che amplifica i tuoi errori (debito, fretta) e decidi un limite."],
q:["Dove un piccolo sforzo produce il risultato più grande?","Cosa sto facendo a mano che potrei moltiplicare?","Questa leva può amplificare anche i miei errori?"],
er:"Usare la leva senza controllo: moltiplica anche perdite ed errori.",
qz:[["Quale azione usa meglio la leva?",["Lavorare due ore in più ogni sera","Scrivere una guida che risponde alle domande frequenti","Rispondere a ogni domanda a voce","Fare tutto da solo"],1,"Uno sforzo fatto una volta produce benefici ripetuti."],["Qual è il rischio della leva finanziaria?",["Nessuno","Amplifica anche le perdite","Riduce i guadagni","È illegale"],1,"La leva moltiplica in entrambe le direzioni."]]},

{t:"Energia di attivazione",d:2,
sp:"In chimica molte reazioni non partono finché non ricevono una spinta iniziale di energia, poi proseguono da sole. Anche per noi molte attività richiedono uno sforzo iniziale alto prima di diventare facili. Riconoscerlo ti aiuta a ridurre quella soglia o a programmare la spinta nel momento giusto.",
ap:["Un fiammifero ha bisogno di sfregamento per accendersi, ma poi brucia da solo. Iniziare a studiare, avviare un progetto, fare una telefonata difficile: l'energia necessaria per partire è molto più alta di quella per continuare. Spesso ci arrendiamo proprio lì.","Puoi abbassare la soglia: prepara tutto in anticipo, scegli il momento della giornata in cui hai più energia, chiedi a qualcuno di iniziare con te. Oppure aumenta la spinta: una scadenza, un impegno pubblico, una piccola ricompensa."],
ri:[["Compiti che ti spaventano","Più li guardi, più sembrano pesanti."],["Partenze sempre rimandate","Una volta iniziato va bene, ma iniziare è un incubo."],["Ambiente non pronto","Ogni volta devi preparare tutto da capo."]],
es:[["Salute","Prepari la borsa della palestra la sera e la metti vicino alla porta. Al mattino l'energia necessaria per uscire è molto più bassa."],["Lavoro","La telefonata difficile la fai alle 9, quando hai più energia, invece di rimandarla al pomeriggio."]],
ex:["Scegli un compito che rimandi e prepara oggi tutto il necessario per iniziarlo domani in un minuto.","Individua le tue ore di maggiore energia e mettici le attività con la soglia più alta.","Trova un compagno o un impegno pubblico che ti dia la spinta per partire su un progetto."],
q:["Cosa rende così difficile iniziare?","Come posso abbassare la soglia di partenza?","Quando ho più energia per dare la spinta?"],
er:"Confondere la difficoltà iniziale con la difficoltà totale del compito.",
qz:[["Perché preparare i vestiti per correre la sera prima aiuta?",["Perché sono più belli","Perché abbassa l'energia necessaria per iniziare","Perché fa risparmiare","Non aiuta"],1,"Riduce la soglia di attivazione."],["Cosa caratterizza l'energia di attivazione?",["Serve sempre la stessa energia","Serve una spinta iniziale, poi è più facile continuare","Non si può ridurre","Riguarda solo la chimica"],1,"La difficoltà maggiore è all'inizio."]]},

{t:"Catalizzatori",d:2,
sp:"Un catalizzatore è una sostanza che accelera una reazione chimica senza consumarsi. Nella vita sono catalizzatori una persona che mette in contatto altre, una domanda giusta, un evento, un'abitudine. Il modello ti invita a cercarli, a crearli e anche a diventarlo per gli altri.",
ap:["A volte un cambiamento è possibile ma lentissimo, finché arriva qualcosa che lo accelera: un mentore che ti apre una porta, una crisi che costringe a decidere, un amico che si allena con te. Il catalizzatore non fa il lavoro al posto tuo, ma rende tutto più rapido.","Chiediti cosa potrebbe accelerare ciò che vuoi ottenere: un gruppo, una scadenza, uno strumento, una persona. Puoi anche essere tu il catalizzatore: presentare due persone che potrebbero collaborare, fare la domanda che sblocca una discussione."],
ri:[["Processi lentissimi","Tutto è possibile ma non succede nulla."],["Mancano i contatti giusti","Ti serve una persona che ti metta in collegamento."],["Gruppi bloccati","Serve qualcuno o qualcosa che dia il via."]],
es:[["Studio","Ti iscrivi a un gruppo di studio. La regolarità e il confronto accelerano l'apprendimento molto più dello studio da solo."],["Lavoro","Presenti un collega a un cliente con un problema che lui sa risolvere. Nasce una collaborazione che fa crescere entrambi."]],
ex:["Scegli un obiettivo lento e scrivi tre possibili catalizzatori (persona, gruppo, evento, strumento). Attivane uno.","Questa settimana presenta due persone che secondo te dovrebbero conoscersi.","In una discussione bloccata, prova a fare una sola domanda che chiarisca il punto chiave."],
q:["Cosa potrebbe accelerare questo processo?","Chi potrebbe aprirmi una porta?","Posso essere io il catalizzatore per qualcun altro?"],
er:"Aspettare il catalizzatore senza fare la propria parte: accelera, ma non sostituisce il lavoro.",
qz:[["Quale è un esempio di catalizzatore personale?",["Un compagno di allenamento","Una scusa per non allenarsi","Un giorno libero","Un problema irrisolvibile"],0,"Accelera la costanza senza fare l'allenamento al tuo posto."],["Cosa caratterizza un catalizzatore?",["Si consuma nel processo","Accelera un cambiamento senza esaurirsi","Rallenta le reazioni","È sempre una persona"],1,"Agisce senza consumarsi."]]},

{t:"Leghe",d:2,
sp:"Una lega è una miscela di metalli che ha proprietà che nessun metallo ha da solo: il bronzo è più duro del rame e dello stagno. Nelle persone e nei gruppi succede lo stesso: combinare competenze o caratteri diversi può creare qualcosa di più forte. Il modello ti invita a cercare combinazioni insolite invece di cercare l'eccellenza in una sola cosa.",
ap:["È difficile essere il migliore al mondo in una cosa sola, ma è molto più facile essere tra i pochi che combinano due o tre competenze diverse: un medico che sa programmare, un insegnante che sa fare video, un idraulico che sa comunicare. Queste combinazioni sono rare e quindi preziose.","Anche nei gruppi le differenze rendono più forti, se integrate bene. Una squadra di persone tutte uguali vede gli stessi problemi e manca gli stessi rischi. Il punto è trovare la proporzione giusta: non ogni miscela migliora le cose."],
ri:[["Competenze isolate","Vedi le tue capacità come cose separate."],["Gruppi troppo omogenei","Tutti pensano allo stesso modo."],["Concorrenza feroce","Cerchi di vincere in un campo dove tutti fanno la stessa cosa."]],
es:[["Lavoro","Un contabile impara a fare presentazioni chiare. Ora è la persona che spiega i numeri ai manager, ruolo che nessun altro sa coprire."],["Relazioni","In coppia una persona è pianificatrice e l'altra spontanea. Riconoscerlo come forza permette di organizzare i viaggi meglio di entrambi da soli."]],
ex:["Scrivi le tue tre competenze principali e cerca una combinazione insolita che potrebbe essere utile ad altri.","Nel tuo gruppo, individua una persona molto diversa da te e chiedile come affronterebbe un tuo problema.","Scegli una competenza piccola da aggiungere che renderebbe più rara la tua combinazione."],
q:["Quale combinazione di competenze mi rende raro?","Cosa porta una persona diversa da me?","Questa miscela migliora davvero o solo complica?"],
er:"Mescolare a caso. Le leghe funzionano per proporzioni precise, non per accumulo.",
qz:[["Qual è il vantaggio di combinare competenze diverse?",["Diventare mediocre in tutto","Creare un profilo raro e prezioso","Evitare di specializzarsi","Lavorare di più"],1,"Le combinazioni insolite sono rare e utili."],["Perché un gruppo troppo omogeneo è rischioso?",["Litiga di più","Tutti vedono gli stessi problemi e mancano gli stessi rischi","È più lento","Non è rischioso"],1,"La diversità integrata copre più punti ciechi."]]}
);

LIB.push(
{t:"Selezione naturale ed estinzione",d:2,
sp:"In natura sopravvivono e si riproducono gli organismi più adatti all'ambiente del momento. Quando l'ambiente cambia, chi non si adatta scompare. Vale anche per aziende, mestieri e abitudini: ciò che funzionava ieri può diventare inutile domani. Il modello ti chiede di osservare come cambia il tuo ambiente e di adattarti prima di essere costretto.",
ap:["La selezione non premia il più forte in assoluto, ma il più adatto al contesto. I dinosauri dominarono per milioni di anni, ma un cambiamento improvviso favorì piccoli mammiferi. Molte aziende leader sono sparite perché il mondo è cambiato mentre loro continuavano a fare ciò che sapevano fare.","Per usarlo chiediti: cosa sta cambiando nel mio ambiente (lavoro, tecnologia, abitudini delle persone)? Quali mie competenze o abitudini perderanno valore? Fai piccoli esperimenti con il nuovo: la varietà aumenta le probabilità di avere qualcosa di adatto quando il cambiamento arriva."],
ri:[["Successo che si spegne","Ciò che funzionava sempre ora funziona meno."],["Ambiente che cambia","Nuove tecnologie, regole o abitudini nel tuo settore."],["Rifiuto del nuovo","Pensi che il cambiamento non ti riguardi."]],
es:[["Lavoro","Un fotografo vede crescere la fotografia con lo smartphone. Si specializza in eventi e corsi, dove il valore umano conta ancora."],["Negozio","Una libreria di quartiere organizza presentazioni e gruppi di lettura: offre ciò che la vendita online non dà."]],
ex:["Scrivi tre cambiamenti in corso nel tuo settore e come potrebbero colpirti.","Scegli una competenza che sta perdendo valore e una che ne sta guadagnando. Pianifica come investire nella seconda.","Fai un piccolo esperimento con uno strumento o un metodo nuovo questa settimana."],
q:["Cosa sta cambiando nel mio ambiente?","Ciò che faccio sarà ancora utile tra cinque anni?","Quale piccolo esperimento posso fare ora?"],
er:"Inseguire ogni moda. Adattarsi significa rispondere ai cambiamenti reali, non a ogni novità.",
qz:[["Chi sopravvive secondo la selezione naturale?",["Il più forte","Il più adatto all'ambiente del momento","Il più grande","Il più antico"],1,"L'adattamento al contesto conta più della forza."],["Come ci si prepara a un ambiente che cambia?",["Facendo sempre la stessa cosa meglio","Osservando i cambiamenti e facendo piccoli esperimenti","Aspettando","Copiando i concorrenti"],1,"La varietà e l'osservazione aumentano l'adattabilità."]]},

{t:"Adattamento ed effetto Regina Rossa",d:2,
sp:"In «Alice attraverso lo specchio» la Regina Rossa dice che bisogna correre il più possibile per restare nello stesso posto. In natura prede e predatori migliorano di continuo uno contro l'altro. Anche nel lavoro e nei mercati, se gli altri migliorano e tu no, stai arretrando. Il modello ti ricorda che il miglioramento continuo spesso serve solo a non perdere terreno.",
ap:["Le gazzelle diventano più veloci, quindi i ghepardi devono diventarlo anche loro. Le aziende migliorano i prodotti e i concorrenti devono rispondere. Le competenze che ti bastavano cinque anni fa oggi possono non bastare, perché tutti intorno si sono aggiornati.","Il modello aiuta a non sentirsi traditi quando l'impegno non porta avanti: a volte serve a non tornare indietro. Aiuta anche a scegliere le gare: se una corsa richiede sforzi sempre maggiori per lo stesso risultato, forse conviene cercare un terreno diverso."],
ri:[["Più sforzo, stesso risultato","Lavori di più ma resti allo stesso punto."],["Corsa agli armamenti","Tu e i concorrenti aumentate le offerte a vicenda."],["Competenze che invecchiano","Ciò che sapevi non basta più."]],
es:[["Lavoro","Un grafico aggiorna ogni anno i suoi strumenti. Non diventa più bravo degli altri, ma resta competitivo."],["Soldi","Due negozi vicini abbassano continuamente i prezzi per battersi. Entrambi guadagnano meno: uno cambia strategia puntando sul servizio."]],
ex:["Individua un'area in cui stai correndo solo per restare fermo. Vale la pena continuare questa gara?","Scegli una competenza chiave e dedica un'ora alla settimana per aggiornarla.","Trova una corsa agli armamenti nella tua vita (prezzi, ore, apparenza) e immagina un'alternativa."],
q:["Gli altri stanno migliorando più velocemente di me?","Questo sforzo mi fa avanzare o solo restare in gara?","Esiste una gara diversa in cui ho più vantaggio?"],
er:"Correre in ogni gara. Alcune corse non valgono la fatica.",
qz:[["Cosa descrive l'effetto Regina Rossa?",["Vincere senza sforzo","Dover migliorare di continuo solo per mantenere la posizione","Smettere di competere","Il vantaggio del primo"],1,"Gli altri migliorano: restare fermi significa arretrare."],["Due aziende alzano ogni anno gli stipendi per strapparsi i dipendenti. Qual è una risposta saggia?",["Alzare ancora","Cercare un vantaggio diverso, come la qualità del lavoro","Ignorare il problema","Licenziare"],1,"Uscire dalla corsa può essere più utile che correre più forte."]]},

{t:"Competizione",d:1,
sp:"Quando le risorse sono limitate, chi le cerca entra in competizione: per il cibo, i clienti, i posti di lavoro, l'attenzione. La competizione spinge a migliorare, ma può anche consumare energie e rovinare rapporti. Il modello ti chiede di capire dove stai competendo, per cosa, e se ne vale la pena.",
ap:["In natura la competizione seleziona i più adatti; nei mercati abbassa i prezzi e migliora i prodotti. Ma competere costa: tempo, energia, a volte relazioni. E spesso competiamo senza accorgercene, per l'approvazione, per la casa più bella, per i like.","Per usarlo, distingui le gare che contano da quelle che ti trascinano. Puoi scegliere di competere dove hai un vantaggio, di cooperare dove la torta può crescere per tutti, o di cercare uno spazio dove la competizione è bassa."],
ri:[["Confronto continuo","Misuri il tuo valore rispetto agli altri."],["Prezzi o sforzi al ribasso","Tutti fanno di più per lo stesso premio."],["Risorsa scarsa","Molti vogliono la stessa cosa nello stesso momento."]],
es:[["Lavoro","Dieci candidati per un posto: invece di competere sullo stesso curriculum, ne prepari uno con un progetto pratico che ti distingue."],["Te stesso","Ti accorgi che spendi in vestiti per non sfigurare con i colleghi. Decidi di uscire da questa gara."]],
ex:["Elenca le gare in cui sei coinvolto (lavoro, social, aspetto, figli). Segna quelle che hai scelto e quelle subite.","Per una competizione importante, scrivi il tuo vantaggio reale rispetto agli altri.","Scegli una gara inutile da abbandonare questa settimana."],
q:["Per cosa sto davvero competendo?","Ho un vantaggio reale in questa gara?","Potrei cooperare invece di competere?"],
er:"Vedere ogni situazione come una gara. Molte cose crescono meglio collaborando.",
qz:[["Quando conviene competere?",["Sempre","Dove hai un vantaggio e il premio vale lo sforzo","Mai","Solo con gli amici"],1,"Scegliere le gare risparmia energia."],["Cosa genera la competizione tra organismi o aziende?",["Abbondanza di risorse","Risorse limitate desiderate da molti","Collaborazione","Assenza di regole"],1,"La scarsità mette in gara chi cerca la stessa risorsa."]]},

{t:"Ecosistema",d:2,
sp:"Un ecosistema è una rete di organismi che dipendono gli uni dagli altri e dall'ambiente. Se togli una specie, gli effetti si propagano in modi inattesi. Anche una famiglia, un'azienda o una città sono ecosistemi. Il modello ti invita a guardare le relazioni tra le parti invece di considerarle una alla volta.",
ap:["Quando i lupi furono reintrodotti nel parco di Yellowstone, cambiarono il comportamento dei cervi, che smisero di pascolare lungo i fiumi; la vegetazione ricrebbe e cambiò l'intero paesaggio. Le parti di un sistema sono collegate: toccarne una ne muove molte.","Prima di intervenire su un elemento, chiediti con cosa è collegato e chi ne dipende. Al lavoro, eliminare una riunione può togliere l'unico momento in cui due reparti si parlano. In famiglia, cambiare un orario cambia le giornate di tutti."],
ri:[["Effetti a catena","Una piccola modifica crea problemi lontani."],["Ruoli invisibili","Qualcuno o qualcosa svolge una funzione che noti solo quando manca."],["Interventi isolati","Risolvi un problema e ne crei un altro."]],
es:[["Lavoro","Un'azienda taglia la mensa per risparmiare. Scopre che era il luogo dove nascevano idee tra reparti diversi."],["Famiglia","Un genitore cambia turno di lavoro. Tutta la routine familiare, dai compiti alla spesa, si riorganizza."]],
ex:["Disegna la mappa del tuo ecosistema (lavoro o famiglia): persone, ruoli e collegamenti.","Prima di una modifica, elenca chi o cosa ne sarà toccato indirettamente.","Individua un ruolo invisibile nel tuo ambiente e ringrazia la persona che lo svolge."],
q:["Chi o cosa dipende da questo elemento?","Quali effetti a catena potrebbe avere questa modifica?","Quale ruolo invisibile rischio di eliminare?"],
er:"Ottimizzare una parte a scapito dell'insieme.",
qz:[["Cosa insegna il caso dei lupi a Yellowstone?",["I lupi sono pericolosi","Una specie può cambiare l'intero ecosistema tramite i collegamenti","Gli animali vanno separati","La natura non cambia"],1,"Gli effetti si propagano attraverso le relazioni."],["Cosa chiederti prima di modificare una parte di un sistema?",["Quanto costa","Con cosa è collegata e chi ne dipende","Chi l'ha creata","Quanto è vecchia"],1,"Le dipendenze rivelano gli effetti indiretti."]]},

{t:"Nicchie",d:2,
sp:"In natura molte specie sopravvivono occupando una nicchia: uno spazio preciso dove hanno meno concorrenti. Lo stesso vale per persone e aziende. Invece di competere con tutti sullo stesso terreno, puoi trovare un ambito specifico dove le tue caratteristiche sono un vantaggio.",
