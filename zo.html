ap:["I fringuelli delle Galápagos sviluppano becchi diversi per nutrirsi di semi diversi, così non si contendono lo stesso cibo. Un ristorante che fa solo cucina vegana senza glutine ha meno clienti potenziali ma molti meno concorrenti, e i suoi clienti lo cercano apposta.","Trovare una nicchia significa chiedersi: chi ha un bisogno che gli altri servono male? Cosa so fare in modo diverso? Il rischio è scegliere una nicchia troppo piccola o che scompare: conviene verificare che esista davvero un bisogno e restare pronti ad allargarsi."],
ri:[["Mercato affollato","Tutti offrono la stessa cosa."],["Bisogni trascurati","Un gruppo di persone non trova ciò che cerca."],["Caratteristiche particolari","Hai un'esperienza o un interesse insolito."]],
es:[["Lavoro","Un'insegnante di inglese si specializza in preparazione ai colloqui per infermieri che vogliono lavorare all'estero. Trova clienti con passaparola."],["Te stesso","In un gruppo di amici tutti cucinano; tu sei l'unico che organizza le gite. Diventi il punto di riferimento."]],
ex:["Scrivi un gruppo di persone con un bisogno che conosci bene e che è servito male.","Unisci due tue caratteristiche per definire una possibile nicchia personale o professionale.","Verifica la nicchia: parla con tre persone che dovrebbero averne bisogno."],
q:["Dove c'è meno concorrenza per ciò che so fare?","Chi ha un bisogno servito male?","Questa nicchia è abbastanza grande e stabile?"],
er:"Scegliere una nicchia senza verificare che qualcuno ne abbia davvero bisogno.",
qz:[["Perché una nicchia può essere vantaggiosa?",["Ha più clienti","Riduce la concorrenza diretta","È più facile da trovare","Non richiede competenze"],1,"Meno concorrenti per un bisogno specifico."],["Qual è il rischio principale di una nicchia?",["Troppi clienti","Essere troppo piccola o sparire","Troppa concorrenza","Nessuno"],1,"Va verificata la dimensione e la stabilità del bisogno."]]},

{t:"Autoconservazione",d:1,
sp:"Ogni essere vivente cerca prima di tutto di proteggere se stesso. Anche le persone e le organizzazioni lo fanno: un ufficio difende il proprio budget, un dirigente il proprio ruolo, ciascuno di noi la propria immagine. Il modello ti aiuta a prevedere i comportamenti e a proporre soluzioni che non minacciano la sopravvivenza degli altri.",
ap:["Quando una proposta sembra mettere a rischio il posto, il prestigio o la sicurezza di qualcuno, aspettati resistenza, anche se la proposta è buona per tutti. Non è cattiveria: è istinto. Anche tu reagisci così quando ti senti criticato o minacciato.","Per usarlo, chiediti cosa rischia l'altra persona se accetta ciò che chiedi. Se puoi, offri una via d'uscita che protegga la sua posizione o la sua immagine. E riconosci quando sei tu a difenderti invece di ascoltare."],
ri:[["Resistenza a idee buone","Una proposta utile viene bloccata senza motivi chiari."],["Reazioni difensive","Qualcuno si giustifica o attacca appena viene criticato."],["Organizzazioni che non muoiono","Un ufficio o un progetto continua anche quando non serve più."]],
es:[["Lavoro","Proponi di automatizzare un compito. Il collega che lo fa si oppone. Gli proponi di guidare il nuovo sistema: diventa il primo sostenitore."],["Relazioni","Critichi il partner davanti agli amici e si chiude. In privato, con calma, la stessa osservazione viene accolta."]],
ex:["Pensa a una proposta che vuoi fare: chi potrebbe sentirsi minacciato e come puoi rassicurarlo?","Quando ti accorgi di difenderti in una discussione, fermati e chiediti cosa senti di rischiare.","Individua un progetto o un'abitudine che continua solo per difendere se stessa."],
q:["Cosa rischia l'altro se accetta?","Come posso proteggere la sua posizione o la sua immagine?","Mi sto difendendo invece di ascoltare?"],
er:"Pensare che le persone agiscano contro l'interesse comune per cattiveria.",
qz:[["Perché un buon progetto viene bloccato da un reparto?",["Perché è sbagliato","Perché minaccia il ruolo o le risorse di quel reparto","Per caso","Per pigrizia"],1,"L'autoconservazione spinge a difendere la propria posizione."],["Come rendere più accettabile una proposta?",["Imporla","Offrire un ruolo o una protezione a chi si sente minacciato","Ignorare le resistenze","Criticare pubblicamente"],1,"Ridurre la minaccia riduce la resistenza."]]},

{t:"Replicazione",d:2,
sp:"In natura ciò che si riproduce con successo si diffonde, insieme ai suoi difetti. Lo stesso succede con idee, abitudini, processi e mode: ciò che funziona viene copiato, ma con esso si copiano anche gli errori. Il modello ti invita a scegliere cosa replicare, a migliorarlo prima di copiarlo e a creare cose facili da replicare quando funzionano.",
ap:["Il DNA si copia con piccoli errori, alcuni dannosi, alcuni utili. Le ricette di famiglia, le procedure aziendali, i modi di educare i figli passano di generazione in generazione con lo stesso meccanismo. Spesso copiamo senza chiederci se la cosa funzioni davvero o solo perché l'abbiamo sempre vista fare.","Prima di copiare un'abitudine o un metodo, chiediti se funziona nel tuo contesto e quali difetti porta con sé. Quando invece trovi qualcosa che funziona, rendilo facile da copiare: scrivilo, semplificalo, mostralo."],
ri:[["«Mio padre faceva così»","Ripeti un comportamento appreso senza verificarlo."],["Errori ricorrenti","Lo stesso problema si presenta in posti diversi."],["Successo da diffondere","Una buona soluzione resta chiusa in una sola persona."]],
es:[["Famiglia","Ti accorgi di urlare ai figli come facevano i tuoi genitori. Decidi di non replicare quell'abitudine."],["Lavoro","Un negozio ha un metodo che riduce i resi. Lo scrive in una pagina e lo condivide con gli altri negozi della catena."]],
ex:["Scegli un'abitudine ereditata dalla famiglia e decidi se vuoi continuare a replicarla.","Trova un metodo che funziona per te e scrivilo in cinque passaggi che chiunque possa seguire.","Prima di copiare un consiglio letto online, chiediti se funziona davvero nel tuo contesto."],
q:["Sto copiando questo perché funziona o perché l'ho sempre visto?","Quali difetti copio insieme a ciò che è utile?","Come posso rendere facile da replicare ciò che funziona?"],
er:"Copiare un successo ignorando il contesto in cui è nato.",
qz:[["Cosa succede quando si copia un metodo di successo?",["Si copia solo la parte buona","Si possono copiare anche i suoi difetti","Funziona sempre","Non funziona mai"],1,"La replicazione trasmette anche gli errori."],["Come favorire la diffusione di una buona pratica?",["Tenerla segreta","Scriverla in modo semplice e mostrarla","Complicarla","Imporla senza spiegarla"],1,"Ciò che è facile da copiare si diffonde."]]},

{t:"Cooperazione",d:1,
sp:"In natura molti organismi sopravvivono non battendo gli altri, ma collaborando: api, formiche, batteri, persone. Cooperare permette di ottenere risultati che nessuno potrebbe raggiungere da solo. Il modello ti invita a cercare situazioni in cui la torta può crescere per tutti, invece di litigare per la fetta.",
ap:["La cooperazione funziona quando le persone si fidano, si rivedranno in futuro e possono vedere se l'altro fa la propria parte. Per questo funziona bene nei gruppi stabili e male tra sconosciuti di passaggio. Le regole chiare, la reputazione e la reciprocità la rendono stabile.","Per favorirla, sii il primo a cooperare, ma con chiarezza su cosa ti aspetti. Rendi visibili gli impegni di tutti. E ricorda che la cooperazione si rompe facilmente quando qualcuno approfitta senza contribuire: va affrontato subito."],
ri:[["Obiettivo troppo grande per uno","Da solo non ci arrivi."],["Risorse complementari","Tu hai ciò che manca all'altro e viceversa."],["Sfiducia","Ognuno lavora per sé e il gruppo rende poco."]],
es:[["Famiglia","Tre famiglie del quartiere si alternano per accompagnare i bambini a scuola. Ognuna guida un giorno su tre."],["Lavoro","Due piccoli negozi vicini fanno una promozione comune: chi compra in uno riceve uno sconto nell'altro."]],
ex:["Trova un obiettivo che stai inseguendo da solo e individua una persona con cui potresti collaborare.","In un gruppo, proponi una regola semplice e visibile che renda chiari gli impegni di tutti.","Fai per primo un passo di fiducia verso qualcuno con cui hai un rapporto freddo."],
q:["Possiamo ottenere di più insieme che separati?","Cosa ha l'altro che mi manca, e viceversa?","Come rendiamo chiaro chi fa cosa?"],
er:"Cooperare senza regole chiare: chi approfitta finisce per rompere la fiducia.",
qz:[["Quando la cooperazione è più stabile?",["Tra sconosciuti di passaggio","Quando le persone si rivedranno e possono verificare gli impegni","Quando nessuno controlla","Quando c'è un solo vincitore"],1,"Fiducia, reputazione e visibilità la sostengono."],["Due vicini comprano insieme un tagliaerba. Cosa mostra?",["Competizione","Cooperazione che riduce i costi per entrambi","Spreco","Monopolio"],1,"Entrambi ottengono più di quanto avrebbero da soli."]]},

{t:"Il numero di Dunbar",d:2,
sp:"L'antropologo Robin Dunbar ha stimato che una persona riesce a mantenere relazioni stabili con circa 150 persone, con cerchi più stretti di circa 5, 15 e 50. Il tempo e l'attenzione sono limitati. Il modello ti aiuta a scegliere a chi dedicare energia e a capire perché i gruppi grandi hanno bisogno di regole e strutture.",
ap:["Non possiamo essere amici intimi di tutti: i rapporti richiedono tempo, e il tempo è finito. Di solito abbiamo circa 5 persone molto vicine, una quindicina di amici stretti, una cinquantina di amici e circa 150 conoscenti con cui abbiamo un legame reale. I numeri sono stime, non leggi precise.","Per la vita personale significa scegliere consapevolmente chi coltivare. Per i gruppi significa che oltre un certo numero di persone la fiducia diretta non basta più e servono ruoli, regole e sottogruppi. Molte aziende si organizzano in squadre piccole proprio per questo."],
ri:[["Troppi contatti, pochi legami","Hai tante conoscenze ma ti senti solo."],["Amicizie trascurate","Le persone importanti ricevono le briciole del tuo tempo."],["Gruppo che cresce e si complica","Ciò che funzionava in dieci non funziona in cento."]],
es:[["Relazioni","Ti accorgi di passare ore sui social con conoscenti e poco tempo con i tre amici più cari. Fissi una cena al mese con loro."],["Lavoro","Una startup arriva a 120 persone e la comunicazione salta. Si divide in squadre di 8-10 con un riferimento ciascuna."]],
ex:["Scrivi i nomi delle tue 5 persone più vicine e delle 15 successive. Quanto tempo hai dedicato a ciascuna nell'ultimo mese?","Scegli due persone importanti trascurate e contattale questa settimana.","Se lavori in un gruppo grande, individua dove servirebbe una struttura più piccola."],
q:["A chi sto dedicando il mio tempo limitato?","Chi è nel mio cerchio più stretto e lo sa?","Questo gruppo è troppo grande per funzionare senza regole?"],
er:"Trattare il numero come una regola esatta. È un ordine di grandezza utile, non un limite preciso.",
qz:[["Cosa suggerisce il numero di Dunbar?",["Possiamo avere infinite amicizie","Le relazioni stabili che possiamo mantenere sono limitate","Servono 150 amici","I social risolvono il problema"],1,"Tempo e attenzione limitano i legami reali."],["Perché le aziende grandi creano squadre piccole?",["Per risparmiare","Perché la fiducia diretta funziona meglio in gruppi ridotti","Per moda","Per controllare"],1,"Nei gruppi piccoli ci si conosce davvero."]]},

{t:"Organizzazione gerarchica",d:2,
sp:"Molti gruppi, dagli animali alle aziende, si organizzano in livelli: chi decide, chi coordina, chi esegue. La gerarchia aiuta a prendere decisioni e a coordinarsi quando si è in tanti, ma può rallentare le informazioni e soffocare le idee. Il modello ti aiuta a capire come funzionano i livelli e a muoverti meglio dentro di essi.",
ap:["In un branco c'è chi guida e chi segue; in un'azienda ci sono responsabili e collaboratori. La gerarchia riduce i conflitti su chi decide e rende chiaro a chi rivolgersi. Ma le informazioni salendo si filtrano: le cattive notizie arrivano tardi in cima, e chi sta in basso spesso non osa parlare.","Per usarla bene, chiediti chi decide davvero su una certa cosa e come arrivano le informazioni a quella persona. Se guidi un gruppo, crea occasioni in cui le persone possano dirti le cose scomode senza paura."],
ri:[["Decisioni lente","Ogni scelta deve salire molti livelli."],["Cattive notizie nascoste","I problemi emergono troppo tardi."],["Non sai a chi chiedere","Non è chiaro chi abbia l'ultima parola."]],
es:[["Lavoro","Vuoi una modifica al progetto. Invece di parlarne con tutti, scopri chi decide davvero e prepari per lui una proposta breve."],["Famiglia","In casa non è chiaro chi decida sulle spese grandi e si litiga. Stabilite insieme chi decide cosa."]],
ex:["Disegna la mappa delle decisioni del tuo lavoro: chi decide cosa?","Se guidi qualcuno, chiedi questa settimana: «Cosa non mi state dicendo che dovrei sapere?»","Individua una decisione che sale troppi livelli e proponi di spostarla più in basso."],
q:["Chi decide davvero su questa cosa?","Quali informazioni non arrivano a chi decide?","Questa decisione potrebbe essere presa più vicino al problema?"],
er:"Pensare che la gerarchia sia sempre un male, o sempre un bene. Dipende da come è usata.",
qz:[["Qual è un rischio delle gerarchie?",["Troppa velocità","Le cattive notizie arrivano tardi a chi decide","Nessuno decide","Troppa libertà"],1,"Le informazioni si filtrano salendo i livelli."],["Vuoi far approvare un'idea in azienda. Cosa suggerisce il modello?",["Parlarne con tutti","Capire chi decide e come arrivano le informazioni a quella persona","Aspettare","Saltare tutti i livelli"],1,"Conoscere la struttura rende più efficace l'azione."]]},

{t:"Incentivi",d:1,
sp:"Le persone tendono a fare ciò per cui vengono premiate e a evitare ciò per cui vengono punite. Se vuoi capire un comportamento, guarda gli incentivi. Se vuoi cambiarlo, cambia gli incentivi. Il modello spiega molte situazioni che sembrano irrazionali e ti aiuta a progettare regole migliori.",
ap:["Un venditore pagato a provvigione spinge il prodotto che gli rende di più, non quello migliore per te. Un'azienda che premia le ore in ufficio ottiene ore in ufficio, non risultati. Gli incentivi non sono solo soldi: contano anche approvazione, status, tempo libero, evitare problemi.","Spesso gli incentivi producono effetti inattesi, perché le persone ottimizzano ciò che viene misurato. Prima di creare un premio o una regola, chiediti come potrebbe essere aggirata. E quando ricevi un consiglio, chiediti che incentivi ha chi te lo dà."],
ri:[["Comportamenti «strani»","Qualcuno agisce in modo che ti sembra irrazionale."],["Consigli interessati","Chi ti consiglia guadagna dalla tua scelta."],["Regole aggirate","Le persone rispettano la lettera ma non lo spirito."]],
es:[["Soldi","Un consulente ti propone un investimento. Gli chiedi come viene pagato: prende una commissione alta proprio su quel prodotto."],["Famiglia","Paghi il figlio per ogni libro letto: legge libri sempre più corti. Cambi premio: una gita per ogni ora di lettura con te."]],
ex:["Pensa a un comportamento che ti irrita in qualcuno e chiediti quali incentivi lo spingono.","Prima di seguire un consiglio importante, scrivi cosa guadagna chi te lo dà.","Analizza un incentivo che usi (con figli, colleghi, te stesso): come potrebbe essere aggirato?"],
q:["Cosa viene premiato qui, davvero?","Che interesse ha chi mi dà questo consiglio?","Come potrebbe essere aggirata questa regola?"],
er:"Pensare solo agli incentivi economici e dimenticare quelli sociali ed emotivi.",
qz:[["Un ospedale premia i medici che dimettono più pazienti velocemente. Qual è un rischio?",["Pazienti più sani","Dimissioni troppo affrettate","Nessun rischio","Medici meno motivati"],1,"Le persone ottimizzano ciò che viene misurato."],["Quale domanda è più utile davanti a un consiglio finanziario?",["Quanto è simpatico il consulente?","Come viene pagato il consulente?","Quanti anni ha?","Che auto guida?"],1,"Gli incentivi spiegano molto dei consigli."]]},

{t:"Minimizzazione del dispendio energetico",d:1,
sp:"Gli esseri viventi tendono a risparmiare energia: scegliamo la strada più breve, la decisione più semplice, l'opzione predefinita. Non è pigrizia, è un istinto utile. Conoscerlo ti permette di progettare ambienti dove la scelta più facile è anche quella giusta, per te e per gli altri.",
ap:["Il cervello consuma molta energia, quindi preferisce le scorciatoie: abitudini, regole semplici, opzioni già impostate. Per questo, quando un modulo ha una casella già spuntata, la maggior parte delle persone la lascia così. E per questo i sentieri nei parchi si formano dove la gente taglia il prato.","Usare il modello significa smettere di combattere questa tendenza e sfruttarla: rendi le buone scelte predefinite, automatiche e vicine. E quando vedi un comportamento diffuso, chiediti se non sia semplicemente il percorso più facile."],
ri:[["Opzioni predefinite","La maggior parte sceglie ciò che è già impostato."],["Scorciatoie","Le persone tagliano dove possono."],["Abitudini automatiche","Fai cose senza pensarci."]],
es:[["Salute","Metti una bottiglia d'acqua sulla scrivania ogni mattina. Bevi di più senza doverci pensare."],["Lavoro","Nel modulo di iscrizione alla formazione il corso consigliato è già selezionato. Le iscrizioni raddoppiano."]],
ex:["Scegli una buona abitudine e rendila l'opzione predefinita della tua giornata.","Osserva dove tu o gli altri prendete scorciatoie: cosa dicono del percorso «ufficiale»?","Elimina una decisione ricorrente con una regola fissa (es. stessa colazione nei giorni feriali)."],
q:["Qual è la strada più facile in questa situazione?","Posso far coincidere la scelta più facile con quella giusta?","Quale decisione ricorrente posso trasformare in automatica?"],
er:"Giudicare pigro chi segue la via più facile invece di migliorare la via.",
qz:[["Perché molte persone lasciano le impostazioni predefinite?",["Perché sono le migliori","Perché cambiare richiede energia","Per obbligo","Per caso"],1,"Il predefinito è il percorso a minimo sforzo."],["Come sfruttare il modello per mangiare meglio?",["Contare ogni caloria","Rendere i cibi sani i più facili da prendere","Vietarsi tutto","Andare a fare spesa ogni giorno"],1,"La scelta facile diventa quella giusta."]]}
);

LIB.push(
{t:"Circuiti di retroazione",d:2,
sp:"In un circuito di retroazione il risultato di un'azione torna indietro e influenza l'azione stessa. Se il ritorno amplifica (retroazione positiva), il fenomeno cresce sempre di più; se lo frena (retroazione negativa), il sistema si stabilizza. Riconoscere questi circuiti ti aiuta a capire perché alcune cose esplodono e altre restano ferme.",
ap:["Un termostato è retroazione negativa: se fa troppo caldo spegne il riscaldamento, se fa freddo lo accende. Un microfono vicino alla cassa che fischia è retroazione positiva: il suono amplificato rientra nel microfono e cresce. Nella vita: più ti alleni, più hai energia, più ti alleni; più rimandi, più ti senti in colpa, più rimandi.","Per usarlo, cerca i cicli: cosa alimenta cosa? Se un circuito positivo ti porta nella direzione sbagliata, interrompilo presto. Se ti porta nella direzione giusta, aiutalo a partire. E ricorda che un circuito con ritardo (il feedback arriva tardi) porta a correggere troppo, come chi regola la doccia girando troppo la manopola."],
ri:[["Spirali","Una situazione peggiora o migliora sempre più in fretta."],["Ritorno ritardato","Vedi gli effetti delle tue scelte solo dopo molto tempo."],["Stabilità ostinata","Qualcosa torna sempre allo stesso punto."]],
es:[["Te stesso","Dormi poco, sei stanco, bevi più caffè, dormi ancora meno. Interrompi il circuito vietandoti il caffè dopo le 14."],["Lavoro","Un cliente soddisfatto porta altri clienti, che portano altri clienti. Investi nel servizio per alimentare questo circuito."]],
ex:["Disegna un circolo vizioso della tua vita con frecce: cosa alimenta cosa? Trova il punto più facile da interrompere.","Individua un circolo virtuoso e scegli un gesto per avviarlo questa settimana.","Trova un'area in cui ricevi feedback troppo tardi e cerca un modo per averne uno più rapido."],
q:["Questo effetto alimenta o frena la sua causa?","Dove posso interrompere il circolo vizioso?","Quanto tempo passa prima che veda il risultato?"],
er:"Reagire in modo esagerato a un feedback ritardato, correggendo troppo.",
qz:[["Quale è un esempio di retroazione negativa?",["Il fischio di un microfono","Un termostato","Il passaparola che cresce","Una valanga"],1,"Riporta il sistema verso l'equilibrio."],["Più rimandi, più ti senti in colpa, più rimandi. Cos'è?",["Equilibrio","Retroazione positiva che amplifica il problema","Retroazione negativa","Caso"],1,"L'effetto alimenta la causa."]]},

{t:"Equilibrio",d:2,
sp:"Molti sistemi tendono a uno stato di equilibrio e, se ne vengono allontanati, cercano di tornarci. Il corpo mantiene la temperatura, il mercato i prezzi, una persona le sue abitudini. Il modello spiega perché i cambiamenti spesso non durano e ti aiuta a capire quando serve una spinta abbastanza forte per creare un nuovo equilibrio.",
ap:["Dopo una dieta molto rigida il peso torna spesso al punto di partenza; dopo una riorganizzazione aziendale le vecchie abitudini riaffiorano. Il sistema ha forze che lo riportano dove era. Per questo un cambiamento temporaneo raramente basta.","Per creare un nuovo equilibrio devi cambiare le forze che tengono in piedi il vecchio: l'ambiente, le abitudini, le persone intorno. Ricorda anche che l'equilibrio non è immobilità: è un continuo aggiustamento, come un ciclista che resta in piedi pedalando."],
ri:[["Ritorno al punto di partenza","I cambiamenti durano poco."],["Resistenza al cambiamento","Il gruppo torna sempre alle vecchie abitudini."],["Stabilità apparente","Tutto sembra fermo ma c'è un continuo lavoro dietro."]],
es:[["Salute","Una dieta drastica fa perdere peso, ma lo riprendi. Cambiando invece spesa, orari e porzioni crei un nuovo equilibrio stabile."],["Lavoro","Si introduce un nuovo software, ma tutti continuano a usare i fogli Excel. Si elimina l'accesso ai vecchi file e si crea l'abitudine nuova."]],
ex:["Ripensa a un cambiamento che non è durato. Quali forze ti hanno riportato indietro?","Per un cambiamento che vuoi fare, elenca tre forze del vecchio equilibrio e come indebolirle.","Osserva un'area della tua vita che sembra stabile: quale lavoro invisibile la mantiene così?"],
q:["Quali forze riportano il sistema al vecchio stato?","Il mio cambiamento è abbastanza forte e duraturo?","Cosa mantiene in equilibrio questa situazione?"],
er:"Pensare che un cambiamento sia fatto una volta raggiunto. Senza nuove forze, si torna indietro.",
qz:[["Perché molte diete non funzionano a lungo?",["Perché sono troppo brevi","Perché il sistema torna al vecchio equilibrio se non cambiano le abitudini","Perché sono costose","Perché sono facili"],1,"Le forze del vecchio equilibrio restano attive."],["Cosa serve per un nuovo equilibrio?",["Una spinta temporanea","Cambiare le forze che sostenevano il vecchio","Aspettare","Forza di volontà e basta"],1,"L'ambiente e le abitudini devono cambiare."]]},

{t:"Colli di bottiglia",d:2,
sp:"Un collo di bottiglia è il punto più stretto di un processo, quello che limita la velocità di tutto il resto. Puoi migliorare tutte le altre parti, ma se non allarghi il collo il risultato non cambia. Il modello ti chiede di trovare il vero limite prima di cercare soluzioni.",
ap:["In una catena di montaggio, se una macchina produce 10 pezzi l'ora e le altre 50, l'intera linea produce 10 pezzi l'ora. In una famiglia la mattina, se c'è un solo bagno, tutto dipende da quello. Migliorare ciò che non è il collo di bottiglia è uno spreco.","Per usarlo, osserva dove si accumulano le attese: lì c'è il collo. Prima prova a sfruttarlo al meglio (non lasciarlo mai fermo), poi allargalo, poi cerca il successivo, perché ogni volta che ne risolvi uno ne appare un altro."],
ri:[["Code e attese","Il lavoro si accumula in un punto."],["Tutti aspettano una persona","Un'approvazione o una competenza unica blocca tutto."],["Migliorie senza effetto","Ottimizzi ma il risultato non cambia."]],
es:[["Lavoro","Ogni documento deve essere firmato dal direttore, che è sempre in viaggio. Si delega la firma per le pratiche sotto una certa cifra."],["Casa","La mattina tutti aspettano il bagno. Spostate trucco e barba in camera: i tempi si dimezzano."]],
ex:["Scegli un processo che ti rallenta e disegnalo in passaggi. Dove si accumula l'attesa?","Se sei tu il collo di bottiglia per qualcuno, trova una decisione che puoi delegare.","Prima di migliorare qualcosa, chiediti: è davvero questo il limite?"],
q:["Dove si accumula il lavoro in attesa?","Sto migliorando il punto che limita davvero?","Quale sarà il prossimo collo di bottiglia?"],
er:"Ottimizzare le parti veloci invece della più lenta.",
qz:[["Una pizzeria ha 5 camerieri ma un solo forno piccolo. Cosa conviene migliorare?",["Assumere altri camerieri","Il forno","Il menu","L'insegna"],1,"Il forno limita la produzione di tutto il locale."],["Dopo aver risolto un collo di bottiglia, cosa succede?",["Il processo è perfetto","Ne appare un altro in un altro punto","Tutto rallenta","Nulla"],1,"Il limite si sposta al punto successivo più stretto."]]},

{t:"Scala",d:3,
sp:"Quando un sistema cambia dimensione, cambiano anche le sue regole. Ciò che funziona per dieci persone non funziona per mille; una ricetta per quattro non si moltiplica semplicemente per cento. Il modello ti chiede di prevedere cosa si rompe quando qualcosa cresce o si riduce.",
ap:["Una formica può cadere da grande altezza senza farsi male, un elefante no: con la dimensione cambiano i rapporti tra peso e resistenza. Un'azienda di cinque persone si coordina parlando, una di cinquecento ha bisogno di processi. Un problema piccolo e raro diventa enorme quando hai milioni di clienti.","Prima di far crescere qualcosa, chiediti cosa smetterà di funzionare: la comunicazione, il controllo della qualità, il tuo tempo. E ricorda che crescere non è sempre meglio: alcune cose sono buone proprio perché sono piccole."],
ri:[["Crescita che complica tutto","Ciò che era semplice diventa caotico."],["Soluzioni che non si moltiplicano","Una cosa funziona in piccolo ma non in grande."],["Problemi rari che diventano frequenti","Con i numeri grandi, l'improbabile accade."]],
es:[["Lavoro","Un artigiano riceve un grande ordine. Scopre che non può semplicemente lavorare dieci volte di più: servono attrezzi, aiuti e un altro metodo."],["Famiglia","Organizzare una cena per 4 è facile, per 40 serve un piano diverso: buffet, aiuti, spesa all'ingrosso."]],
ex:["Pensa a un progetto che vuoi far crescere: cosa si romperebbe con 10 volte più clienti o persone?","Trova una cosa che funziona perché è piccola e proteggila dalla crescita.","Calcola un piccolo problema ripetuto su larga scala (es. 5 minuti persi al giorno per un anno)."],
q:["Cosa cambia se questa cosa diventa 10 volte più grande?","Cosa si rompe per primo con la crescita?","È davvero meglio crescere?"],
er:"Pensare che crescere significhi solo fare di più della stessa cosa.",
qz:[["Un ristorante passa da 20 a 200 coperti. Cosa suggerisce il modello?",["Basta comprare più ingredienti","Organizzazione, cucina e processi dovranno cambiare","Nulla cambia","Bisogna ridurre il menu a zero"],1,"Con la scala cambiano le regole di funzionamento."],["Un errore che capita una volta su un milione è...",["Sempre irrilevante","Frequente se servi milioni di persone","Impossibile","Facile da prevedere"],1,"Con numeri grandi, l'improbabile diventa quotidiano."]]},

{t:"Margine di sicurezza",d:1,
sp:"Gli ingegneri progettano un ponte per sopportare un carico molto superiore a quello previsto, perché sanno che i calcoli possono sbagliare e l'imprevisto arriva. Nella vita il margine di sicurezza è lo spazio tra ciò che prevedi e ciò che ti puoi permettere se le cose vanno peggio. Ti protegge dagli errori, che succederanno.",
ap:["Partire con mezz'ora di anticipo, tenere da parte tre mesi di spese, non spendere tutto il budget di un progetto, prevedere tempi più lunghi del necessario: sono margini di sicurezza. Costano qualcosa in efficienza, ma evitano disastri.","Il margine deve essere proporzionato al rischio e all'incertezza. Più la situazione è nuova o le conseguenze di un errore sono gravi, più margine serve. Il rischio maggiore è eliminare il margine nei periodi buoni, quando tutto sembra sotto controllo."],
ri:[["Tutto calcolato al minuto","Non c'è spazio per imprevisti."],["Conto sempre a zero","Nessuna riserva per le emergenze."],["Previsioni ottimistiche","Pianifichi come se tutto andasse bene."]],
es:[["Soldi","Metti da parte tre mesi di spese. Quando si rompe la macchina, non devi chiedere un prestito."],["Lavoro","Prometti la consegna in dieci giorni anche se pensi di finire in sette. Quando arriva un intoppo, rispetti comunque la scadenza."]],
ex:["Calcola quanti mesi potresti vivere con i tuoi risparmi. Scegli un primo obiettivo di margine.","Per le prossime tre scadenze, aggiungi il 30% al tempo che stimi.","Individua un'area della tua vita senza margine (tempo, soldi, energia) e crea un piccolo cuscinetto."],
q:["Cosa succede se le cose vanno peggio del previsto?","Quanto margine ho tra ciò che serve e ciò che ho?","Quanto è grave un errore qui, e quanto sono incerto?"],
er:"Considerare il margine uno spreco nei periodi buoni.",
qz:[["Perché un ponte viene progettato per un carico maggiore del previsto?",["Per spendere di più","Per proteggersi da errori e imprevisti","Per estetica","Per legge e basta"],1,"Il margine assorbe ciò che i calcoli non prevedono."],["Quando serve più margine di sicurezza?",["Quando la situazione è nota e gli errori costano poco","Quando l'incertezza è alta e gli errori sono gravi","Mai","Sempre lo stesso"],1,"Il margine va proporzionato al rischio."]]},

{t:"Ricambio",d:2,
sp:"In un sistema le parti si rinnovano di continuo: le cellule del corpo, i dipendenti di un'azienda, i clienti di un negozio, gli abitanti di una città. Dall'esterno sembra tutto uguale, ma dentro cambia. Il modello ti invita a considerare il ricambio: chi entra, chi esce e quanto velocemente.",
ap:["Un'azienda con 100 dipendenti che ne perde 30 l'anno è molto diversa da una che ne perde 3, anche se ha sempre 100 persone. Un negozio che acquista sempre nuovi clienti ma li perde subito non cresce. Il numero totale nasconde il flusso.","Il ricambio ha costi (formare persone nuove, trovare nuovi clienti) e benefici (idee nuove, rinnovamento). Per gestirlo bene chiediti quanto ricambio è sano, perché le persone o le cose escono, e cosa si perde ogni volta che qualcosa se ne va."],
ri:[["Numeri stabili, persone diverse","Il totale non cambia ma i volti sì."],["Conoscenza che se ne va","Quando qualcuno esce, si perdono competenze."],["Sforzo continuo per restare uguali","Devi sempre rimpiazzare ciò che perdi."]],
es:[["Lavoro","Un negozio fa tante promozioni per attirare clienti nuovi, ma il 70% non torna. Investire nel farli tornare costa meno."],["Relazioni","Il gruppo di amici cambia negli anni. Accetti che alcune amicizie finiscano e resti aperto a nuove."]],
ex:["Scegli un gruppo (clienti, colleghi, amici) e stima chi è entrato e chi è uscito nell'ultimo anno.","Individua una conoscenza importante che si perderebbe se una persona andasse via. Scrivila o condividila.","Chiediti perché le persone o i clienti se ne vanno e scegli una piccola azione per trattenerli."],
q:["Cosa entra e cosa esce, e a che velocità?","Cosa perdo ogni volta che qualcosa se ne va?","Quanto ricambio è sano qui?"],
er:"Guardare solo il totale e non il flusso.",
qz:[["Un'azienda ha sempre 50 dipendenti ma ogni anno ne cambia 25. Cosa indica?",["Stabilità","Alto ricambio con costi di formazione e perdita di esperienza","Crescita","Efficienza"],1,"Il totale stabile nasconde un flusso elevato."],["Perché conviene trattenere i clienti?",["Non conviene","Spesso costa meno che trovarne di nuovi","Perché è obbligatorio","Per abitudine"],1,"Ridurre il ricambio riduce i costi di acquisizione."]]},

{t:"Algoritmi",d:2,
sp:"Un algoritmo è una sequenza di passaggi chiari che porta a un risultato, come una ricetta. Trasformare le attività ripetitive in algoritmi ti fa risparmiare energia mentale, riduce gli errori e permette ad altri di farle al posto tuo. Il modello ti aiuta a vedere i processi nascosti nella tua vita e a migliorarli.",
ap:["Molte attività che facciamo ogni giorno sono già algoritmi: la routine del mattino, il modo di fare la spesa, la procedura per chiudere un mese al lavoro. Scriverle in passaggi rende visibili gli sprechi e gli errori, e permette di migliorarle una parte alla volta.","Le checklist dei piloti e dei chirurghi sono algoritmi semplici che salvano vite. Non servono per le persone poco esperte, ma per evitare le distrazioni di quelle esperte. Attenzione però: un algoritmo funziona bene solo nel contesto per cui è pensato."],
ri:[["Rifai sempre da capo","Ogni volta devi ricordare come si fa."],["Errori di distrazione","Dimentichi passaggi semplici."],["Solo tu sai come si fa","Nessun altro può sostituirti."]],
es:[["Casa","Scrivi una lista fissa per la valigia dei viaggi. Non dimentichi più il caricabatterie."],["Lavoro","La chiusura mensile richiede due giorni. Scritta in 15 passaggi, si scopre che tre sono inutili."]],
ex:["Scegli un'attività che ripeti ogni settimana e scrivila in passaggi numerati.","Crea una checklist di cinque punti per un'attività in cui commetti spesso errori.","Rileggi una tua routine e cancella un passaggio che non serve."],
q:["Quali passaggi ripeto sempre allo stesso modo?","Posso scrivere questa procedura perché un altro la segua?","Questo algoritmo funziona ancora nel contesto attuale?"],
er:"Seguire un algoritmo anche quando la situazione è cambiata.",
qz:[["Perché i chirurghi usano le checklist?",["Perché sono inesperti","Per evitare errori di distrazione anche quando sono esperti","Per legge","Per perdere tempo"],1,"Le checklist proteggono dalla dimenticanza."],["Cosa fa un algoritmo?",["Risolve tutto","Indica una sequenza di passaggi chiari per ottenere un risultato","Sostituisce il pensiero","Esiste solo nei computer"],1,"È una procedura ripetibile."]]},

{t:"Sistemi adattivi complessi",d:3,
sp:"Un sistema adattivo complesso è fatto di tanti agenti che reagiscono gli uni agli altri e all'ambiente: un mercato, un traffico, una città, un'azienda. Il loro comportamento d'insieme è difficile da prevedere e cambia quando provi a controllarlo. Il modello ti invita a fare piccoli esperimenti invece di grandi piani rigidi.",
ap:["Nel traffico ogni guidatore reagisce agli altri: una frenata può creare un ingorgo chilometri dopo. Se costruisci una nuova strada, le persone cambiano abitudini e il traffico può peggiorare. Nei sistemi complessi gli agenti si adattano alle tue azioni, quindi le previsioni semplici falliscono.","La strategia migliore è fare piccoli esperimenti, osservare le reazioni e correggere. Diversifica, tieni margini e diffida di chi promette di controllare tutto con un piano. Pensa come un giardiniere, che crea condizioni favorevoli, più che come un ingegnere, che progetta ogni pezzo."],
ri:[["Molti attori che reagiscono","Le persone cambiano comportamento in base agli altri."],["Previsioni che falliscono","Il piano non funziona come previsto."],["Effetti sproporzionati","Piccole cause, grandi conseguenze."]],
es:[["Lavoro","Invece di riorganizzare tutta l'azienda in un colpo, si prova un nuovo metodo in un reparto per due mesi, si osserva e si corregge."],["Famiglia","Le regole rigide sugli schermi provocano solo nuovi modi per aggirarle. Funziona meglio provare una regola semplice, parlarne e adattarla."]],
ex:["Scegli un cambiamento che vuoi fare e trasformalo in un piccolo esperimento di due settimane.","Ripensa a un piano che è fallito: come hanno reagito le persone in modo inatteso?","Prima di una decisione in un gruppo, chiediti come si adatteranno gli altri."],
q:["Come reagiranno gli altri alla mia azione?","Posso provare in piccolo prima di decidere in grande?","Sto cercando di controllare ciò che posso solo influenzare?"],
er:"Credere di poter prevedere e controllare tutto con un buon piano.",
qz:[["Qual è l'approccio migliore in un sistema complesso?",["Un piano dettagliato e rigido","Piccoli esperimenti e correzioni","Non fare nulla","Copiare gli altri"],1,"Si impara osservando come il sistema reagisce."],["Si costruisce una nuova strada e il traffico aumenta. Perché?",["Errore di costruzione","Le persone si adattano e più persone usano l'auto","Caso","Strada troppo stretta"],1,"Gli agenti cambiano comportamento in risposta."]]},

{t:"Massa critica",d:2,
sp:"La massa critica è la soglia oltre la quale un cambiamento diventa autosufficiente. Sotto la soglia serve una spinta continua; sopra, il fenomeno si alimenta da solo. Vale per le reazioni nucleari, le mode, i social network, le abitudini. Il modello ti aiuta a capire quanto sforzo serve prima che le cose prendano velocità.",
ap:["Un social network senza utenti è inutile; con abbastanza persone diventa indispensabile e attira gli altri. Un'abitudine all'inizio richiede tanta disciplina, poi diventa automatica. Prima della soglia i risultati sembrano nulli e molti si arrendono proprio lì.","Per usare il modello stima dove sia la soglia e concentra lo sforzo per superarla, invece di distribuirlo su troppe cose. Conviene anche iniziare da un gruppo piccolo dove la soglia è più facile da raggiungere, e poi allargarsi."],
ri:[["Sforzo senza risultati visibili","Sembra che nulla stia funzionando."],["Effetto valanga","Dopo un punto tutto accelera."],["Iniziative che si spengono","Partono ma non raggiungono abbastanza persone."]],
es:[["Lavoro","Un nuovo strumento in ufficio viene usato da pochi e abbandonato. Si convince un intero reparto a usarlo per un mese: diventa lo standard."],["Te stesso","Per le prime tre settimane la corsa è faticosa. Dopo, diventa parte della giornata e manca se salti."]],
ex:["Scegli un progetto o abitudine e stima la soglia oltre cui si regge da solo.","Concentra le energie su un solo obiettivo questa settimana invece di dividerle su tre.","Per un'iniziativa di gruppo, individua il primo piccolo gruppo da coinvolgere completamente."],
q:["Dove si trova la soglia oltre cui il cambiamento si regge da solo?","Sto distribuendo troppo lo sforzo?","Quale gruppo piccolo posso coinvolgere per primo?"],
er:"Arrendersi poco prima della soglia perché i risultati non si vedono ancora.",
qz:[["Perché molte nuove app falliscono?",["Sono brutte","Non raggiungono abbastanza utenti da diventare utili","Costano troppo","Sono troppo semplici"],1,"Sotto la massa critica il valore resta basso."],["Come conviene lanciare un'iniziativa?",["Per tutti contemporaneamente","Concentrandosi su un gruppo piccolo fino a superare la soglia","Senza sforzo","Aspettando che parta da sola"],1,"In un gruppo piccolo la soglia si raggiunge prima."]]},

{t:"Emergenza",d:3,
sp:"L'emergenza è quando un insieme mostra proprietà che le singole parti non hanno. Un singolo neurone non pensa, ma miliardi di neuroni sì; una formica non costruisce una colonia, ma migliaia sì. Il modello ti ricorda che per capire un gruppo, una squadra o una città non basta studiare i singoli: conta come interagiscono.",
ap:["Uno stormo di uccelli si muove come un'unica forma, senza un capo, perché ogni uccello segue poche regole semplici rispetto ai vicini. La cultura di un'azienda emerge da migliaia di piccole interazioni, non da un documento. Il traffico, i prezzi, la lingua: tutti fenomeni emergenti.","Per usarlo, quando vuoi cambiare un insieme, lavora sulle regole semplici delle interazioni invece che sul risultato finale. Una squadra di persone brillanti può funzionare male e una di persone normali benissimo: dipende da come collaborano."],
ri:[["Il tutto diverso dalla somma","Il gruppo si comporta in modo che nessuno ha deciso."],["Cultura","Abitudini condivise che nessuno ha imposto."],["Ordine senza capo","Un sistema si organizza da solo."]],
es:[["Lavoro","Una squadra di esperti non produce idee. Si introduce una regola semplice: in ogni riunione ognuno parla prima che il capo dia la sua opinione. Il clima cambia."],["Famiglia","L'atmosfera di casa nasce da piccoli gesti quotidiani: come ci si saluta, come si discute a tavola."]],
ex:["Osserva un gruppo di cui fai parte: quale comportamento d'insieme nessuno ha deciso esplicitamente?","Proponi una regola semplice di interazione (es. niente telefoni a tavola) e osserva cosa emerge.","Pensa a una squadra che funziona bene: cosa succede tra le persone, non solo dentro ciascuna?"],
q:["Quale comportamento nasce dalle interazioni e non dai singoli?","Quale regola semplice potrei cambiare?","Sto guardando solo le parti invece dei collegamenti?"],
er:"Cercare di capire o cambiare un gruppo guardando solo i singoli membri.",
qz:[["Cosa è un fenomeno emergente?",["Una cosa urgente","Una proprietà dell'insieme che le parti singole non hanno","Un errore","Una decisione del capo"],1,"Nasce dalle interazioni tra le parti."],["Come cambiare la cultura di un gruppo?",["Scrivere un documento","Cambiare le regole semplici delle interazioni quotidiane","Sostituire tutti","Ignorarla"],1,"La cultura emerge dalle interazioni."]]},

{t:"Dinamiche caotiche",d:3,
sp:"In un sistema caotico piccole differenze iniziali portano a risultati enormemente diversi. Il meteo è l'esempio classico: per questo non si può prevedere con precisione oltre pochi giorni. Il modello ti ricorda che alcune cose sono imprevedibili per natura e che conviene prepararsi a più scenari invece di affidarsi a una previsione.",
ap:["Il meteorologo Edward Lorenz scoprì che arrotondare un numero nella sua simulazione cambiava completamente le previsioni del tempo. Da qui l'immagine dell'effetto farfalla. I sistemi caotici seguono regole precise, ma sono così sensibili che anche errori minimi crescono rapidamente.","Nella vita molte cose hanno questa natura: carriere, mercati, relazioni. Una conversazione casuale può cambiare una vita. Invece di cercare previsioni precise, costruisci flessibilità, tieni opzioni aperte e osserva spesso per correggerti."],
ri:[["Previsioni a lungo termine inaffidabili","Più guardi lontano, meno ne azzecchi."],["Piccoli eventi, grandi effetti","Un dettaglio cambia tutto."],["Sorprese continue","Lo stesso piano dà risultati diversi."]],
es:[["Lavoro","Invece di un piano quinquennale rigido, un'azienda fa piani di sei mesi e li rivede regolarmente."],["Te stesso","Un incontro casuale a una festa porta a un nuovo lavoro. Capisci il valore di lasciare spazio all'imprevisto."]],
ex:["Ripensa a un piccolo evento che ha cambiato molto la tua vita.","Per un tuo progetto lungo, sostituisci la previsione unica con tre scenari e una revisione periodica.","Cerca un modo per tenere aperte più opzioni in una decisione importante."],
q:["Quanto è affidabile una previsione così lontana?","Come posso restare flessibile se cambia tutto?","Quali piccoli fattori potrebbero cambiare molto il risultato?"],
er:"Credere che una previsione dettagliata sul lungo periodo sia affidabile in un sistema caotico.",
qz:[["Perché il meteo è difficile da prevedere oltre pochi giorni?",["Gli strumenti sono vecchi","Piccole differenze iniziali crescono e cambiano tutto","È casuale","Non ci sono regole"],1,"Il sistema è estremamente sensibile alle condizioni iniziali."],["Come affrontare un sistema caotico?",["Con una previsione precisa","Con flessibilità e revisioni frequenti","Ignorandolo","Con un piano rigido"],1,"La flessibilità sostituisce la previsione."]]},

{t:"Irriducibilità",d:3,
sp:"Alcune cose non si possono semplificare oltre un certo punto senza perderle. Un buon pranzo di famiglia richiede tempo insieme; non lo puoi comprimere in dieci minuti. Una competenza richiede pratica; non c'è un riassunto che la sostituisca. Il modello ti aiuta a riconoscere il nucleo minimo che non si può tagliare.",
ap:["Possiamo ottimizzare molte cose, ma ogni processo ha una parte essenziale. Nove donne non fanno un bambino in un mese. Leggere il riassunto di un libro non dà la stessa esperienza del libro. Una relazione profonda richiede ore insieme, non solo messaggi efficienti.","Usarlo significa chiedersi: qual è il minimo indispensabile perché questa cosa resti se stessa? Tagliare sotto quella soglia non rende più efficiente, rende inutile. Allo stesso tempo, conoscere il nucleo ti permette di togliere senza paura tutto il resto."],
ri:[["Scorciatoie che non funzionano","Hai tagliato e il risultato è peggiorato."],["Promesse di risultati immediati","«Impara una lingua in 7 giorni»."],["Cose che hanno bisogno di tempo","Crescita, fiducia, apprendimento."]],
es:[["Studio","Provi a imparare a suonare con video riassuntivi. Capisci che il nucleo irriducibile è la pratica quotidiana con lo strumento."],["Relazioni","Con i figli il tempo di qualità non sostituisce del tutto la quantità: serve anche stare insieme a lungo senza obiettivi."]],
ex:["Scegli un'attività che hai cercato di velocizzare troppo. Qual è il suo nucleo irriducibile?","Per un obiettivo, scrivi la parte che nessuna scorciatoia può sostituire e programmala.","Trova una cosa da cui puoi togliere il superfluo sapendo cosa è essenziale."],
q:["Qual è il nucleo che non si può tagliare?","Questa scorciatoia toglie qualcosa di essenziale?","Cosa resta se tolgo tutto il superfluo?"],
er:"Pensare che tutto si possa ottimizzare o accelerare.",
qz:[["Cosa significa irriducibile?",["Che non si può migliorare","Che oltre un certo punto non si può semplificare senza perdere la cosa","Che è inutile","Che è molto grande"],1,"Esiste un nucleo minimo indispensabile."],["Quale promessa ignora l'irriducibilità?",["Allenarsi tre volte a settimana per sei mesi","Diventare esperti di una lingua in una settimana","Leggere ogni giorno","Fare pratica costante"],1,"L'apprendimento ha tempi minimi che non si possono saltare."]]}
);

LIB.push(
{t:"Rendimenti decrescenti",d:1,
sp:"All'inizio ogni sforzo in più porta grandi miglioramenti, ma oltre un certo punto ogni unità aggiuntiva rende sempre meno. La prima ora di studio vale molto, la decima molto meno. Il modello ti aiuta a capire quando fermarti e spostare energia su qualcos'altro che rende di più.",
ap:["Il primo caffè ti sveglia, il quarto ti agita. Passare da un lavoro scadente a uno buono richiede poco; passare da ottimo a perfetto richiede tantissimo. Questo succede in quasi tutto: allenamento, studio, pulizia, controlli di qualità.","Chiediti quanto ottieni dall'ultima ora o dall'ultimo euro speso. Se è poco, forse conviene smettere o investire altrove. Il perfezionismo è spesso il rifiuto di accettare i rendimenti decrescenti."],
ri:[["Perfezionismo","Continui a ritoccare qualcosa che è già buono."],["Più sforzo, poco miglioramento","Ogni ora in più cambia poco."],["Trascuri altre aree","Tutta l'energia va in una cosa sola."]],
es:[["Lavoro","Passi tre ore a rifinire una presentazione già buona. Con la stessa ora avresti preparato le risposte alle domande difficili."],["Salute","Ti alleni due ore al giorno ma non dormi abbastanza. Ridurre l'allenamento e dormire di più migliora i risultati."]],
ex:["Scegli un'attività in cui sei perfezionista e fissa in anticipo quando è «abbastanza buona».","Per una settimana chiediti alla fine di ogni attività lunga: l'ultima mezz'ora è servita?","Individua un'area trascurata dove anche un piccolo sforzo renderebbe molto."],
q:["Quanto mi rende l'ultima ora o l'ultimo euro?","Quando è abbastanza buono?","Dove lo stesso sforzo renderebbe di più?"],
er:"Fermarsi troppo presto: in alcune aree il valore arriva solo con grande esperienza.",
qz:[["Studi da 8 ore e ti senti stanco. Cosa suggerisce il modello?",["Continuare altre 4 ore","Probabilmente le ore in più rendono poco: riposa","Studiare di notte","Smettere per sempre"],1,"La resa delle ore aggiuntive cala."],["Qual è un segnale dei rendimenti decrescenti?",["Ogni sforzo porta grandi risultati","Molto sforzo per un piccolo miglioramento","Nessuno sforzo","Risultati immediati"],1,"Il beneficio per unità di sforzo diminuisce."]]},

{t:"Distribuzioni",d:3,
sp:"Una media da sola può ingannare: conta come sono distribuiti i dati. In una stanza con dieci persone che guadagnano poco e un miliardario, la media è altissima ma non dice nulla della persona tipica. Il modello ti invita a chiedere la forma dei dati: sono tutti vicini? Ci sono valori estremi?",
ap:["Alcune cose si distribuiscono a campana, con la maggior parte dei casi vicino alla media: l'altezza delle persone, per esempio. Altre hanno code lunghe, dove pochi casi estremi pesano moltissimo: redditi, vendite di libri, follower. Nel primo caso la media è utile, nel secondo inganna.","Davanti a un numero medio chiedi anche la mediana (il valore centrale), la variazione e i casi estremi. E quando prendi decisioni, chiediti quale tipo di distribuzione hai davanti: se ci sono code lunghe, gli eventi estremi accadranno."],
ri:[["Medie usate come verità","«In media si guadagna…», «in media dura…»."],["Casi estremi","Pochi elementi pesano moltissimo."],["Esperienza diversa dalla media","La tua realtà non somiglia al dato ufficiale."]],
es:[["Soldi","Un corso dice che i suoi studenti guadagnano «in media» 5.000 euro al mese. Scopri che due di loro guadagnano moltissimo e la maggior parte poco."],["Casa","Il tempo medio di viaggio è 30 minuti, ma una volta a settimana sono 90. Pianifichi l'arrivo considerando il caso peggiore."]],
ex:["Trova una media nelle notizie o al lavoro e chiediti: qual è la mediana? Ci sono casi estremi?","Per un tuo tempo ricorrente (viaggio, attesa), annota per una settimana i valori e guarda quanto variano.","Pensa a un'area con code lunghe (investimenti, successo creativo) e chiediti cosa significa per le tue aspettative."],
q:["Come sono distribuiti i dati, non solo qual è la media?","Ci sono casi estremi che spostano tutto?","Qual è il valore tipico, la mediana?"],
er:"Prendere decisioni basandosi solo sulla media.",
qz:[["In un quartiere dieci famiglie guadagnano 20.000 euro e una 2 milioni. Quale dato descrive meglio la famiglia tipica?",["La media","La mediana","Il massimo","Il totale"],1,"La mediana non è distorta dal caso estremo."],["Cosa caratterizza una distribuzione a coda lunga?",["Tutti i valori sono simili","Pochi casi estremi pesano moltissimo","Non ci sono dati","La media è sempre affidabile"],1,"I casi rari ma enormi dominano."]]},

{t:"Crescita composta",d:2,
sp:"Nella crescita composta i guadagni producono a loro volta altri guadagni. All'inizio sembra lenta, poi accelera in modo sorprendente. Vale per i risparmi, le competenze, le relazioni e anche per i debiti e le cattive abitudini. Il modello ti invita a iniziare presto e a essere costante.",
ap:["Se migliori dell'1% al giorno, dopo un anno sei molto più avanti di quanto 365 piccoli passi facciano pensare. Lo stesso vale per i soldi: 100 euro al mese investiti per 30 anni crescono molto di più della somma versata, grazie agli interessi sugli interessi. Il tempo è l'ingrediente principale.","Il nostro cervello ragiona in modo lineare e sottovaluta la crescita composta. Per questo si arrende presto (i risultati iniziali sono piccoli) e sottovaluta i debiti (anche loro crescono in modo composto). Inizia presto, sii costante e non interrompere il processo senza motivo."],
ri:[["Risultati lenti all'inizio","Sembra che non cambi nulla."],["Effetti che si accumulano","Ogni progresso facilita il successivo."],["Debiti che crescono","Interessi su interessi."]],
es:[["Soldi","Due amici risparmiano: uno inizia a 25 anni, l'altro a 35. Il primo, pur versando meno in totale, a 65 anni ha molto di più."],["Studio","Leggi 10 pagine al giorno. In un anno sono circa 15 libri, e ogni libro rende più facile capire il successivo."]],
ex:["Scegli una piccola azione quotidiana (10 minuti, 10 pagine, 2 euro) e iniziala oggi.","Calcola con un'app o una tabella quanto diventano 50 euro al mese in 20 anni con un rendimento del 4%.","Individua una cattiva abitudine che si accumula e chiediti dove sarà fra cinque anni."],
q:["Cosa sto facendo che si accumula nel tempo, nel bene o nel male?","Cosa conviene iniziare oggi invece di aspettare?","Sto interrompendo un processo composto troppo presto?"],
er:"Arrendersi prima che la crescita composta abbia tempo di mostrare i suoi effetti.",
qz:[["Perché conviene iniziare a risparmiare presto?",["Perché i soldi valgono di più da giovani","Perché il tempo moltiplica la crescita composta","Perché è obbligatorio","Non conviene"],1,"Più tempo significa più interessi sugli interessi."],["Cosa rende pericolosi i debiti delle carte di credito?",["Sono illegali","Crescono in modo composto","Sono piccoli","Non hanno interessi"],1,"Gli interessi si sommano agli interessi."]]},

{t:"Effetti di rete",d:2,
sp:"Un prodotto o servizio con effetti di rete diventa più utile quante più persone lo usano. Un telefono da solo non serve a nulla; con milioni di utenti sì. Questo crea vantaggi enormi per chi arriva primo e rende difficile cambiare. Il modello ti aiuta a capire perché alcune scelte si impongono e come costruire reti di valore.",
ap:["Le app di messaggistica, i social, le piattaforme di vendita online funzionano così: più utenti attirano altri utenti. Anche le competenze e i contatti hanno effetti di rete: più persone conosci in un settore, più opportunità ti arrivano, e più diventi utile agli altri.","Gli effetti di rete creano anche trappole: usi un servizio perché lo usano tutti, anche se ne esistono di migliori. Nelle tue scelte chiediti quanto valore viene dalla rete e quanto dal prodotto stesso."],
ri:[["«Lo usano tutti»","Scegli qualcosa perché è diffuso."],["Difficile cambiare","Lasciare un servizio significa perdere contatti."],["Il vincitore prende tutto","Un solo servizio domina il mercato."]],
es:[["Lavoro","Un professionista aiuta i colleghi a incontrarsi. Diventa il punto di contatto del settore e riceve molte proposte."],["Te stesso","Vuoi lasciare un social, ma lì ci sono tutti i tuoi amici. Proponi a pochi amici stretti di spostarvi insieme su un'altra app."]],
ex:["Elenca tre servizi che usi solo perché li usano gli altri. Ne vale la pena?","Scegli un gruppo o una rete professionale e contribuisci con qualcosa di utile questa settimana.","Pensa a come la tua rete di contatti potrebbe diventare più utile mettendo in contatto due persone."],
q:["Il valore viene dal prodotto o dalla rete?","Come posso diventare un nodo utile della mia rete?","Sto restando per abitudine collettiva?"],
er:"Pensare che il prodotto migliore vinca sempre: spesso vince chi ha la rete più grande.",
qz:[["Perché è difficile lasciare un social network?",["Perché è gratis","Perché lì ci sono i tuoi contatti: il valore viene dalla rete","Perché è vietato","Perché è il migliore"],1,"Gli effetti di rete creano legami difficili da rompere."],["Quale servizio ha forti effetti di rete?",["Una calcolatrice","Un'app di messaggistica","Un libro","Una torcia"],1,"Più utenti la rendono più utile."]]},

{t:"Campionamento",d:2,
sp:"Spesso giudichiamo un insieme guardando solo una parte. Il campione però deve essere abbastanza grande e rappresentativo, altrimenti le conclusioni sono sbagliate. Se chiedi un parere solo agli amici, o giudichi una città da una sola strada, il tuo campione è distorto. Il modello ti chiede da dove vengono i dati che stai usando.",
ap:["Due errori sono comuni. Il primo è il campione troppo piccolo: tre esperienze negative con un marchio non dicono molto. Il secondo è il campione distorto: le recensioni online le scrive chi è molto contento o molto arrabbiato; le storie di successo che leggi sono quelle di chi ce l'ha fatta, non di chi ha fallito.","Prima di trarre conclusioni chiediti: quanti casi ho visto? Chi è rimasto fuori dal campione? Ci sono gruppi che non sentono la voce? Più è importante la decisione, più serve un campione ampio e vario."],
ri:[["Generalizzi da pochi casi","«Tutti quelli che conosco…»."],["Solo storie di successo","Senti parlare solo di chi ce l'ha fatta."],["Parere della tua cerchia","Chiedi solo a chi la pensa come te."]],
es:[["Lavoro","Chiedi un parere sul nuovo prodotto solo ai clienti più fedeli. Tutti entusiasti. Poi provi con chi non ha mai comprato: emergono dubbi utili."],["Soldi","Leggi di chi è diventato ricco lasciando il lavoro. Non leggi delle migliaia che hanno perso tutto: il campione è distorto."]],
ex:["Prima di una conclusione, chiediti quanti casi hai visto davvero. Sono abbastanza?","Chiedi un parere su una decisione a una persona molto diversa da te.","Trova una storia di successo e cerca di immaginare chi non è stato raccontato."],
q:["Quanti casi ho visto davvero?","Chi è rimasto fuori dal mio campione?","Il mio campione rappresenta l'insieme?"],
er:"Prendere poche esperienze personali come regola generale.",
qz:[["Le recensioni online sono spesso un campione distorto perché...",["Sono troppe","Le scrivono soprattutto i molto soddisfatti o i molto scontenti","Sono false","Sono recenti"],1,"Chi ha esperienze medie scrive meno."],["Un sondaggio fatto solo tra i propri amici è...",["Rappresentativo","Distorto","Perfetto","Inutile sempre"],1,"La cerchia di amici non rappresenta la popolazione."]]},

{t:"Casualità",d:2,
sp:"Molti risultati nella vita dipendono dal caso più di quanto ci piaccia ammettere. Tendiamo a vedere schemi e cause anche dove c'è solo fortuna o sfortuna. Il modello ti aiuta a non prenderti troppi meriti o colpe, a non vedere significati inesistenti e a prepararti all'imprevedibile.",
ap:["Il cervello cerca schemi: se lanci una moneta e esce testa cinque volte, pensi che ora debba uscire croce, ma la moneta non ha memoria. Un giocatore che segna tre partite di fila viene considerato «in forma», anche se spesso è solo variazione casuale.","Accettare la casualità non significa che nulla dipenda da te. Significa giudicare le decisioni nel lungo periodo, aumentare le occasioni in cui la fortuna può aiutarti (incontrare persone, provare cose nuove) e proteggerti dalla sfortuna con margini e riserve."],
ri:[["Vedi segni ovunque","Interpreti coincidenze come messaggi."],["Merito o colpa eccessivi","Ti attribuisci tutto il successo o il fallimento."],["Serie fortunate","Pensi che una serie continuerà per forza."]],
es:[["Soldi","Un amico guadagna per tre anni di fila con le azioni e si crede un genio. Al quarto anno perde tutto: la fortuna non era abilità."],["Te stesso","Un colloquio va male. Invece di concludere di non valere nulla, riconosci che il selezionatore aveva una giornata storta e ci riprovi."]],
ex:["Ripensa a un tuo successo e a un fallimento: quanta parte era caso?","Questa settimana aumenta le occasioni di fortuna: parla con una persona nuova o prova una cosa diversa.","Quando vedi uno schema, chiediti se potrebbe essere una coincidenza."],
q:["Quanta parte di questo risultato è dovuta al caso?","Sto vedendo uno schema dove c'è solo una coincidenza?","Come posso aumentare le occasioni di fortuna e proteggermi dalla sfortuna?"],
er:"Usare la casualità come scusa per non assumersi responsabilità.",
qz:[["Una moneta esce testa 6 volte. Qual è la probabilità di croce al lancio successivo?",["Molto alta","Sempre il 50%","Zero","Dipende dal giorno"],1,"La moneta non ha memoria."],["Come si giudica meglio una strategia?",["Da un singolo risultato","Da molti risultati nel lungo periodo","Dalla fortuna","Dalla sensazione"],1,"Nel lungo periodo il caso pesa meno."]]},

{t:"Principio di Pareto",d:1,
sp:"In molti insiemi il risultato è concentrato in una minoranza di cause: spesso circa il 20% delle cause produce circa l'80% degli effetti. Pochi clienti portano la maggior parte dei guadagni, pochi vestiti si indossano quasi sempre, poche attività producono gran parte dei risultati. Il modello ti aiuta a concentrarti sull'essenziale.",
ap:["L'economista Vilfredo Pareto notò che in Italia l'80% della terra apparteneva a circa il 20% della popolazione. Le proporzioni esatte variano, ma lo schema si ritrova ovunque: pochi difetti causano la maggior parte dei reclami, poche abitudini determinano gran parte della salute.","Per usarlo, cerca le poche cause che contano di più e mettici energia. Ugualmente, cerca le molte attività che producono poco e riducile. Ricorda però che 80/20 è un'approssimazione, non una legge precisa."],
ri:[["Sforzo distribuito ovunque","Tratti tutto come ugualmente importante."],["Pochi elementi dominanti","Alcuni clienti, oggetti o compiti contano molto più degli altri."],["Liste infinite","Tante cose da fare e poca chiarezza su quali contino."]],
es:[["Lavoro","Scopri che il 20% dei clienti genera l'80% delle telefonate di assistenza. Prepari per loro una guida dedicata."],["Casa","Indossi sempre gli stessi pochi vestiti. Regali quelli che non usi e liberi l'armadio."]],
ex:["Guarda la tua lista di cose da fare: quali due attività produrrebbero la maggior parte del risultato? Falle per prime.","Analizza una tua spesa mensile: quali poche voci pesano di più?","Elenca le persone con cui passi il tempo: quali poche ti danno più energia?"],
q:["Quale piccola parte produce la maggior parte del risultato?","Quali attività posso ridurre senza perdere molto?","Dove concentro i miei sforzi questa settimana?"],
er:"Prendere 80/20 come numeri esatti invece che come indicazione di concentrazione.",
qz:[["Cosa suggerisce il principio di Pareto per la tua lista di cose da fare?",["Fare tutto nell'ordine scritto","Individuare le poche attività che producono più risultato","Fare solo le più facili","Non fare nulla"],1,"Concentrarsi sulle cause principali."],["Il rapporto 80/20 è...",["Una legge precisa","Un'approssimazione che indica concentrazione","Sempre esatto","Valido solo in economia"],1,"Le proporzioni variano, la concentrazione resta."]]},

{t:"Regressione verso la media",d:2,
sp:"Dopo un risultato estremo, molto buono o molto cattivo, il successivo tende a essere più vicino alla normalità. Non perché qualcosa sia cambiato, ma perché gli estremi dipendono in parte dal caso. Il modello ti protegge dal dare meriti o colpe sbagliate a interventi che sembrano funzionare.",
ap:["Uno studente prende un voto altissimo: il compito dopo probabilmente andrà un po' peggio. Uno sportivo finisce in copertina dopo una stagione eccezionale: l'anno dopo rende meno. Non è una maledizione, è regressione verso la media.","Questo crea errori di giudizio. Un capo che rimprovera dopo una prestazione pessima vede miglioramenti e pensa che il rimprovero funzioni; che loda dopo una prestazione ottima vede un peggioramento e pensa che la lode faccia male. In realtà entrambi i risultati sarebbero tornati verso la media comunque."],
ri:[["Dopo un picco, un calo","Un risultato eccezionale non si ripete."],["Interventi che sembrano magici","Qualcosa «funziona» subito dopo un periodo pessimo."],["Giudizi da un singolo evento","Valuti qualcuno su una prestazione estrema."]],
es:[["Salute","Hai un mal di schiena fortissimo, provi un rimedio strano e migliori. Probabilmente saresti migliorato comunque: il dolore tende a tornare alla normalità."],["Lavoro","Un venditore ha un mese record e viene premiato. Il mese dopo cala. Il capo capisce che non serve allarmarsi: è tornato alla sua media."]],
ex:["Ripensa a una volta in cui un rimedio o una punizione «ha funzionato» dopo un momento pessimo. Potrebbe essere stata regressione?","Prima di giudicare qualcuno, guarda più risultati invece di uno solo.","Dopo un tuo risultato eccezionale, prepara aspettative realistiche per il successivo."],
q:["Questo risultato è estremo rispetto alla media?","Il miglioramento sarebbe avvenuto comunque?","Sto giudicando da un singolo risultato?"],
er:"Attribuire a un intervento il ritorno naturale alla normalità.",
qz:[["Un giocatore ha una partita disastrosa, poi una normale. Perché?",["L'allenatore l'ha sgridato","Gli estremi tendono a essere seguiti da risultati più normali","Ha cambiato scarpe","Caso impossibile"],1,"È regressione verso la media."],["Come evitare questo errore di giudizio?",["Guardare un solo risultato","Valutare molti risultati nel tempo","Fidarsi dell'intuito","Premiare sempre"],1,"Più dati riducono l'effetto degli estremi."]]},

{t:"Moltiplicare per zero",d:2,
sp:"In matematica qualunque numero moltiplicato per zero dà zero. In molti sistemi un solo elemento mancante annulla tutti gli altri: un ottimo prodotto con un pessimo servizio clienti, un grande talento senza affidabilità, una casa bellissima con il tetto che perde. Il modello ti chiede di trovare e correggere il tuo zero.",
ap:["Alcune qualità si sommano, altre si moltiplicano. Quando si moltiplicano, migliorare ciò che è già buono serve poco se c'è un elemento a zero. Un curriculum perfetto con un errore di ortografia nel nome dell'azienda; un'auto potentissima senza freni.","Per usarlo, elenca gli elementi indispensabili di ciò che fai e chiediti se uno di essi è a zero o quasi. Spesso il miglioramento più grande non viene dal potenziare i punti forti, ma dal correggere il punto debole che annulla tutto."],
ri:[["Tutto va bene tranne una cosa","Un difetto rovina il risultato complessivo."],["Sforzi che non rendono","Migliori molto ma il risultato non cambia."],["Fiducia persa","Un solo errore grave cancella anni di lavoro."]],
es:[["Lavoro","Un professionista bravissimo arriva sempre in ritardo alle riunioni. I clienti lo evitano: la puntualità è il suo zero."],["Relazioni","Sei generoso e divertente, ma non mantieni le promesse. Per gli amici questo annulla tutto il resto."]],
ex:["Elenca gli elementi indispensabili del tuo lavoro o di un progetto e dai a ciascuno un voto da 0 a 10. Qual è lo zero?","Chiedi a una persona di fiducia: c'è una cosa che rovina tutto il resto in quello che faccio?","Dedica questa settimana a portare il tuo punto più debole almeno a un livello accettabile."],
q:["C'è un elemento che annulla tutto il resto?","Sto migliorando i punti forti ignorando lo zero?","Quale difetto, se corretto, cambierebbe di più?"],
er:"Concentrarsi solo sui punti di forza ignorando l'elemento che annulla tutto.",
qz:[["Un ristorante ha cibo ottimo ma pessima igiene. Cosa conviene migliorare?",["Il menu","L'igiene","I prezzi","L'arredamento"],1,"L'igiene a zero annulla la qualità del cibo."],["Quando un elemento «moltiplica per zero»?",["Quando le qualità si sommano","Quando un elemento indispensabile manca e annulla gli altri","Mai","Quando si guadagna poco"],1,"Nei sistemi moltiplicativi un elemento nullo azzera tutto."]]},

{t:"Equivalenza",d:2,
sp:"Strade diverse possono portare allo stesso risultato. Due ricette diverse possono fare una torta ugualmente buona, due persone possono fare carriera in modi opposti. Il modello ti libera dall'idea che esista un solo modo giusto e ti aiuta a scegliere la strada più adatta a te, alle tue risorse e al tuo contesto.",
ap:["In matematica e in fisica forme diverse possono avere lo stesso valore: 2+2 e 3+1 danno entrambi 4. Nella vita puoi arrivare in forma correndo, nuotando o ballando; puoi risparmiare spendendo meno o guadagnando di più. Riconoscere le alternative equivalenti amplia le tue possibilità.","Usarlo significa chiedersi: qual è il risultato che voglio davvero? Quali strade diverse ci portano? Quale mi costa meno o mi piace di più? Attenzione però: le strade sono equivalenti nel risultato principale, ma possono differire per tempi, costi ed effetti collaterali."],
ri:[["Rigidità sul metodo","Pensi che si debba fare solo in un modo."],["Conflitti sul come","Due persone litigano sul metodo pur volendo la stessa cosa."],["Una strada bloccata","L'unico modo che conosci non è disponibile."]],
es:[["Salute","Odi la palestra. Ti accorgi che camminare un'ora al giorno con un amico ti dà benefici simili e la fai volentieri."],["Famiglia","Tu e il partner volete figli autonomi. Uno insegna con le regole, l'altro con l'esempio: entrambi gli approcci portano al risultato."]],
ex:["Scegli un obiettivo e scrivi cinque modi diversi per raggiungerlo. Scegli quello che ti costa meno fatica.","In una discussione sul metodo, chiarisci prima se siete d'accordo sul risultato.","Trova una regola che segui da sempre e chiediti se esiste un'alternativa equivalente più comoda."],
q:["Qual è il risultato che voglio davvero?","Quali altre strade portano allo stesso punto?","Quale strada si adatta meglio a me?"],
er:"Pensare che strade equivalenti nel risultato siano identiche anche nei costi e negli effetti.",
qz:[["Cosa suggerisce il modello se odi correre ma vuoi stare in forma?",["Correre comunque","Trovare un'altra attività che porti allo stesso risultato","Rinunciare","Allenarsi di più"],1,"Strade diverse possono portare allo stesso obiettivo."],["Due colleghi litigano sul metodo. Cosa chiarire prima?",["Chi è più bravo","Se condividono il risultato da ottenere","Chi ha più anzianità","Niente"],1,"Spesso si è d'accordo sul fine e non sul mezzo."]]},

{t:"Ordine di grandezza",d:2,
sp:"Prima di entrare nei dettagli, chiediti di che dimensione stai parlando: 10, 100, 1.000 o 1.000.000? Molti errori di giudizio nascono dal non distinguere ciò che è grande da ciò che è piccolo. Il modello ti aiuta a dare il giusto peso alle cose e a fare stime rapide per capire se un'idea ha senso.",
ap:["Risparmiare 2 euro sul caffè ogni giorno sono circa 700 euro l'anno; scegliere un'auto da 30.000 invece che da 20.000 sono 10.000 euro in un colpo. Spesso discutiamo a lungo di piccole cifre e decidiamo in fretta su quelle enormi. Stimare l'ordine di grandezza mette le cose in proporzione.","Una tecnica utile è la stima approssimativa: scomponi una quantità in pezzi che sai stimare e moltiplica. Non serve precisione, serve capire se il risultato è 10 o 10.000. Questo basta per scartare idee assurde o capire dove concentrarsi."],
ri:[["Discussioni su dettagli piccoli","Grande attenzione a cifre trascurabili."],["Numeri senza contesto","«Abbiamo speso 50.000 euro»: tanto o poco rispetto a cosa?"],["Decisioni grandi prese in fretta","Le scelte importanti ricevono poca attenzione."]],
es:[["Soldi","Passi un'ora a cercare uno sconto di 5 euro, ma non hai mai confrontato le offerte del mutuo, dove potresti risparmiare migliaia di euro."],["Lavoro","Il gruppo discute per un'ora il colore di un pulsante mentre il progetto rischia un ritardo di due mesi."]],
ex:["Elenca le tue spese annuali principali e mettile in ordine di grandezza. Dove conviene concentrarsi?","Fai una stima approssimativa: quante ore all'anno passi sul telefono? Scomponi e moltiplica.","Nella prossima discussione chiediti: di quale ordine di grandezza stiamo parlando?"],
q:["Stiamo parlando di 10, 100, 1.000 o di più?","Quanto pesa questa cosa rispetto al totale?","Sto dedicando attenzione in proporzione all'importanza?"],
er:"Perdere tempo sulla precisione quando basta sapere la dimensione.",
qz:[["Dove conviene cercare un risparmio prima?",["Sconto di 2 euro sulla spesa","Rinegoziare il mutuo o l'affitto","Coupon da 50 centesimi","Il caffè di oggi"],1,"L'ordine di grandezza è molto maggiore."],["A cosa serve una stima approssimativa?",["A essere precisi al centesimo","A capire la dimensione di un problema velocemente","A sostituire i dati","A nulla"],1,"Mostra se si parla di 10 o 10.000."]]},

{t:"Superficie esposta",d:2,
sp:"Più punti di contatto hai con il mondo, più cose ti possono succedere, nel bene e nel male. Una casa con molte finestre prende più luce ma anche più freddo; una persona con molti progetti ha più occasioni ma anche più rischi. Il modello ti aiuta a decidere dove aumentare l'esposizione e dove ridurla.",
ap:["In informatica la superficie d'attacco è l'insieme dei punti da cui un sistema può essere attaccato: più app, account e password hai, più rischi corri. Ma la stessa logica vale per le opportunità: più persone incontri, più idee condividi, più occasioni fortunate possono capitarti.","Per usarlo, riduci l'esposizione dove il rischio supera il beneficio (account inutili, spese ricorrenti dimenticate, impegni che non ti servono) e aumentala dove il beneficio supera il rischio (incontri, progetti piccoli, condivisione del tuo lavoro)."],
ri:[["Troppi impegni aperti","Ogni cosa può creare un problema."],["Pochi contatti con il mondo","Le opportunità non ti arrivano."],["Vulnerabilità nascoste","Account, abbonamenti o promesse dimenticate."]],
es:[["Sicurezza","Chiudi gli account online che non usi più. Meno account, meno rischi di furto di dati."],["Lavoro","Inizi a condividere ogni mese un piccolo lavoro online. Arrivano contatti che non avresti mai incontrato."]],
ex:["Fai una lista dei tuoi account, abbonamenti e impegni. Chiudine almeno tre inutili.","Aumenta l'esposizione positiva: questa settimana condividi un'idea o un lavoro con qualcuno di nuovo.","Individua un'area in cui sei troppo esposto a un rischio e riducila."],
q:["Quanti punti di contatto ho qui, e cosa possono portare?","Dove il rischio supera il beneficio?","Dove potrei espormi di più alle opportunità?"],
er:"Ridurre ogni esposizione per paura, perdendo anche le opportunità.",
qz:[["Quale azione riduce la superficie esposta ai rischi?",["Aprire nuovi account","Chiudere gli abbonamenti e gli account inutilizzati","Usare la stessa password ovunque","Condividere dati personali"],1,"Meno punti di contatto, meno vulnerabilità."],["Come aumentare l'esposizione alle opportunità?",["Restare a casa","Incontrare persone e condividere il proprio lavoro","Evitare rischi sempre","Nascondere le idee"],1,"Più contatti significa più occasioni."]]},

{t:"Massimi locali e globali",d:3,
sp:"Una scelta può essere la migliore tra quelle vicine e restare inferiore a una soluzione più lontana. Se ogni passo deve migliorare subito, quando arrivi in cima a una collina sei costretto a fermarti, anche se una montagna più alta è poco lontana. A volte, per raggiungere una cima più alta, serve accettare di scendere per un po'.",
ap:["Immagina un paesaggio con colline e montagne. Chi sale sempre verso l'alto arriva sulla cima più vicina: un massimo locale. Per raggiungere il massimo globale, la cima più alta, dovrebbe prima scendere a valle. Nella vita succede con lavori, metodi di lavoro, competenze: ottimizzi ciò che hai, ma non provi qualcosa di diverso che sarebbe migliore.","Per uscire da un massimo locale servono esplorazione e tolleranza a un peggioramento temporaneo: un cambio di carriera, imparare un metodo nuovo che all'inizio ti rallenta. Non sempre conviene: valuta quanto è più alta l'altra cima e quanto costa la discesa."],
ri:[["Piccoli miglioramenti che non bastano","Ottimizzi ma resti allo stesso livello."],["Paura di peggiorare","Non provi qualcosa di nuovo perché all'inizio andrebbe peggio."],["Comodità che blocca","Stai bene, ma sai che potresti stare meglio."]],
es:[["Lavoro","Scrivi veloce con due dita. Imparare a scrivere con dieci all'inizio ti rallenta per settimane, ma poi vai molto più veloce."],["Carriera","Sei il migliore nel tuo ufficio ma non cresci. Cambiare settore significa ricominciare, ma con prospettive molto più ampie."]],
ex:["Individua un'area in cui stai migliorando solo a piccoli passi. Esiste un approccio molto diverso da esplorare?","Scegli una cosa nuova che all'inizio ti farà andare peggio e provala per due settimane.","Per una decisione di cambiamento, stima quanto è più alta l'altra cima e quanto dura la discesa."],
q:["Sono sulla cima più alta o solo su questa collina?","Quanto dovrei scendere per arrivare più in alto?","Ne vale la pena, considerando il costo della discesa?"],
er:"Cambiare tutto continuamente inseguendo cime ipotetiche senza mai consolidare.",
qz:[["Perché alcune persone restano in un lavoro che non le soddisfa pienamente?",["Perché è il migliore possibile","Perché cambiare comporterebbe un peggioramento temporaneo","Per pigrizia","Per legge"],1,"Restano su un massimo locale per evitare la discesa."],["Cosa serve per raggiungere un massimo globale?",["Solo piccoli miglioramenti","Esplorare e accettare un peggioramento temporaneo","Fermarsi","Copiare gli altri"],1,"A volte bisogna scendere per salire più in alto."]]}
);

LIB.push(
{t:"Scarsità",d:1,
sp:"Una risorsa è scarsa quando gli usi desiderati superano la quantità disponibile nel momento che conta. Tempo, soldi, attenzione ed energia sono tutti scarsi. Il modello ti ricorda che ogni sì a qualcosa è un no a qualcos'altro, e ti aiuta a riconoscere quando la scarsità ti fa prendere decisioni peggiori.",
ap:["La scarsità obbliga a scegliere. Le ricerche mostrano anche che quando ci manca qualcosa (tempo, soldi) la mente si concentra solo su quello e prende decisioni miopi: chi è a corto di soldi accetta prestiti costosi, chi è a corto di tempo trascura le cose importanti ma non urgenti.","Per usarlo, riconosci le tue risorse scarse e decidi in anticipo come usarle. Crea piccole riserve per non trovarti sempre al limite. E fai attenzione a chi crea scarsità artificiale («solo per oggi», «ultimi pezzi») per spingerti a comprare."],
ri:[["Sempre al limite","Tempo o soldi non bastano mai."],["Decisioni affrettate","Scegli male perché sei sotto pressione."],["«Solo per oggi»","Offerte che giocano sulla paura di perdere l'occasione."]],
es:[["Tempo","Hai poche ore libere. Decidi in anticipo quali due cose fare nel weekend invece di disperderle."],["Acquisti","Un sito dice «solo 2 pezzi rimasti». Ti fermi e ti chiedi se lo compreresti anche senza quel messaggio."]],
ex:["Elenca le tue tre risorse più scarse (tempo, soldi, energia, attenzione) e decidi una priorità per ciascuna.","Crea una piccola riserva in una risorsa scarsa: 30 minuti liberi in agenda, 50 euro da parte.","Quando vedi «ultimi pezzi» o «scade oggi», aspetta 24 ore prima di comprare."],
q:["Cosa sto sacrificando dicendo sì a questo?","Sto decidendo male perché sono al limite?","Questa scarsità è reale o creata per spingermi?"],
er:"Credere che più risorse risolvano tutto: senza scelte chiare, anche l'abbondanza si esaurisce.",
qz:[["Cosa rende una risorsa scarsa?",["È costosa","Gli usi desiderati superano la quantità disponibile","È rara in natura","È di qualità"],1,"La scarsità è un rapporto tra bisogni e disponibilità."],["Un negozio scrive «ultimi 3 pezzi». Cosa suggerisce il modello?",["Comprare subito","Chiedersi se la scarsità è reale e se lo compreresti comunque","Ignorare il negozio","Comprarne due"],1,"La scarsità artificiale spinge a decisioni affrettate."]]},

{t:"Domanda e offerta",d:1,
sp:"Il prezzo di una cosa nasce dall'incontro tra quanto viene desiderata (domanda) e quanto ce n'è (offerta). Se tutti vogliono una cosa rara, il prezzo sale; se ce n'è tanta e pochi la vogliono, scende. Il modello spiega prezzi, stipendi, affitti e ti aiuta a capire dove il tuo valore può crescere.",
ap:["Gli ombrelli costano di più quando piove, gli alberghi in alta stagione, i biglietti per un concerto famoso. Anche il lavoro segue questa logica: competenze rare e richieste sono pagate di più, competenze comuni o poco richieste meno.","Per usarlo nella tua vita chiediti: ciò che offro è raro o comune? È molto richiesto? Puoi aumentare il tuo valore offrendo qualcosa di più raro o rivolgendoti dove la domanda è più alta. E per comprare meglio, scegli i momenti in cui la domanda è bassa."],
ri:[["Prezzi che cambiano","Lo stesso bene costa diverso in momenti diversi."],["Stipendi diversi","Lavori simili pagati molto diversamente."],["Code o scaffali vuoti","La domanda supera l'offerta."]],
es:[["Viaggi","Prenoti le vacanze a giugno invece che ad agosto: stessi posti, prezzi più bassi."],["Lavoro","Nel tuo settore mancano persone che sappiano analizzare dati. Fai un corso e il tuo valore sul mercato cresce."]],
