ex:["Scegli un acquisto che fai spesso e trova il momento in cui la domanda è più bassa.","Valuta la tua competenza principale: è rara o comune? Molto o poco richiesta?","Individua una competenza richiesta e scarsa nel tuo campo e fai il primo passo per impararla."],
q:["Quanto è richiesto e quanto è raro ciò che offro?","Quando la domanda è più bassa per ciò che voglio comprare?","Come posso rendere il mio contributo più raro?"],
er:"Pensare che il prezzo dica solo quanto una cosa vale, ignorando domanda e offerta del momento.",
qz:[["Perché gli alberghi costano di più ad agosto?",["Sono più belli","La domanda è più alta mentre le camere sono le stesse","Le tasse aumentano","Per caso"],1,"Più domanda con la stessa offerta alza il prezzo."],["Come aumentare il valore del proprio lavoro?",["Offrire ciò che fanno tutti","Sviluppare competenze rare e richieste","Lavorare gratis","Ridurre la qualità"],1,"Raro e richiesto significa più valore."]]},

{t:"Teoria dei giochi",d:3,
sp:"La teoria dei giochi studia le situazioni in cui il risultato delle tue scelte dipende anche dalle scelte degli altri. Ti invita a chiederti cosa farà l'altro, cosa sa, quali sono i suoi incentivi, e quale strategia funziona meglio considerando tutti. È utile in trattative, conflitti, collaborazioni e competizioni.",
ap:["Il famoso dilemma del prigioniero mostra che due persone che pensano solo al proprio interesse immediato possono finire peggio che se collaborassero. Ma quando il gioco si ripete nel tempo, la strategia più efficace è spesso semplice: collabora all'inizio, poi fai ciò che ha fatto l'altro l'ultima volta, e perdona ogni tanto.","Per usarlo, chiediti: il gioco si ripeterà? Cosa vuole l'altro? Cosa sa di me? Esistono soluzioni in cui vincono entrambi? Nelle relazioni stabili la reputazione vale più di un vantaggio immediato."],
ri:[["Decisioni interdipendenti","Ciò che conviene a te dipende da cosa fa l'altro."],["Trattative","Prezzi, stipendi, accordi."],["Rapporti ripetuti","Ti rivedrai con la stessa persona."]],
es:[["Lavoro","In una trattativa per lo stipendio ti chiedi cosa vuole davvero l'azienda e quali alternative ha. Proponi una soluzione che soddisfi entrambi."],["Relazioni","Tra vicini ci si rivedrà per anni. Fare un favore oggi vale più che vincere una piccola discussione."]],
ex:["In una prossima trattativa, scrivi prima cosa vuole l'altro e quali alternative ha.","Individua un rapporto ripetuto in cui stai cercando di vincere ogni scambio. Cosa cambierebbe collaborando?","Pensa a una situazione in cui tutti si comportano male perché nessuno vuole essere il primo a cambiare. Cosa potrebbe sbloccarla?"],
q:["Cosa farà l'altro, considerando i suoi interessi?","Il gioco si ripeterà nel tempo?","Esiste una soluzione in cui vincono entrambi?"],
er:"Vedere ogni interazione come un gioco in cui uno vince e l'altro perde.",
qz:[["In un rapporto che si ripete nel tempo, quale strategia funziona spesso meglio?",["Ingannare sempre","Collaborare all'inizio e rispondere come ha fatto l'altro","Non collaborare mai","Agire a caso"],1,"La reciprocità costruisce fiducia nei giochi ripetuti."],["Cosa studia la teoria dei giochi?",["I giochi da tavolo","Le situazioni in cui il risultato dipende anche dalle scelte degli altri","La fortuna","Lo sport"],1,"Analizza le decisioni interdipendenti."]]},

{t:"Ottimizzazione",d:2,
sp:"Ottimizzare significa cercare la soluzione migliore dati un obiettivo e dei vincoli precisi. Il punto chiave è chiarire cosa vuoi ottimizzare: tempo, costo, qualità, piacere? Ottimizzare per una cosa spesso peggiora le altre. Il modello ti aiuta a scegliere consapevolmente cosa massimizzare.",
ap:["Il percorso più breve non è sempre il più veloce, il più economico non è sempre il più conveniente. Se ottimizzi una giornata solo per la produttività, togli spazio a riposo e relazioni. Un'azienda che ottimizza solo i costi può perdere qualità e clienti.","Per usarlo, scrivi l'obiettivo e i vincoli in modo esplicito. Poi chiediti cosa stai sacrificando. Spesso conviene «abbastanza buono» su molte dimensioni piuttosto che «perfetto» su una sola."],
ri:[["Obiettivo non chiaro","Non sai cosa stai cercando di migliorare."],["Un aspetto migliora, altri peggiorano","Hai risparmiato ma la qualità è crollata."],["Ricerca del perfetto","Analizzi senza fine ogni opzione."]],
es:[["Viaggi","Cerchi il volo più economico con due scali e 20 ore di viaggio. Ti accorgi che il tuo vero obiettivo era riposarti."],["Lavoro","Il gruppo ottimizza il numero di pratiche chiuse e trascura la soddisfazione dei clienti. Si aggiunge un secondo indicatore."]],
ex:["Per una decisione in corso, scrivi l'obiettivo principale e i vincoli. Cosa stai davvero massimizzando?","Scegli un'area della tua vita troppo ottimizzata e reintroduci uno spazio di libertà.","Davanti a molte opzioni, fissa un criterio di «abbastanza buono» e scegli la prima che lo soddisfa."],
q:["Cosa sto cercando di ottimizzare davvero?","Quali vincoli devo rispettare?","Cosa peggiora mentre ottimizzo questo?"],
er:"Ottimizzare con precisione la cosa sbagliata.",
qz:[["Cosa serve prima di ottimizzare?",["Un computer","Chiarire obiettivo e vincoli","Molti soldi","Un esperto"],1,"Senza obiettivo chiaro non si può ottimizzare."],["Scegli sempre il prodotto più economico e poi lo ricompri spesso. Cosa è successo?",["Hai risparmiato","Hai ottimizzato il prezzo e peggiorato la durata","Hai fatto bene","Nulla"],1,"Ottimizzare un aspetto può peggiorare gli altri."]]},

{t:"Compromessi",d:1,
sp:"Ogni scelta comporta una rinuncia: il tempo speso in una cosa non lo spendi in un'altra, i soldi usati per un acquisto non sono disponibili per un altro. Gli economisti lo chiamano costo opportunità. Il modello ti chiede di guardare non solo cosa ottieni, ma anche cosa lasci.",
ap:["Un lavoro meglio pagato può significare meno tempo con la famiglia; una casa più grande può significare più ore nel traffico. Non esiste la scelta senza costi: esiste la scelta di cui conosci i costi. Spesso le persone soffrono non per le rinunce, ma per non averle viste in anticipo.","Per usarlo, davanti a una scelta chiediti: qual è la migliore alternativa a cui rinuncio? Scrivi esplicitamente cosa guadagni e cosa perdi. Così puoi scegliere con serenità e senza rimpianti inutili."],
ri:[["«Voglio tutto»","Pensi di poter avere tutte le opzioni insieme."],["Rimpianti","Dopo una scelta ti accorgi di cosa hai perso."],["Costi invisibili","Il prezzo vero non è solo quello in euro."]],
es:[["Casa","Una casa in periferia costa meno, ma comporta due ore al giorno di viaggio. Calcoli il valore di quelle ore prima di decidere."],["Te stesso","Accetti ogni invito per non deludere nessuno. Il compromesso nascosto è non avere mai tempo per te."]],
ex:["Per una decisione aperta, scrivi due colonne: cosa ottengo e a cosa rinuncio.","Calcola il costo in ore di lavoro di un acquisto che desideri.","Ripensa a una scelta passata: quale compromesso non avevi visto?"],
q:["A cosa rinuncio scegliendo questo?","Qual è la migliore alternativa che lascio?","Accetto consapevolmente questo compromesso?"],
er:"Cercare l'opzione perfetta senza rinunce, che non esiste.",
qz:[["Cos'è il costo opportunità?",["Il prezzo pagato","Il valore della migliore alternativa a cui rinunci","Una tassa","Uno sconto"],1,"È ciò che lasci scegliendo un'opzione."],["Passi la serata a guardare serie TV. Qual è il compromesso?",["Nessuno","Il tempo che avresti potuto usare per altro","Il costo dell'abbonamento solo","La corrente"],1,"Ogni uso del tempo esclude altri usi."]]},

{t:"Specializzazione",d:2,
sp:"Dividere il lavoro può aumentare la produzione quando ogni persona dedica tempo al compito per cui sacrifica meno. Non serve essere il migliore in assoluto: conta il vantaggio comparato, cioè ciò che fai rinunciando a meno. Il modello ti aiuta a dividere i compiti e a capire quando conviene affidare qualcosa agli altri.",
ap:["Adam Smith descrisse una fabbrica di spilli dove dividendo le operazioni tra operai la produzione cresceva enormemente. David Ricardo aggiunse un'idea sorprendente: anche se tu sei più bravo dell'altro in tutto, conviene comunque dividersi i compiti secondo chi ha il costo opportunità più basso.","Nella vita quotidiana significa: concentrati su ciò in cui rendi di più e affida il resto, quando possibile. Ma attenzione: specializzarsi troppo ti rende fragile se l'ambiente cambia e ti fa perdere la visione d'insieme."],
ri:[["Fai tutto da solo","Non deleghi nemmeno ciò che altri fanno meglio o a minor costo."],["Compiti mal distribuiti","In un gruppo tutti fanno un po' di tutto."],["Troppa specializzazione","Sai fare una cosa sola e temi i cambiamenti."]],
es:[["Famiglia","Uno cucina bene e odia stirare, l'altro il contrario. Dividendo i compiti la casa funziona meglio e entrambi sono più contenti."],["Lavoro","Un avvocato scrive meglio della sua segretaria, ma conviene comunque che deleghi la scrittura delle lettere e si concentri sui casi."]],
ex:["Elenca i compiti di casa o di lavoro e chi li fa. Ridividili in base al vantaggio comparato.","Individua un compito che fai per abitudine ma che qualcuno farebbe con meno sforzo. Delegalo.","Scegli una competenza fuori dalla tua specialità da mantenere viva, per non diventare fragile."],
q:["In cosa sacrifico meno facendolo io?","Cosa potrei affidare a qualcun altro?","Mi sto specializzando troppo?"],
er:"Pensare che debba fare un compito solo chi è il migliore in assoluto.",
qz:[["Cosa indica il vantaggio comparato?",["Chi è il migliore in assoluto","Chi rinuncia a meno facendo un compito","Chi lavora più ore","Chi guadagna di più"],1,"Conta il costo opportunità, non l'abilità assoluta."],["Qual è un rischio della specializzazione eccessiva?",["Troppa efficienza","Diventare fragili se l'ambiente cambia","Guadagnare troppo","Nessuno"],1,"Una sola competenza espone ai cambiamenti."]]},

{t:"Interdipendenza",d:2,
sp:"Quando le parti di un sistema dipendono le une dalle altre, un problema in un punto si propaga. Una fabbrica si ferma se manca un solo componente, una famiglia va in crisi se si ammala chi tiene tutto insieme. Il modello ti aiuta a vedere i collegamenti nascosti e a prepararti ai guasti.",
ap:["L'interdipendenza rende i sistemi efficienti: ognuno fa la sua parte e scambia con gli altri. Ma li rende anche fragili. Durante la pandemia molte fabbriche si sono fermate perché un singolo fornitore lontano non consegnava più. Più le catene sono strette e senza scorte, più il rischio cresce.","Per usarlo, chiediti da cosa e da chi dipendi in modo critico. Hai un'alternativa se quel punto si blocca? Crea piccole ridondanze nelle dipendenze più importanti: un secondo fornitore, una persona che sa fare il tuo lavoro, una scorta."],
ri:[["Un solo punto di riferimento","Tutto dipende da una persona o un fornitore."],["Effetti domino","Un problema piccolo blocca tutto."],["Nessuna alternativa","Se qualcosa manca, non sai come fare."]],
es:[["Lavoro","Solo una collega sa usare il sistema delle buste paga. Quando si ammala, gli stipendi rischiano di ritardare. Si forma una seconda persona."],["Casa","Tutti i ricordi di famiglia sono su un solo telefono. Fai una copia su un altro dispositivo."]],
ex:["Elenca tre dipendenze critiche nella tua vita (persone, servizi, strumenti) e un'alternativa per ciascuna.","Insegna a qualcuno una cosa che solo tu sai fare.","Fai una copia di sicurezza dei tuoi documenti o foto importanti."],
q:["Da cosa dipendo in modo critico?","Cosa succede se questo punto si blocca?","Quale piccola alternativa posso preparare?"],
er:"Puntare tutto sull'efficienza eliminando ogni alternativa.",
qz:[["Perché un'azienda con un solo fornitore è fragile?",["Paga di più","Se il fornitore si blocca, si ferma tutto","È più efficiente","Non è fragile"],1,"La dipendenza da un solo punto propaga i problemi."],["Come ridurre il rischio dell'interdipendenza?",["Eliminare ogni collegamento","Creare alternative nelle dipendenze critiche","Ignorarlo","Dipendere da una sola persona"],1,"Le ridondanze limitano gli effetti a catena."]]},

{t:"Efficienza",d:2,
sp:"Essere efficienti significa ottenere di più con meno risorse. È un valore importante, ma ha un costo nascosto: eliminare gli sprechi spesso elimina anche le riserve. Un sistema senza margini funziona benissimo finché tutto va bene e crolla al primo imprevisto. Il modello ti aiuta a bilanciare efficienza e resilienza.",
ap:["Un'agenda piena al minuto, magazzini con zero scorte, una sola persona per ogni ruolo: sono soluzioni molto efficienti. Ma quando arriva un ritardo, un guasto o una malattia, non c'è spazio per assorbirli. L'efficienza massima rende fragili.","Conviene essere efficienti nelle attività ripetitive e prevedibili, e lasciare margini dove l'incertezza è alta. Chiediti anche efficienti rispetto a cosa: una riunione breve è efficiente nel tempo, ma non se nessuno capisce cosa fare."],
ri:[["Agenda senza buchi","Ogni imprevisto crea un effetto domino."],["Nessuna scorta","Ti manca sempre qualcosa al momento sbagliato."],["Efficienza che peggiora la qualità","Risparmi tempo ma devi rifare il lavoro."]],
es:[["Tempo","Lasci 30 minuti liberi tra un impegno e l'altro. Sei meno «efficiente», ma non arrivi più in ritardo a catena."],["Casa","Tieni in dispensa una scorta di base. Quando non riesci a fare la spesa, la cena c'è comunque."]],
ex:["Guarda la tua agenda della prossima settimana e aggiungi almeno due spazi vuoti.","Rendi più efficiente un'attività ripetitiva e prevedibile (es. la spesa con una lista fissa).","Individua un'area dove l'efficienza ti ha tolto ogni riserva e crea un piccolo margine."],
q:["Efficiente rispetto a cosa?","Ho tolto anche le riserve insieme agli sprechi?","Cosa succede se arriva un imprevisto?"],
er:"Considerare ogni margine uno spreco da eliminare.",
qz:[["Qual è il rischio di un'agenda pianificata al minuto?",["Troppo tempo libero","Un solo ritardo crea problemi a catena","Più relax","Nessuno"],1,"Manca il margine per assorbire gli imprevisti."],["Dove conviene puntare sull'efficienza?",["Ovunque","Nelle attività ripetitive e prevedibili","Solo nelle emergenze","Mai"],1,"Lì l'incertezza è bassa e i margini servono meno."]]},

{t:"Debito",d:2,
sp:"Il debito ti permette di avere qualcosa oggi pagandolo domani, di solito con un costo in più. Esiste anche fuori dal denaro: il debito di sonno, il debito tecnico nel lavoro, le promesse non mantenute. Il modello ti aiuta a capire quando un debito è utile e quando ti sta rubando il futuro.",
ap:["Un mutuo per una casa può essere un buon debito: ti dà un bene utile per molti anni. Un prestito per una vacanza o un acquisto impulsivo spesso no. La domanda chiave è: ciò che ottengo vale più del costo totale, interessi compresi? E posso sostenere i pagamenti anche se le cose vanno peggio?","I debiti non finanziari funzionano allo stesso modo. Rimandare un lavoro fatto bene crea debito tecnico che si paga dopo con più fatica. Dormire poco crea debito di sonno che si paga con stanchezza ed errori. Anche questi accumulano interessi."],
ri:[["Rate che si accumulano","Paghi molti piccoli finanziamenti."],["Soluzioni provvisorie","«Per ora facciamo così, poi sistemiamo»."],["Stanchezza cronica","Il sonno perso non viene mai recuperato."]],
es:[["Soldi","Vuoi un telefono nuovo a rate. Calcoli il costo totale con gli interessi e decidi di risparmiare tre mesi per comprarlo in contanti."],["Lavoro","Il gruppo rimanda sempre l'ordine nei file. Dopo un anno trovare un documento richiede ore. Dedicate un giorno a «pagare il debito»."]],
ex:["Elenca tutti i tuoi debiti finanziari con il costo totale. Quale conviene estinguere per primo?","Individua un debito non finanziario (sonno, promesse, lavori rimandati) e paga una prima rata questa settimana.","Prima di un acquisto a rate, calcola quanto paghi in totale."],
q:["Quanto mi costa questo in totale, interessi compresi?","Ciò che ottengo vale più del costo?","Quali debiti invisibili sto accumulando?"],
er:"Considerare ogni debito negativo: alcuni, ben scelti, permettono investimenti utili.",
qz:[["Quale è più probabilmente un buon debito?",["Un prestito per una vacanza","Un mutuo sostenibile per una casa in cui vivrai","Rate per un telefono di lusso","Carta di credito per spese quotidiane"],1,"Ti dà un bene utile a lungo con costi sostenibili."],["Cos'è il debito di sonno?",["Un tipo di prestito","Il sonno perso che si accumula e si paga con stanchezza","Dormire troppo","Un sogno"],1,"Anche i debiti non finanziari accumulano costi."]]},

{t:"Monopolio e concorrenza",d:2,
sp:"Quando c'è un solo fornitore (monopolio), può alzare i prezzi e ridurre la qualità senza perdere clienti. Quando ci sono molti concorrenti, ognuno deve migliorare per non perderli. Il modello ti aiuta a riconoscere quanto potere hai come cliente, come lavoratore e come venditore.",
ap:["I monopoli nascono da leggi, risorse uniche, effetti di rete o semplicemente dall'essere arrivati primi. Per chi li ha sono molto redditizi; per chi compra sono spesso cari e poco attenti. La concorrenza invece abbassa i prezzi e spinge all'innovazione, ma riduce i guadagni di chi vende.","Nella tua vita: se dipendi da un solo fornitore, da un solo cliente o da un solo datore di lavoro, l'altro ha potere su di te. Avere alternative aumenta la tua forza. Se vendi qualcosa, cercare un piccolo monopolio (qualcosa che solo tu offri) ti protegge dalla guerra dei prezzi."],
ri:[["Nessuna alternativa","Devi accettare le condizioni imposte."],["Guerra dei prezzi","Tutti offrono la stessa cosa e abbassano i prezzi."],["Qualità che cala","Un servizio peggiora senza conseguenze."]],
es:[["Lavoro","Un freelance ha un solo cliente che gli impone tariffe basse. Cercando altri due clienti, può negoziare meglio."],["Acquisti","Il tuo operatore telefonico aumenta i prezzi. Confronti le offerte e scopri che cambiare è facile."]],
ex:["Elenca dove dipendi da un solo fornitore, cliente o datore di lavoro. Crea almeno un'alternativa.","Se vendi qualcosa, scrivi cosa offri che nessun altro offre.","Controlla un servizio che paghi da anni e confronta le alternative sul mercato."],
q:["Ho alternative, o l'altro ha tutto il potere?","Cosa offro che nessun altro offre?","Sto subendo un monopolio senza saperlo?"],
er:"Pensare che la concorrenza sia sempre un male per chi vende: spinge a migliorare.",
qz:[["Perché un monopolista può alzare i prezzi?",["Per legge","Perché i clienti non hanno alternative","Perché è più bravo","Per caso"],1,"Senza alternative, i clienti restano comunque."],["Come aumentare il potere contrattuale di un lavoratore autonomo?",["Avere un solo cliente","Avere più clienti e un'offerta unica","Abbassare i prezzi","Lavorare di più"],1,"Le alternative riducono la dipendenza."]]},

{t:"Esternalità",d:2,
sp:"Un'esternalità è un effetto di una scelta che ricade su qualcun altro, senza che venga pagato o compensato. Può essere negativa, come l'inquinamento o il rumore del vicino, o positiva, come i fiori di un giardino che tutti possono vedere. Il modello ti invita a considerare chi altro è toccato dalle tue scelte.",
ap:["Chi guida in centro non paga il costo del traffico e dello smog che produce per gli altri; chi si vaccina protegge anche chi non può farlo. Le esternalità spiegano molte tensioni sociali: quando i costi ricadono su altri, tendiamo a produrne troppi; quando i benefici vanno ad altri, ne produciamo troppo pochi.","Nella vita quotidiana chiediti: chi paga gli effetti di questa scelta, oltre a me? Al lavoro, una mail inviata a tutti costa pochi secondi a te e minuti a cento persone. Ridurre le esternalità negative e aumentare quelle positive migliora la vita di chi ti circonda."],
ri:[["Costi scaricati sugli altri","Tu risparmi, qualcun altro paga."],["Benefici condivisi","Una tua azione aiuta anche chi non ha contribuito."],["Fastidi senza responsabili","Rumore, disordine, sprechi comuni."]],
es:[["Lavoro","Invii una mail a tutto l'ufficio per una domanda che riguarda due persone. Fai perdere tempo a decine di colleghi."],["Casa","Pianti fiori sul balcone: i passanti li vedono e il quartiere è più bello. Esternalità positiva."]],
ex:["Ripensa alla tua giornata: quale tua azione ha creato un costo per qualcun altro?","Questa settimana fai un'azione con un'esternalità positiva (pulire uno spazio comune, condividere una risorsa).","Al lavoro, riduci un'esternalità negativa: meno destinatari nelle mail, riunioni più brevi."],
q:["Chi altro è toccato da questa scelta?","Sto scaricando un costo su qualcuno?","Come posso creare un beneficio anche per altri?"],
er:"Considerare solo costi e benefici personali.",
qz:[["Quale è un'esternalità negativa?",["Un vicino che suona musica alta di notte","Un giardino fiorito","Un regalo","Un prezzo basso"],0,"Il costo del rumore ricade su altri."],["Perché tendiamo a produrre troppe esternalità negative?",["Per cattiveria","Perché i costi ricadono su altri e non su di noi","Per legge","Per caso"],1,"Chi decide non paga l'intero costo."]]},

{t:"Distruzione creatrice",d:3,
sp:"L'economista Joseph Schumpeter descrisse così il modo in cui le economie si rinnovano: il nuovo nasce distruggendo il vecchio. Le auto hanno sostituito le carrozze, lo streaming ha sostituito i negozi di dischi. Il modello ti aiuta ad accettare che alcune cose finiscono e a vedere le opportunità che nascono dalle loro ceneri.",
ap:["Ogni innovazione importante crea vincitori e perdenti: nuovi lavori e aziende crescono, mentre altri scompaiono. Nel complesso l'economia diventa più produttiva, ma chi perde il lavoro vive un passaggio difficile. Non si può avere il nuovo senza lasciare andare qualcosa del vecchio.","Nella vita personale succede lo stesso: lasciare un'abitudine, un lavoro o un modo di pensare fa spazio a qualcosa di nuovo. Il modello invita a chiedersi cosa sta finendo nel tuo mondo e cosa sta nascendo, e a prepararsi prima di essere travolti."],
ri:[["Settori in declino","Il tuo lavoro sembra meno richiesto di anno in anno."],["Nuovi strumenti che sostituiscono","Una tecnologia fa ciò che prima faceva una persona."],["Resistenza al cambiamento","Ti aggrappi a un modo di fare che non funziona più."]],
es:[["Lavoro","Un'agenzia di viaggi tradizionale perde clienti per i siti online. Si reinventa organizzando viaggi su misura che online non si trovano."],["Te stesso","Smetti di fare un hobby che non ti diverte più. Quel tempo libero ti permette di scoprirne uno nuovo."]],
ex:["Scrivi una cosa nella tua vita o nel tuo lavoro che sta finendo e una opportunità che potrebbe nascere al suo posto.","Lascia andare un'abitudine o un impegno che non ti serve più, per fare spazio.","Informati su una tecnologia o un cambiamento che potrebbe trasformare il tuo settore."],
q:["Cosa sta finendo intorno a me?","Cosa potrebbe nascere al suo posto?","A cosa mi sto aggrappando per paura del nuovo?"],
er:"Ignorare il costo umano del cambiamento, oppure combattere un cambiamento inevitabile.",
qz:[["Cosa descrive la distruzione creatrice?",["Le guerre","Il nuovo che nasce sostituendo il vecchio","Il fallimento di un'azienda e basta","La crisi permanente"],1,"Il rinnovamento passa dalla fine di qualcosa."],["Quale esempio rappresenta la distruzione creatrice?",["Un negozio che chiude per ferie","Le fotocamere digitali che sostituiscono le pellicole","Un aumento dei prezzi","Un nuovo prodotto identico al vecchio"],1,"Una tecnologia nuova ha reso obsoleta quella vecchia."]]},

{t:"Legge di Gresham",d:3,
sp:"La legge di Gresham dice che «la moneta cattiva scaccia quella buona»: quando due monete hanno lo stesso valore ufficiale ma una contiene meno metallo prezioso, le persone spendono quella cattiva e conservano quella buona. Più in generale, se non c'è controllo, ciò che vale meno tende a prevalere su ciò che vale di più.",
ap:["Lo stesso succede altrove: in un'azienda dove chi lavora poco viene pagato come chi lavora molto, i migliori se ne vanno. In un mercato dove le informazioni false si diffondono più velocemente di quelle vere, la qualità media cala. In un gruppo dove si tollerano comportamenti scorretti, le persone corrette si allontanano.","Il modello suggerisce di proteggere la qualità con regole, controlli e riconoscimenti. Se il buono e il cattivo vengono trattati allo stesso modo, il buono tende a sparire."],
ri:[["Bravi che se ne vanno","Le persone migliori lasciano il gruppo."],["Qualità media in calo","Prodotti o contenuti peggiorano nel tempo."],["Nessuna distinzione","Il lavoro buono e quello scadente ricevono lo stesso trattamento."]],
es:[["Lavoro","In un ufficio nessuno riconosce chi lavora con cura. I più bravi cambiano azienda e restano i meno motivati."],["Informazione","In un gruppo di chat girano notizie non verificate. Chi condivide fonti serie smette di scrivere. Il gruppo introduce la regola di citare la fonte."]],
ex:["Individua un gruppo dove buono e cattivo sono trattati allo stesso modo. Cosa potrebbe proteggere la qualità?","Questa settimana riconosci esplicitamente il lavoro ben fatto di qualcuno.","Nelle tue fonti di informazione, elimina una fonte scadente e aggiungine una di qualità."],
q:["Il buono e il cattivo vengono trattati allo stesso modo qui?","Chi se ne sta andando e perché?","Quale regola o riconoscimento proteggerebbe la qualità?"],
er:"Pensare che la qualità si difenda da sola.",
qz:[["Cosa dice la legge di Gresham?",["Il buono vince sempre","Senza controlli, ciò che vale meno tende a scacciare ciò che vale di più","Le monete hanno tutte lo stesso valore","Il prezzo riflette sempre la qualità"],1,"Le persone si liberano del peggio e conservano il meglio."],["In un'azienda tutti sono pagati uguale indipendentemente dal lavoro. Cosa rischia?",["Più impegno","I migliori se ne vanno","Più qualità","Nulla"],1,"Il buono, non riconosciuto, si allontana."]]},

{t:"Bolle speculative",d:3,
sp:"Una bolla nasce quando il prezzo di qualcosa sale non perché valga di più, ma perché tutti credono che salirà ancora. Le persone comprano per rivendere più cari, il prezzo sale, altri entrano attratti dai guadagni. Finché a un certo punto i compratori finiscono e la bolla scoppia. Il modello ti aiuta a riconoscere l'euforia collettiva.",
ap:["Dalla mania dei tulipani in Olanda nel Seicento alle bolle immobiliari e tecnologiche, lo schema si ripete: un'idea promettente, prezzi in salita, storie di guadagni facili, sempre più persone che entrano senza capire, e infine il crollo. Chi entra per ultimo di solito perde di più.","Segnali di allarme: tutti ne parlano, anche chi non ne sa nulla; si dice che «stavolta è diverso»; il prezzo è lontanissimo da qualsiasi valore concreto; si compra con soldi presi in prestito. Il modello non dice quando la bolla scoppierà, solo di proteggerti."],
ri:[["Tutti ne parlano","Amici e parenti consigliano lo stesso investimento."],["«Stavolta è diverso»","Le regole normali sembrano non valere più."],["Prezzo staccato dal valore","Si compra solo per rivendere."]],
es:[["Soldi","Un tuo collega ti racconta i guadagni con una moneta digitale. Ti chiedi: so spiegare da dove viene il valore? Investi solo una piccola cifra che puoi perdere."],["Te stesso","Una moda costosa esplode tra gli amici. Aspetti qualche mese prima di seguirla e ti accorgi che è già passata."]],
ex:["Pensa a qualcosa di cui oggi tutti parlano come investimento. Elenca i segnali di bolla che vedi.","Scrivi una regola personale: quanta parte dei tuoi risparmi puoi mettere in investimenti speculativi.","Ripensa a una moda passata che sembrava inarrestabile. Cosa è successo dopo?"],
q:["Compro perché vale o perché penso che salirà?","Saprei spiegare da dove viene il valore?","Posso permettermi di perdere questa somma?"],
er:"Pensare di poter uscire sempre in tempo prima dello scoppio.",
qz:[["Qual è un segnale di bolla speculativa?",["Prezzi stabili","Tutti comprano perché pensano che il prezzo salirà ancora","Un prodotto utile","Prezzi in calo"],1,"L'acquisto si basa sull'aspettativa, non sul valore."],["Chi perde di più quando una bolla scoppia?",["Chi è entrato per primo","Chi è entrato per ultimo, spesso a debito","Nessuno","Chi non ha investito"],1,"Compra al prezzo più alto poco prima del crollo."]]}
);

LIB.push(
{t:"Pubblico",d:1,
sp:"Un messaggio funziona solo se è pensato per chi lo riceve. La stessa idea va spiegata in modo diverso a un bambino, a un collega esperto o a un cliente. Il modello ti chiede di partire da chi ascolta: cosa sa già, cosa gli interessa, cosa teme, quanto tempo ha.",
ap:["Spesso comunichiamo pensando a ciò che vogliamo dire noi, non a ciò che l'altro ha bisogno di sentire. Il risultato sono spiegazioni troppo tecniche, troppo lunghe o che rispondono a domande che nessuno ha fatto. Chi ascolta è il giudice finale del messaggio.","Prima di parlare o scrivere chiediti: chi è il mio pubblico? Cosa sa già? Cosa vuole ottenere? Quale parola, esempio o formato funzionerà per lui? Adattarsi al pubblico non significa cambiare la verità, ma il modo di raccontarla."],
ri:[["Sguardi persi","Le persone smettono di seguirti."],["Domande che mostrano incomprensione","Rispondono a qualcosa che non hai detto."],["Messaggio uguale per tutti","Usi lo stesso discorso con persone molto diverse."]],
es:[["Lavoro","Devi presentare un progetto al direttore. Invece di dieci slide tecniche, prepari una pagina con costi, benefici e una decisione da prendere."],["Famiglia","Spieghi a tua nonna come usare il telefono con un foglio scritto a mano e passaggi grandi, invece di parole tecniche."]],
ex:["Prima del tuo prossimo messaggio importante, scrivi in una riga chi lo riceve e cosa vuole sapere.","Spiega la stessa cosa (il tuo lavoro) in due modi: a un bambino e a un esperto.","Chiedi a qualcuno dopo una tua spiegazione: «Cosa hai capito?»"],
q:["Chi riceverà questo messaggio?","Cosa sa già e cosa gli serve sapere?","Quale esempio o formato funziona meglio per lui?"],
er:"Adattarsi così tanto al pubblico da dire solo ciò che vuole sentirsi dire.",
qz:[["Devi spiegare un problema tecnico al tuo capo, che ha poco tempo. Cosa fai?",["Tutti i dettagli tecnici","Una sintesi con impatto e decisione richiesta","Un documento di 20 pagine","Niente"],1,"Il messaggio va adattato ai bisogni di chi ascolta."],["Chi giudica se un messaggio funziona?",["Chi lo scrive","Chi lo riceve","Un esperto","Nessuno"],1,"Conta ciò che l'altro capisce."]]},

{t:"Genere",d:2,
sp:"Ogni forma di comunicazione ha un genere con le sue convenzioni: una fiaba inizia con «C'era una volta», una mail formale con un saluto preciso, un giallo ha un mistero da risolvere. Il pubblico si aspetta quelle regole. Il modello ti aiuta a usarle per farti capire subito o a romperle in modo consapevole per sorprendere.",
ap:["Le convenzioni di genere sono scorciatoie: dicono al pubblico cosa aspettarsi e come leggere ciò che segue. Un curriculum segue un formato, un discorso di matrimonio ha toni e tempi prevedibili, una barzelletta ha un ritmo e una battuta finale. Ignorarle senza motivo crea confusione.","Le opere più memorabili spesso conoscono bene il genere e lo rompono in un punto preciso. Prima di innovare, impara le regole; poi chiediti quale aspettativa vuoi rispettare e quale vuoi sorprendere."],
ri:[["Confusione nel pubblico","Le persone non capiscono che tipo di messaggio è."],["Tono sbagliato","Un messaggio informale in un contesto formale, o viceversa."],["Contenuto prevedibile","Segui le regole così bene che nessuno se ne ricorda."]],
es:[["Lavoro","Scrivi una richiesta a un ufficio pubblico con il tono di una chat. Non ti rispondono. La riscrivi con oggetto chiaro e formato formale."],["Creatività","Un video di auguri segue il formato classico ma ha un finale a sorpresa: tutti lo ricordano."]],
ex:["Scegli un tipo di messaggio che scrivi spesso e scrivi le sue tre convenzioni principali.","Riscrivi una tua mail o post seguendo meglio le regole del suo genere.","Prova a rompere una sola convenzione in modo consapevole in un messaggio informale."],
q:["Che genere di messaggio è questo?","Cosa si aspetta il pubblico da questo genere?","Quale regola rispetto e quale rompo, e perché?"],
er:"Rompere le convenzioni senza conoscerle, creando solo confusione.",
qz:[["Perché le convenzioni di genere sono utili?",["Limitano la creatività","Dicono al pubblico cosa aspettarsi","Sono obbligatorie per legge","Non sono utili"],1,"Sono scorciatoie per la comprensione."],["Quando conviene rompere una convenzione?",["Sempre","In modo consapevole, per sorprendere dopo averla capita","Mai","A caso"],1,"La rottura funziona se è intenzionale."]]},

{t:"Contrasto",d:1,
sp:"Le cose si notano per differenza da ciò che le circonda. Un punto rosso su un foglio bianco salta all'occhio, una frase breve dopo tante lunghe colpisce, una persona calma in una stanza agitata attira l'attenzione. Il modello ti aiuta a evidenziare ciò che conta e a capire perché alcune cose ti sembrano più grandi o più piccole di quanto siano.",
ap:["Il contrasto guida l'attenzione: nei testi, nelle immagini, nelle presentazioni. Se tutto è in grassetto, niente è in grassetto. Se vuoi che una cosa venga notata, rendila diversa da ciò che ha intorno.","Il contrasto influenza anche il giudizio. Un maglione da 80 euro sembra economico accanto a uno da 300; una giornata normale sembra pesante dopo una vacanza. I venditori lo usano, mostrando prima l'opzione più cara. Conoscerlo ti aiuta a non farti ingannare."],
ri:[["Tutto sembra uguale","Nessun elemento emerge."],["Prezzi «convenienti»","Una cosa sembra economica solo perché accanto ce n'è una carissima."],["Percezioni che cambiano","Lo stesso evento ti sembra diverso in momenti diversi."]],
es:[["Lavoro","In una presentazione evidenzi un solo numero in grande, in colore diverso. Tutti ricordano quello."],["Acquisti","Il venditore ti mostra prima un divano da 3.000 euro. Quello da 1.500 sembra un affare. Ti chiedi: lo comprerei se fosse il primo che vedo?"]],
ex:["Nel tuo prossimo documento, scegli una sola cosa da evidenziare e lascia tutto il resto semplice.","Prima di un acquisto, chiediti se il prezzo ti sembra buono solo per contrasto con un'altra opzione.","Introduci un contrasto positivo nella giornata: una pausa tranquilla dopo un momento intenso."],
q:["Cosa voglio che venga notato per primo?","Questa cosa mi sembra grande o piccola solo per il confronto?","Il mio messaggio ha un punto che spicca?"],
er:"Usare troppi contrasti: se tutto è evidenziato, niente lo è.",
qz:[["Vuoi che i lettori notino un dato importante. Cosa fai?",["Metti tutto in grassetto","Lo rendi diverso da tutto il resto","Lo nascondi nel testo","Lo ripeti dieci volte"],1,"Il contrasto guida l'attenzione."],["Perché un negozio mostra prima il prodotto più caro?",["Per errore","Per far sembrare conveniente quello successivo","Per legge","Perché è il migliore"],1,"Il contrasto cambia la percezione del prezzo."]]},

{t:"Inquadratura",d:2,
sp:"Il modo in cui presenti una situazione cambia il modo in cui viene giudicata. «Il 90% dei pazienti sopravvive» e «il 10% muore» dicono la stessa cosa, ma provocano reazioni diverse. Il modello ti aiuta a scegliere con cura le parole e a riconoscere quando qualcuno inquadra le cose per influenzarti.",
ap:["Gli psicologi Daniel Kahneman e Amos Tversky hanno mostrato che le persone scelgono diversamente davanti alla stessa informazione presentata come guadagno o come perdita. Tendiamo a evitare i rischi quando si parla di guadagni e a cercarli quando si parla di perdite.","Nella comunicazione puoi inquadrare un problema come una sfida, un errore come un'occasione per imparare, una richiesta come un beneficio per l'altro. Ma usalo con onestà. E quando ricevi un messaggio, prova a riformularlo in modo opposto per vedere se la tua reazione cambia."],
ri:[["Reazioni diverse allo stesso fatto","Le persone reagiscono molto a come è presentato."],["Parole cariche","Termini scelti per suscitare emozioni."],["Scelte influenzate","Una proposta sembra migliore per come è descritta."]],
es:[["Famiglia","Invece di dire «non giocare finché non hai fatto i compiti», dici «appena finisci i compiti puoi giocare». Il bambino reagisce meglio."],["Acquisti","«Yogurt magro al 95%» sembra più sano di «yogurt con il 5% di grassi». Ti accorgi che è la stessa cosa."]],
ex:["Prendi una notizia o una pubblicità e riscrivila con l'inquadratura opposta. Cambia la tua impressione?","Riformula una richiesta che devi fare in termini di beneficio per l'altro.","Quando racconti un problema, prova a presentarlo come una sfida da risolvere."],
q:["Come cambierebbe il giudizio se lo presentassi in modo opposto?","Chi ha scelto questa inquadratura e perché?","Sto usando le parole in modo onesto?"],
er:"Usare l'inquadratura per manipolare: quando viene scoperta, distrugge la fiducia.",
qz:[["«Il 90% sopravvive» e «il 10% muore» sono...",["Informazioni diverse","La stessa informazione con inquadrature diverse","Entrambe false","Senza significato"],1,"Cambia il modo di presentarla, non il fatto."],["Come difendersi dall'inquadratura?",["Leggere velocemente","Riformulare il messaggio nel modo opposto","Fidarsi della prima impressione","Ignorare i numeri"],1,"La riformulazione rivela l'effetto delle parole."]]},

{t:"Ritmo",d:2,
sp:"Il ritmo è l'alternanza di tensione e pausa, di veloce e lento, di pieno e vuoto. Tiene viva l'attenzione in una canzone, in un discorso, in una storia, ma anche in una giornata di lavoro o in un allenamento. Il modello ti aiuta a variare il passo invece di mantenere sempre la stessa intensità.",
ap:["Un discorso tutto allo stesso tono annoia, anche se il contenuto è buono. Una frase breve dopo una lunga dà forza. Una pausa prima di una parola importante la mette in risalto. I buoni narratori alternano momenti di azione e momenti di respiro.","Lo stesso vale per la vita: lavoro intenso e recupero, concentrazione e pausa, settimane piene e giorni vuoti. Gli atleti alternano carico e riposo perché è nel riposo che il corpo si rafforza. Senza ritmo arrivano stanchezza e noia."],
ri:[["Monotonia","Tutto procede allo stesso passo."],["Stanchezza continua","Non ci sono pause di recupero."],["Attenzione che cala","Il pubblico si distrae a metà."]],
es:[["Lavoro","Organizzi la giornata in blocchi di 50 minuti di concentrazione e 10 di pausa. Rendi di più e sei meno stanco."],["Comunicazione","Nel tuo discorso alterni frasi lunghe e brevi e fai una pausa prima del punto chiave. Tutti lo ricordano."]],
ex:["Rileggi un tuo testo e spezza una frase lunga in due più brevi nel punto più importante.","Pianifica la prossima settimana alternando giorni intensi e giorni leggeri.","In una conversazione, prova a fare una pausa di due secondi prima di dire la cosa più importante."],
q:["Dove serve una pausa?","Sto mantenendo la stessa intensità troppo a lungo?","Come posso alternare tensione e respiro?"],
er:"Confondere il ritmo con la velocità: a volte rallentare dà più forza.",
qz:[["Come rendere più efficace un punto importante in un discorso?",["Dirlo più velocemente","Fare una pausa prima di dirlo","Ripeterlo a voce bassa","Nasconderlo"],1,"La pausa crea attesa e risalto."],["Perché gli atleti alternano carico e riposo?",["Per pigrizia","Perché il corpo si rafforza durante il recupero","Per regolamento","Non lo fanno"],1,"Il ritmo tra sforzo e pausa migliora la prestazione."]]},

{t:"Melodia",d:2,
sp:"Una melodia è una sequenza di note riconoscibile che resta in mente. Nella comunicazione la melodia è il tema centrale, l'idea che ritorna e dà coerenza a tutto. Un messaggio, un progetto o un marchio con una melodia chiara si ricorda; uno che salta da un tema all'altro si dimentica.",
ap:["Le canzoni che ricordiamo hanno un ritornello che torna, con piccole variazioni. I discorsi memorabili hanno una frase chiave ripetuta. Anche le persone che lasciano il segno hanno una «melodia»: valori e comportamenti riconoscibili e costanti.","Per usarlo, chiediti qual è il tema centrale di ciò che stai comunicando o costruendo. Riportalo all'inizio, al centro e alla fine. Variazioni sì, ma il motivo deve essere riconoscibile."],
ri:[["Messaggio dispersivo","Parli di molte cose e nessuna resta."],["Nessuno ricorda il punto","Dopo una presentazione le persone non sanno dire di cosa parlava."],["Identità poco chiara","Un progetto o un marchio cambia direzione in continuazione."]],
es:[["Lavoro","In una presentazione ripeti tre volte la stessa idea chiave con esempi diversi. Alla fine tutti sanno riassumerla."],["Te stesso","Scegli un valore che vuoi ti rappresenti, come la puntualità, e lo mantieni costante. Gli altri iniziano a riconoscerlo."]],
ex:["Per il tuo prossimo messaggio importante, scrivi l'idea centrale in una frase sola e falla tornare almeno due volte.","Scrivi la «melodia» del tuo lavoro: il tema che vuoi che gli altri riconoscano.","Rileggi un tuo testo: c'è un filo che torna o sono tanti pezzi slegati?"],
q:["Qual è il tema centrale che deve restare?","Ritorna abbastanza spesso?","Le variazioni restano riconoscibili?"],
er:"Ripetere il tema senza variazioni, diventando noioso.",
qz:[["Cosa rende memorabile un discorso?",["Molti argomenti diversi","Un'idea centrale che ritorna","La lunghezza","Parole difficili"],1,"Il tema ripetuto con variazioni resta in mente."],["Cosa succede senza una melodia chiara?",["Il messaggio è più ricco","Il pubblico non ricorda il punto","Tutto è più chiaro","Nulla"],1,"Senza tema centrale il messaggio si disperde."]]},

{t:"Rappresentazione",d:2,
sp:"Ogni immagine, parola o dato è una scelta: mostra qualcosa e lascia fuori altro. Una foto inquadra una parte della scena, una statistica sceglie cosa misurare, un racconto sceglie chi è il protagonista. Il modello ti invita a chiederti cosa resta fuori dalla rappresentazione e chi l'ha scelta.",
ap:["Lo stesso evento può essere mostrato come una festa o come un disordine, a seconda di cosa si inquadra. Un grafico può sembrare drammatico o tranquillo cambiando la scala. Questo non significa che ogni rappresentazione menta, ma che nessuna è neutrale.","Quando comunichi, scegli la rappresentazione che aiuta a capire, non quella che ti dà ragione. Quando ricevi, chiediti: cosa non mi viene mostrato? Che effetto avrebbe una rappresentazione diversa?"],
ri:[["Immagini che emozionano","Una foto ti colpisce molto."],["Grafici impressionanti","Linee che sembrano salire o scendere moltissimo."],["Storie con un solo punto di vista","Si sente solo una voce."]],
es:[["Informazione","Un grafico mostra un aumento enorme dei prezzi. Guardi l'asse e scopri che parte da 98 invece che da 0: l'aumento è piccolo."],["Social","Le foto delle vacanze degli amici sembrano perfette. Ricordi che mostrano solo i momenti migliori."]],
ex:["Trova un grafico in una notizia e controlla da dove parte l'asse.","Scatta due foto dello stesso luogo con inquadrature diverse che raccontano due storie opposte.","Racconta un evento recente dal punto di vista di un'altra persona presente."],
q:["Cosa resta fuori da questa rappresentazione?","Chi ha scelto cosa mostrare, e perché?","Una rappresentazione diversa cambierebbe la mia idea?"],
er:"Pensare che una rappresentazione sia neutrale solo perché è un'immagine o un numero.",
qz:[["Un grafico con l'asse che parte da 98 invece che da 0...",["È sempre sbagliato","Può far sembrare enorme una variazione piccola","Mostra la realtà esatta","È più onesto"],1,"La scala cambia la percezione."],["Cosa suggerisce il modello davanti a una foto molto emozionante?",["Fidarsi","Chiedersi cosa è rimasto fuori dall'inquadratura","Condividerla subito","Ignorarla"],1,"Ogni immagine sceglie cosa mostrare."]]},

{t:"Equilibrio compositivo",d:2,
sp:"In un'immagine, in una pagina o in una stanza gli elementi hanno un peso visivo. Disporli in equilibrio guida lo sguardo e dà ordine; uno squilibrio voluto crea tensione e movimento. Il modello ti aiuta a organizzare ciò che presenti in modo che si capisca subito cosa conta.",
ap:["Un elemento grande, scuro o colorato pesa più di uno piccolo e chiaro. L'equilibrio può essere simmetrico (calmo, formale) o asimmetrico (dinamico, moderno). Lo spazio vuoto è parte della composizione: dà respiro e fa risaltare ciò che c'è.","Puoi applicarlo a una slide, una lettera, una vetrina, un piatto, una stanza. Chiediti dove cade lo sguardo per primo e se è il punto giusto. Toglierne è spesso più efficace che aggiungere."],
ri:[["Pagine affollate","Troppi elementi senza gerarchia."],["Sguardo che si perde","Non si capisce dove guardare."],["Ambiente che stanca","Una stanza o una scrivania disordinata."]],
es:[["Lavoro","Una slide con dieci elementi diventa una con un titolo, un'immagine e un numero. Tutti capiscono il messaggio in tre secondi."],["Casa","Togli metà degli oggetti dalla mensola del soggiorno. La stanza sembra più grande e quelli rimasti si notano."]],
ex:["Prendi una tua slide o un documento e togli almeno un terzo degli elementi.","Riorganizza una superficie di casa (scrivania, mensola) pensando a cosa deve catturare lo sguardo.","Guarda una pubblicità e chiediti dove cade l'occhio per primo e perché."],
q:["Dove cade lo sguardo per primo?","C'è abbastanza spazio vuoto?","Cosa posso togliere per rendere chiaro il punto principale?"],
er:"Riempire ogni spazio vuoto pensando che sia sprecato.",
qz:[["Come rendere più chiara una slide affollata?",["Aggiungere colori","Togliere elementi e lasciare spazio vuoto","Rimpicciolire il testo","Aggiungere immagini"],1,"Lo spazio vuoto fa risaltare ciò che conta."],["Un elemento grande e colorato in un'immagine...",["Non conta","Ha più peso visivo e attira lo sguardo","Va sempre al centro","Rovina l'equilibrio"],1,"Il peso visivo guida l'attenzione."]]},

{t:"Trama",d:2,
sp:"Una trama è una catena di cause ed effetti che trasforma una serie di fatti in una storia: qualcuno vuole qualcosa, incontra ostacoli e il finale cambia qualcosa. Le persone ricordano le storie molto meglio dei dati. Il modello ti aiuta a raccontare in modo coinvolgente e a capire come le storie influenzano il nostro modo di vedere i fatti.",
ap:["«Il re morì e poi morì la regina» è una sequenza; «il re morì e la regina morì di dolore» è una trama, perché collega i fatti con una causa. Una buona storia ha un inizio con una situazione, un problema che crea tensione, tentativi e ostacoli, e una risoluzione.","Usare la trama ti aiuta a presentare un progetto, a convincere, a insegnare. Ma il nostro amore per le storie ci fa anche vedere cause dove ci sono solo coincidenze. Chiediti se i collegamenti della storia sono veri o solo convenienti."],
ri:[["Dati che non convincono","Numeri giusti che nessuno ricorda."],["Spiegazioni troppo perfette","Una storia che collega tutto in modo impeccabile."],["Presentazioni piatte","Elenchi di fatti senza tensione."]],
es:[["Lavoro","Invece di elencare le caratteristiche del prodotto, racconti la storia di un cliente che aveva un problema, i tentativi falliti e come il prodotto l'ha risolto."],["Te stesso","Nel colloquio di lavoro racconti un'esperienza come una piccola storia: situazione, problema, cosa hai fatto, risultato."]],
ex:["Racconta un tuo successo recente in quattro frasi: situazione, problema, azione, risultato.","Trasforma una presentazione o una richiesta in una breve storia con un protagonista.","Leggi una notizia che racconta una storia perfetta e chiediti quali collegamenti potrebbero essere solo coincidenze."],
q:["Chi vuole cosa, e cosa glielo impedisce?","Quale cambiamento racconta questa storia?","I collegamenti causa-effetto sono veri o solo convenienti?"],
er:"Credere a una storia solo perché è ben raccontata.",
qz:[["Cosa trasforma una sequenza di fatti in una trama?",["La lunghezza","I collegamenti di causa ed effetto","I personaggi famosi","Le date"],1,"La trama collega i fatti con delle cause."],["Qual è il rischio del nostro amore per le storie?",["Ricordare troppo","Vedere cause dove ci sono solo coincidenze","Annoiarsi","Nessuno"],1,"Una storia convincente può essere falsa."]]},

{t:"Personaggio",d:2,
sp:"Ci appassioniamo a chi vuole qualcosa e affronta ostacoli per ottenerlo. Un buon personaggio ha un desiderio, dei limiti e cambia lungo la storia. Il modello ti aiuta a raccontare in modo più umano, ma anche a vedere le persone reali come personaggi complessi, con desideri e difficoltà, invece che come buoni o cattivi.",
ap:["Le storie funzionano quando c'è qualcuno con cui identificarsi. Una campagna sociale colpisce di più con il volto di una persona che con milioni di numeri. Un personaggio interessante non è perfetto: ha difetti, dubbi e scelte difficili.","Nella vita quotidiana puoi chiederti: cosa vuole questa persona? Cosa la ostacola? Come sta cambiando? Questo rende più facile capire comportamenti che sembrano strani. E puoi guardare anche te stesso come il personaggio di una storia: qual è il tuo desiderio e quale ostacolo stai affrontando?"],
ri:[["Racconti senza volti","Numeri e concetti senza persone."],["Giudizi in bianco e nero","Le persone sono solo buone o cattive."],["Ti senti senza direzione","Non sai cosa vuoi nella tua storia."]],
es:[["Lavoro","Per presentare un nuovo servizio racconti la giornata di Anna, una cliente tipo, con i suoi problemi reali. Il gruppo capisce subito il bisogno."],["Relazioni","Un collega ti sembra solo arrogante. Chiedendoti cosa vuole e cosa teme, scopri che ha paura di perdere il posto."]],
ex:["Descrivi una persona difficile della tua vita come un personaggio: cosa vuole, cosa teme, cosa la ostacola?","Scrivi il tuo desiderio principale di quest'anno e l'ostacolo più grande, come se fossi il protagonista di una storia.","Nella prossima presentazione, inserisci una persona concreta al posto di un dato astratto."],
q:["Cosa vuole davvero questa persona?","Cosa la ostacola?","Come sta cambiando, e come sto cambiando io?"],
er:"Ridurre le persone reali a personaggi semplici, buoni o cattivi.",
qz:[["Cosa rende interessante un personaggio?",["Essere perfetto","Avere un desiderio, ostacoli e difetti","Essere famoso","Non cambiare mai"],1,"Il conflitto tra desiderio e ostacoli coinvolge."],["Perché una campagna con il volto di una persona funziona meglio di molti numeri?",["Costa meno","Le persone si identificano con un individuo","È più breve","Per caso"],1,"Ci coinvolge chi ha un volto e una storia."]]},

{t:"Ambientazione",d:2,
sp:"Il contesto in cui succede qualcosa ne cambia il significato. Una risata a una festa e la stessa risata a un funerale hanno sensi opposti. Il modello ti invita a considerare sempre dove, quando e in che situazione avviene un fatto o un messaggio, e a scegliere il contesto giusto per ciò che vuoi comunicare.",
ap:["Nelle storie l'ambientazione non è solo uno sfondo: crea atmosfera e regole. Nella vita lo stesso consiglio può essere accolto o rifiutato a seconda del momento, del luogo e di chi è presente. Una critica in privato è un aiuto; la stessa in pubblico è un'umiliazione.","Prima di comunicare qualcosa di importante, chiediti se il luogo e il momento sono adatti. E quando giudichi un comportamento, chiediti in che contesto è avvenuto: spesso spiega molto."],
ri:[["Messaggio giusto nel momento sbagliato","Una buona idea viene rifiutata."],["Comportamenti fraintesi","Qualcosa ti sembra strano fuori dal suo contesto."],["Frasi citate a metà","Parole tolte dal contesto cambiano senso."]],
es:[["Famiglia","Vuoi parlare di soldi con il partner. Invece che la sera dopo una giornata pesante, scegli una passeggiata la domenica mattina."],["Lavoro","Una frase di un collega, riportata fuori contesto, sembra offensiva. Rileggendo tutta la conversazione capisci che era una battuta."]],
ex:["Per una conversazione importante che devi fare, scegli consapevolmente il luogo e il momento.","Quando leggi una citazione che ti indigna, cerca il contesto completo.","Cambia l'ambientazione di un'attività (studiare in biblioteca, riunione camminando) e osserva cosa cambia."],
q:["Dove e quando sta succedendo questo?","Il contesto cambia il significato?","Sto scegliendo il momento e il luogo giusti per questo messaggio?"],
er:"Usare il contesto come scusa per qualsiasi comportamento.",
qz:[["Perché la stessa critica può aiutare o ferire?",["Dipende dalle parole","Dipende anche dal contesto, ad esempio privato o pubblico","Non può aiutare","Dipende dal meteo"],1,"Il contesto cambia il significato del messaggio."],["Cosa fare davanti a una citazione scandalosa?",["Condividerla","Cercare il contesto completo","Crederci subito","Ignorarla"],1,"Fuori contesto le parole possono cambiare senso."]]},

{t:"Sottotesto",d:3,
sp:"Ciò che non viene detto spesso conta più di ciò che si dice. Un «va bene» detto a denti stretti, un silenzio, una domanda evitata: sono messaggi. Il sottotesto è il significato nascosto sotto le parole. Il modello ti aiuta ad ascoltare meglio e a comunicare in modo più consapevole.",
ap:["Nelle conversazioni reali molte cose passano per tono, gesti, tempi, scelte di parole. Chi chiede «hai finito quel lavoro?» può voler dire «sono preoccupato per la scadenza». Gli scrittori usano il sottotesto per rendere i dialoghi veri: i personaggi raramente dicono esattamente ciò che sentono.","Per ascoltare il sottotesto osserva il non detto e, quando non sei sicuro, chiedi con delicatezza: «Mi sembra che ci sia qualcosa che ti preoccupa, è così?». Quando comunichi, ricorda che anche tu mandi messaggi nascosti: assicurati che siano quelli che vuoi."],
ri:[["Risposte troppo brevi","«Ok», «va bene», «come vuoi»."],["Domande indirette","Qualcuno chiede una cosa per dirne un'altra."],["Silenzi","Argomenti evitati o pause lunghe."]],
es:[["Relazioni","Il partner dice «fai pure, esci con gli amici», ma con un tono freddo. Chiedi se c'è qualcosa che non va: si sentiva trascurato."],["Lavoro","Il capo chiede «quanto manca al progetto?» per la terza volta. Il sottotesto è ansia: gli mandi un aggiornamento chiaro ogni lunedì."]],
ex:["In una conversazione di oggi, nota una frase che probabilmente voleva dire altro. Cosa?","Quando senti un «va bene» poco convinto, prova a chiedere con calma cosa c'è dietro.","Rileggi un tuo messaggio prima di inviarlo e chiediti quale sottotesto potrebbe leggere l'altro."],
q:["Cosa non viene detto?","Cosa potrebbe voler dire davvero questa frase?","Quale messaggio nascosto sto mandando io?"],
er:"Vedere sottotesti ovunque e smettere di credere alle parole dirette.",
qz:[["Un amico risponde «Va bene, come vuoi tu» con tono freddo. Cosa suggerisce il modello?",["È d'accordo","Potrebbe esserci un disagio non detto: chiedi con delicatezza","Ignoralo","È arrabbiato con certezza"],1,"Il tono indica un possibile sottotesto da verificare."],["Qual è il rischio di cercare sempre il sottotesto?",["Capire troppo","Interpretare troppo e non credere più alle parole dirette","Nessuno","Parlare meno"],1,"A volte le parole significano proprio ciò che dicono."]]},

{t:"Esecuzione e interpretazione",d:2,
sp:"Un'idea vale per come viene realizzata e per come viene recepita. Due musicisti suonano lo stesso brano in modi diversissimi; lo stesso progetto può fallire o riuscire a seconda dell'esecuzione. Il modello ti ricorda che le idee sono solo l'inizio: contano la cura nel realizzarle e l'attenzione a come gli altri le interpreteranno.",
ap:["Molte persone hanno buone idee, poche le realizzano bene. L'esecuzione richiede dettagli, costanza, adattamenti. Una ricetta semplice eseguita con cura batte una ricetta sofisticata eseguita male. E ogni opera viene poi interpretata: chi legge, ascolta o usa porta la propria esperienza.","Per usarlo, dedica più energia alla realizzazione che alla ricerca dell'idea perfetta. Prova presto, chiedi come viene percepito ciò che fai e aggiusta. Ricorda che l'interpretazione degli altri non è un errore: è parte di come le cose esistono nel mondo."],
ri:[["Tante idee, pochi risultati","Progetti iniziati e mai finiti."],["Fraintendimenti","Gli altri capiscono cose diverse da ciò che intendevi."],["Attenzione solo al concetto","Trascuri i dettagli della realizzazione."]],
es:[["Lavoro","Due ristoranti hanno lo stesso menu. Uno ha piatti sempre caldi e personale attento: è pieno. L'altro è vuoto."],["Te stesso","Hai l'idea di un blog da anni. Pubblichi il primo articolo imperfetto, raccogli commenti e migliori quelli successivi."]],
ex:["Scegli un'idea che rimandi da tempo e realizzane una versione piccola e imperfetta questa settimana.","Chiedi a due persone come hanno interpretato un tuo lavoro o messaggio. Coincide con ciò che volevi?","In un compito di oggi, cura un dettaglio di esecuzione che di solito trascuri."],
q:["Sto curando la realizzazione quanto l'idea?","Come verrà interpretato da chi lo riceve?","Qual è la versione piccola che posso fare subito?"],
er:"Aspettare l'idea perfetta invece di migliorare con l'esecuzione.",
qz:[["Due aziende hanno la stessa idea. Cosa decide spesso il successo?",["Chi ha avuto l'idea per prima","La qualità dell'esecuzione","La fortuna sola","Il nome"],1,"Le idee valgono per come vengono realizzate."],["Perché chiedere come viene interpretato il tuo lavoro?",["Per avere complimenti","Perché gli altri possono capire cose diverse da quelle che intendevi","Non serve","Per obbligo"],1,"L'interpretazione fa parte della comunicazione."]]}
);

LIB.push(
{t:"Mille sostenitori autentici",c:"eco",tg:"Per vivere del proprio lavoro creativo può bastare un piccolo pubblico davvero affezionato.",d:1,
sp:"Lo scrittore Kevin Kelly ha proposto un'idea semplice: un artista, un artigiano o un piccolo imprenditore non ha bisogno di milioni di clienti. Gli bastano circa mille persone così affezionate da comprare tutto ciò che produce. Mille persone che spendono 100 euro l'anno fanno 100.000 euro. Il modello sposta l'attenzione dal pubblico enorme alla relazione profonda con pochi.",
ap:["Internet permette di raggiungere direttamente le persone giuste, ovunque siano. Invece di inseguire la popolarità, puoi servire bene un gruppo preciso: chi ama le tue ceramiche, chi segue le tue lezioni, chi compra le tue conserve. Questi sostenitori ti fanno anche pubblicità con il passaparola.","Il numero mille è indicativo: dipende da quanto vale ciò che offri e da quanto ti serve per vivere. Il modello funziona se hai un rapporto diretto con i clienti e se produci con continuità. Non funziona se dipendi da intermediari che si prendono gran parte del guadagno."],
ri:[["Inseguire i grandi numeri","Misuri il successo in follower invece che in persone che comprano."],["Clienti che tornano","Alcune persone ti cercano sempre: sono il tuo nucleo."],["Nicchia appassionata","Un piccolo gruppo ama molto ciò che fai."]],
es:[["Lavoro","Un'illustratrice smette di cercare viralità sui social e apre una newsletter. In due anni ha 900 abbonati che comprano le sue stampe e i suoi calendari."],["Te stesso","Un insegnante di chitarra crea un corso online per adulti principianti. Pochi iscritti, ma fedeli, gli permettono di lavorare meno ore."]],
ex:["Calcola quante persone ti servirebbero se ognuna spendesse una certa cifra all'anno per ciò che fai.","Scrivi chi sono i tuoi 10 sostenitori più fedeli e cosa apprezzano di te.","Crea un canale diretto con il tuo pubblico (lista email, gruppo, newsletter) e invita le prime 10 persone."],
q:["Chi sono le persone che amano davvero ciò che faccio?","Ho un rapporto diretto con loro?","Quanto mi serve, e quante persone servono per arrivarci?"],
er:"Trascurare i sostenitori fedeli per inseguire un pubblico enorme e distratto.",
qz:[["Qual è l'idea centrale dei mille sostenitori autentici?",["Servono milioni di follower","Un piccolo pubblico molto fedele può bastare per vivere del proprio lavoro","Bisogna vendere a tutti","Il prezzo deve essere basso"],1,"Conta la profondità del rapporto, non la quantità."],["Cosa rende il modello più difficile?",["Avere un rapporto diretto con i clienti","Dipendere da intermediari che trattengono gran parte del guadagno","Produrre con continuità","Avere una nicchia"],1,"Gli intermediari riducono quanto ti arriva da ogni sostenitore."]]},

{t:"Le quattro P del marketing",c:"lav",tg:"Prodotto, prezzo, posto e promozione: quattro leve da far lavorare insieme.",d:1,
sp:"Le quattro P sono un modo semplice per pensare a come proporre qualcosa agli altri: il Prodotto (cosa offri), il Prezzo (quanto costa), il Posto (dove e come si trova) e la Promozione (come lo fai conoscere). Se una delle quattro non funziona, le altre non bastano. Il modello è nato per il commercio ma serve anche per un'idea, un evento o un progetto personale.",
ap:["Il professore E. Jerome McCarthy rese popolare questo schema negli anni Sessanta. Il punto non è riempire quattro caselle, ma verificare che siano coerenti: un prodotto di lusso venduto in un discount, o un servizio economico promosso con pubblicità costose, crea confusione.","Usalo come lista di controllo: davanti a qualcosa che non vende o non attira, chiediti quale P è debole. Spesso il problema non è il prodotto ma il posto (non si trova) o la promozione (nessuno lo sa)."],
ri:[["Buon prodotto, poche vendite","Il problema è probabilmente in un'altra P."],["Messaggi incoerenti","Prezzo, posto e promozione raccontano storie diverse."],["Lancio di qualcosa di nuovo","Devi decidere come proporlo agli altri."]],
es:[["Lavoro","Un panificio fa ottimo pane ma è in una via nascosta. Cura il posto: cartello all'angolo e consegna in ufficio. Le vendite crescono."],["Te stesso","Organizzi un corso di yoga nel quartiere. Prodotto: lezione per principianti. Prezzo: prima prova gratis. Posto: la sala della parrocchia. Promozione: volantini in farmacia."]],
ex:["Scegli qualcosa che offri (lavoro, servizio, idea) e descrivi le tue quattro P in una riga ciascuna.","Trova la P più debole e scrivi una piccola azione per migliorarla.","Analizza un prodotto che ami: come sono coerenti le sue quattro P?"],
q:["Cosa offro esattamente e a chi?","Il prezzo, il posto e la promozione sono coerenti con il prodotto?","Quale delle quattro P è il punto debole?"],
er:"Concentrarsi solo sul prodotto pensando che si venda da solo.",
qz:[["Quali sono le quattro P?",["Prodotto, prezzo, posto, promozione","Persone, processi, prezzo, pubblicità","Piano, progetto, profitto, prova","Prodotto, pubblico, posto, potere"],0,"Sono le quattro leve classiche del marketing."],["Un buon prodotto non vende perché nessuno lo conosce. Quale P va migliorata?",["Prodotto","Prezzo","Promozione","Nessuna"],2,"Il problema è farlo conoscere."]]},

{t:"Le cinque fasi di un gruppo",c:"evo",tg:"Ogni gruppo nuovo passa per formazione, conflitto, regole, lavoro e chiusura.",d:2,
sp:"Lo psicologo Bruce Tuckman ha descritto le fasi che attraversa un gruppo: formazione (ci si conosce, tutti educati), conflitto (emergono differenze e tensioni), definizione delle regole (si trova un modo di lavorare), prestazione (il gruppo funziona bene) e scioglimento (il lavoro finisce). Sapere che il conflitto è una fase normale aiuta a non spaventarsi e a guidare il gruppo verso la fase successiva.",
ap:["Nelle prime settimane i gruppi sembrano armoniosi perché nessuno espone le proprie idee. Poi arrivano le discussioni su ruoli, metodi e priorità. Molti gruppi si bloccano qui o evitano il conflitto, restando superficiali. Chi lo attraversa con rispetto costruisce regole condivise e diventa molto più efficace.","Ogni volta che entra una persona nuova o cambia l'obiettivo, il gruppo può tornare indietro di una fase. Chi guida dovrebbe adattarsi: dare chiarezza all'inizio, mediare nel conflitto, fissare accordi, poi lasciare autonomia."],
ri:[["Educazione eccessiva","Nessuno dice cosa pensa davvero."],["Tensioni improvvise","Dopo un inizio tranquillo arrivano le discussioni."],["Gruppo che cambia","Entra o esce qualcuno e gli equilibri si rompono."]],
es:[["Lavoro","Un nuovo team litiga sulle scadenze al secondo mese. La responsabile capisce che è la fase del conflitto e organizza un incontro per scrivere le regole di lavoro."],["Te stesso","In un gruppo di volontari le prime discussioni sembrano la fine. Sapendo che è una fase, restate e trovate un metodo comune."]],
ex:["Pensa a un gruppo di cui fai parte: in quale delle cinque fasi si trova?","Se il tuo gruppo è nella fase del conflitto, proponi di scrivere insieme tre regole di lavoro.","Ripensa a un gruppo che si è sciolto: avete chiuso bene, riconoscendo ciò che avete fatto?"],
q:["In quale fase si trova questo gruppo?","Il conflitto che vedo è una fase normale o un problema serio?","Cosa serve per passare alla fase successiva?"],
er:"Evitare ogni conflitto: il gruppo resta in superficie e non diventa mai efficace.",
qz:[["Un gruppo nuovo inizia a litigare dopo poche settimane. Cosa dice il modello?",["Il gruppo è fallito","È una fase normale da attraversare definendo regole","Bisogna sostituire tutti","Bisogna ignorare il problema"],1,"Il conflitto è la seconda fase tipica."],["Cosa succede quando entra un nuovo membro?",["Nulla","Il gruppo può tornare a una fase precedente","Il gruppo si scioglie","Aumenta subito la prestazione"],1,"Gli equilibri vanno ricostruiti."]]},

{t:"I cinque perché",c:"rag",tg:"Chiedi «perché?» più volte di fila per arrivare alla causa vera di un problema.",d:1,
sp:"Quando qualcosa va storto, la prima spiegazione è spesso solo un sintomo. La tecnica dei cinque perché, usata nelle fabbriche Toyota, consiste nel chiedere «perché?» più volte di seguito, finché arrivi a una causa su cui puoi agire davvero. Il numero cinque è indicativo: a volte bastano tre domande, a volte ne servono di più.",
ap:["Esempio: l'auto non parte. Perché? La batteria è scarica. Perché? L'alternatore non la ricarica. Perché? La cinghia è rotta. Perché? Era consumata. Perché? Non è stata controllata durante la manutenzione. La soluzione vera non è cambiare la batteria, ma programmare i controlli.","Il limite è che i problemi complessi hanno spesso più cause, non una catena unica. Conviene fare l'esercizio con altre persone, verificare ogni risposta con i fatti e fermarsi quando trovi una causa che dipende da un processo, non da una persona da incolpare."],
ri:[["Problemi che ritornano","Risolvi un guasto e dopo un po' si ripresenta."],["Soluzioni tampone","Rimedi in fretta senza capire l'origine."],["Colpa a una persona","Ti fermi a «è colpa di Marco»."]],
es:[["Casa","Arrivi sempre in ritardo al lavoro. Perché? Esci tardi. Perché? Cerchi le chiavi. Perché? Non hanno un posto fisso. Soluzione: un gancio vicino alla porta."],["Lavoro","I clienti si lamentano dei ritardi. Chiedendo cinque volte perché, il gruppo scopre che gli ordini arrivano via email e nessuno li controlla il venerdì."]],
ex:["Scegli un piccolo problema ricorrente e scrivi la catena dei cinque perché.","Fai l'esercizio con un'altra persona su un problema comune e confrontate le risposte.","Quando la catena arriva a una persona da incolpare, chiedi ancora un perché sul processo."],
q:["Perché è successo, davvero?","Questa risposta è un fatto o un'ipotesi?","Ho trovato una causa su cui posso agire?"],
er:"Fermarsi alla prima risposta o cercare un colpevole invece di una causa.",
qz:[["A cosa servono i cinque perché?",["A trovare un colpevole","A risalire dalla causa apparente alla causa vera","A perdere tempo","A fare domande ai bambini"],1,"Ogni perché scava un livello più a fondo."],["Qual è un limite della tecnica?",["È troppo lenta","I problemi complessi possono avere più cause, non una catena sola","Funziona solo in fabbrica","Non ha limiti"],1,"Conviene verificare con i fatti e considerare più rami."]]},

{t:"Le sette P delle riunioni",c:"lav",tg:"Scopo, risultato, persone, partecipazione, problemi probabili, processo e aspetti pratici.",d:1,
sp:"Molte riunioni sono inutili perché nessuno le ha preparate. Le sette P sono una lista di controllo per prepararne una buona: Proposito (perché ci troviamo), Prodotto (cosa avremo alla fine), Persone (chi serve davvero), Partecipazione (come coinvolgerle), Problemi probabili (cosa potrebbe andare storto), Processo (la scaletta) e aspetti Pratici (luogo, orario, strumenti).",
ap:["La P più importante è il prodotto: una riunione deve finire con qualcosa di concreto, come una decisione, un elenco di idee o un piano. Se non sai dire quale sarà il risultato, forse basta una mail.","Preparare le sette P richiede dieci minuti e può far risparmiare ore a tutti. Funziona anche per incontri informali: una cena di famiglia per decidere le vacanze o un incontro tra vicini."],
ri:[["Riunioni senza risultato","Si parla molto e non si decide nulla."],["Persone inutili presenti","Metà dei partecipanti non serve."],["Sempre gli stessi a parlare","Gli altri restano in silenzio."]],
es:[["Lavoro","Prima di una riunione scrivi in alto all'invito: «Alla fine avremo scelto il fornitore». La discussione resta concentrata e dura metà del solito."],["Famiglia","Per decidere le vacanze organizzate una cena con scopo chiaro, tre opzioni preparate e un tempo massimo. Si decide in un'ora."]],
ex:["Per la prossima riunione che organizzi, scrivi le sette P in sette righe.","Scrivi il «prodotto» della riunione nell'invito.","Rivedi la lista dei partecipanti e togli chi non serve davvero."],
q:["Cosa avremo in mano alla fine?","Chi serve davvero?","Come faccio parlare anche chi di solito tace?"],
er:"Convocare una riunione senza sapere quale risultato deve produrre.",
qz:[["Quale P indica cosa si ottiene alla fine della riunione?",["Persone","Prodotto","Processo","Pratica"],1,"Il prodotto è il risultato concreto."],["Se non sai quale risultato deve produrre una riunione, cosa suggerisce il modello?",["Farla più lunga","Valutare se basta una mail","Invitare più persone","Farla subito"],1,"Senza un prodotto chiaro la riunione rischia di essere inutile."]]},

{t:"Migliorare togliendo",c:"rag",tg:"Spesso la soluzione migliore è eliminare qualcosa, non aggiungere.",d:2,
sp:"Davanti a un problema tendiamo ad aggiungere: un'altra regola, un altro oggetto, un'altra attività. Le ricerche di Leidy Klotz mostrano che quasi non consideriamo l'opzione di togliere. Il modello ti invita a chiederti prima di tutto: cosa posso eliminare? Spesso togliere semplifica, costa meno e funziona meglio.",
ap:["In un esperimento alle persone veniva chiesto di stabilizzare una struttura di mattoncini. La maggior parte aggiungeva pezzi, anche se togliere un mattoncino era più semplice ed economico. Lo stesso accade nelle agende piene, nelle case affollate, nei processi complicati.","Per usarlo, aggiungi la domanda «cosa tolgo?» a ogni decisione. Elimina riunioni, passaggi, oggetti, impegni. Un'antica idea simile è la via negativa: migliorare evitando ciò che fa male, più che aggiungendo ciò che fa bene."],
ri:[["Agenda piena","Aggiungi impegni senza toglierne."],["Regole su regole","Ogni problema genera una nuova procedura."],["Spazi affollati","Casa o scrivania piene di cose."]],
es:[["Lavoro","Per ridurre gli errori nelle pratiche, invece di un nuovo controllo si eliminano due campi inutili del modulo. Gli errori calano."],["Salute","Invece di aggiungere integratori, togli le bevande zuccherate. Il beneficio è maggiore e costa meno."]],
ex:["Per un problema attuale, scrivi tre cose che potresti togliere invece di aggiungere.","Elimina un impegno ricorrente dalla tua settimana.","Togli dieci oggetti da una stanza e osserva come cambia."],
q:["Cosa posso togliere?","Questa aggiunta risolve il problema o lo complica?","Cosa smetterei di fare se partissi da zero?"],
er:"Togliere ciò che regge il sistema. Prima di eliminare, capisci a cosa serve.",
qz:[["Cosa mostrano le ricerche sul migliorare togliendo?",["Le persone tolgono troppo","Le persone tendono ad aggiungere e trascurano l'opzione di togliere","Togliere è sempre sbagliato","Aggiungere costa meno"],1,"Togliere è un'opzione spesso dimenticata."],["Vuoi una giornata meno stressante. Quale azione segue il modello?",["Aggiungere un'app di produttività","Eliminare un impegno inutile","Svegliarsi prima","Fare più pause caffè"],1,"Togliere riduce il carico."]]},

{t:"ADKAR: accompagnare il cambiamento",c:"app",tg:"Consapevolezza, desiderio, conoscenza, capacità e rinforzo: i cinque passi di ogni cambiamento.",d:2,
sp:"Il modello ADKAR, creato da Jeff Hiatt, dice che una persona cambia davvero solo se attraversa cinque passi: Consapevolezza (capisco perché serve cambiare), Desiderio (voglio cambiare), Conoscenza (so come fare), Capacità (riesco a farlo nella pratica) e Rinforzo (il cambiamento viene sostenuto nel tempo). Se un cambiamento si blocca, cerca il passo mancante.",
ap:["Molti cambiamenti falliscono perché si salta direttamente alla formazione (conoscenza) senza aver creato consapevolezza e desiderio. Oppure si spiega tutto bene ma non si dà tempo di fare pratica, o non si rinforza il nuovo comportamento e le persone tornano alle vecchie abitudini.","Il modello funziona per le organizzazioni ma anche per te stesso o per la tua famiglia. Davanti a un cambiamento che non parte, chiediti: qual è il primo passo che manca? Lavora su quello prima di passare al successivo."],
ri:[["Formazione che non cambia nulla","Le persone sanno, ma non fanno."],["Resistenza","Le persone non vedono il motivo del cambiamento."],["Ritorno al vecchio","Dopo un po' tutto torna come prima."]],
es:[["Lavoro","Un'azienda introduce un nuovo software e organizza corsi. Nessuno lo usa. Mancavano consapevolezza e desiderio: nessuno aveva spiegato quali problemi risolveva."],["Famiglia","Vuoi che i figli riordinino la camera. Spieghi perché (consapevolezza), trovi una ricompensa (desiderio), mostri come (conoscenza), fate insieme (capacità), lodi i progressi (rinforzo)."]],
ex:["Scegli un cambiamento che vuoi fare e dai un voto da 1 a 5 a ciascuno dei cinque passi.","Individua il primo passo debole e scrivi un'azione per rafforzarlo.","Pensa a un cambiamento fallito in passato: quale passo mancava?"],
q:["La persona capisce perché serve cambiare?","Lo vuole davvero?","Sa come fare, riesce a farlo, e qualcosa la sostiene nel tempo?"],
er:"Saltare subito alla formazione senza creare consapevolezza e desiderio.",
qz:[["Cosa significa la R di ADKAR?",["Risorse","Rinforzo","Risultato","Regole"],1,"Il rinforzo sostiene il cambiamento nel tempo."],["Le persone conoscono il nuovo metodo ma non lo usano. Cosa può mancare?",["Conoscenza","Desiderio o capacità pratica","Consapevolezza del software","Nulla"],1,"Sapere non basta: servono volontà e pratica."]]},

{t:"L'effetto del dare consigli",c:"app",tg:"Dare un consiglio a qualcun altro aumenta la tua motivazione a seguirlo.",d:2,
sp:"Di solito pensiamo che chi è in difficoltà abbia bisogno di ricevere consigli. Le ricerche di Lauren Eskreis-Winkler mostrano un effetto sorprendente: chi dà un consiglio diventa più motivato e sicuro di sé, anche più di chi lo riceve. Spiegare agli altri cosa fare ci ricorda ciò che sappiamo e ci impegna a farlo anche noi.",
ap:["In uno studio, studenti in difficoltà a cui veniva chiesto di dare consigli a compagni più giovani studiavano di più rispetto a quelli che ricevevano consigli da esperti. Dare un consiglio ti mette nel ruolo di chi sa, aumenta la fiducia e crea coerenza tra ciò che dici e ciò che fai.","Puoi usarlo su te stesso: se vuoi risparmiare, fare sport o studiare, prova a dare consigli a qualcuno con lo stesso obiettivo. Ma resta onesto: i consigli devono essere sensati, e l'effetto non sostituisce l'azione."],
ri:[["Ti senti bloccato","Pensi di aver bisogno solo di aiuto dagli altri."],["Sai più di quanto credi","Hai già esperienza ma non la usi."],["Gruppi di pari","Persone con lo stesso obiettivo."]],
es:[["Salute","Vuoi smettere di fumare. Ti offri di dare consigli a un amico che vuole fare lo stesso. Spiegandoglieli, ti senti più impegnato."],["Studio","Uno studente fa da tutor a uno più giovane. I suoi voti migliorano perché ripassa e si sente più capace."]],
ex:["Scegli un tuo obiettivo e scrivi tre consigli che daresti a un amico con lo stesso obiettivo. Poi seguili.","Questa settimana offri un consiglio pratico a qualcuno su un tema che conosci.","Crea o unisciti a un piccolo gruppo dove ognuno consiglia gli altri."],
q:["Che consiglio darei a un amico in questa situazione?","Sto già seguendo il consiglio che darei?","A chi potrei offrire aiuto su questo tema?"],
er:"Dare consigli senza seguirli: la coerenza è ciò che produce l'effetto.",
qz:[["Cosa mostrano le ricerche sull'effetto del dare consigli?",["Solo chi riceve consigli migliora","Anche chi dà consigli diventa più motivato","I consigli non servono","Bisogna evitare di consigliare"],1,"Dare consigli aumenta motivazione e fiducia."],["Come usare il modello per un tuo obiettivo?",["Chiedere consigli a tutti","Dare consigli a qualcuno con lo stesso obiettivo","Leggere di più","Aspettare"],1,"Consigliare ti impegna a fare."]]},

{t:"Metodo agile",c:"lav",tg:"Lavora in cicli brevi, consegna spesso, ascolta il feedback e correggi.",d:2,
sp:"Il metodo agile nasce nello sviluppo software, con il Manifesto Agile del 2001. Invece di pianificare tutto all'inizio e consegnare dopo mesi, si lavora in cicli brevi, si consegna qualcosa di utile spesso, si ascolta chi lo usa e si corregge la rotta. È utile ogni volta che il risultato finale non è chiaro fin dall'inizio.",
ap:["I principi chiave sono: le persone e il dialogo contano più dei processi rigidi, qualcosa di funzionante conta più di documenti perfetti, la collaborazione con il cliente conta più dei contratti, rispondere al cambiamento conta più che seguire un piano.","Nella vita quotidiana puoi applicarlo ai progetti personali: invece di preparare tutto per mesi, fai una prima versione in una settimana, mostrala, raccogli reazioni e migliora. Non è adatto quando un errore è molto costoso e non si può correggere dopo."],
ri:[["Piani che invecchiano","Quando finisci, le esigenze sono cambiate."],["Feedback tardivo","Scopri cosa non va solo alla fine."],["Requisiti poco chiari","Nessuno sa esattamente cosa vuole."]],
es:[["Lavoro","Un gruppo deve creare un nuovo sito. Invece di sei mesi di lavoro, pubblica ogni due settimane una parte e la fa provare ai clienti."],["Casa","Ristrutturi casa una stanza alla volta, vivendo ogni stanza prima di decidere la successiva."]],
ex:["Prendi un progetto lungo e definisci una prima versione utile da completare in una settimana.","Mostra la prima versione a due persone e chiedi un commento.","Organizza la prossima settimana in un ciclo: obiettivo il lunedì, revisione il venerdì."],
q:["Qual è la versione più piccola utile che posso consegnare?","Chi può darmi un riscontro presto?","Cosa ho imparato in questo ciclo?"],
er:"Usare l'agilità come scusa per non pianificare nulla.",
qz:[["Cosa caratterizza il metodo agile?",["Un piano dettagliato fisso","Cicli brevi, consegne frequenti e correzioni","Nessun obiettivo","Lavorare da soli"],1,"Si impara dal feedback continuo."],["Quando l'agile è meno adatto?",["Quando i requisiti cambiano","Quando un errore è molto costoso e non correggibile","Nei progetti personali","Nei piccoli gruppi"],1,"Serve la possibilità di correggere."]]},

{t:"Lavorare a ritroso dal cliente",c:"lav",tg:"Parti dall'esperienza che vuoi dare a chi usa il risultato, poi costruisci all'indietro.",d:2,
sp:"Amazon ha reso famoso un metodo: prima di creare un prodotto, si scrive il comunicato stampa del giorno del lancio e le domande frequenti dei clienti. Se il comunicato non entusiasma, il progetto si ferma. Lavorare a ritroso significa partire da cosa vuole e cosa vivrà la persona che userà il risultato, e solo dopo decidere come costruirlo.",
